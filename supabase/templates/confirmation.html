<!doctype html>
<html lang="ja">
  <body style="margin:0;background:#f7f7f8;color:#1b1b1f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
      <div style="background:#ffffff;border:1px solid #e8e8ec;border-radius:16px;padding:28px;">
        <p style="margin:0;color:#3f4eb5;font-size:13px;font-weight:700;letter-spacing:.12em;">mikkeOS</p>
        <h1 style="margin:14px 0 0;font-size:24px;line-height:1.5;">メールアドレスを確認してください</h1>
        <p style="margin:16px 0 0;font-size:15px;line-height:1.8;color:#5f6068;">mikkeOSへの新規登録を受け付けました。下のボタンを押すと登録が完了し、手続きを始めた画面へ戻ります。</p>
        <p style="margin:24px 0;text-align:center;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f75a3b;color:#ffffff;text-decoration:none;font-weight:700;border-radius:12px;padding:14px 24px;">メールアドレスを確認する</a>
        </p>
        <p style="margin:0;font-size:12px;line-height:1.7;color:#85868e;">この登録に心当たりがない場合は、ボタンを押さずにこのメールを削除してください。mikkeOSからパスワードをメールでお尋ねすることはありません。</p>
      </div>
      <p style="margin:16px 0 0;text-align:center;font-size:12px;color:#85868e;">mikkeOS</p>
    </div>
  </body>
</html>
