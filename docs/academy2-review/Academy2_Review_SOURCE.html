r:7}\n}\n\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n  <aside class=\"side\">\n    <div class=\"brand\">mikkeOS<small>Academy｜講師</small></div>\n    <div class=\"nav\">\n      <div>ホーム</div>\n      <div class=\"on\">申込</div>\n      <div>開催</div>\n      <div>開講</div>\n      <div>修了報告</div>\n      <div>講師マニュアル</div>\n      <div>Community</div>\n      <div>本部メッセージ</div>\n      <div>営業ページ</div>\n      <div>設定</div>\n    </div>\n  </aside>\n\n  <div>\n    <header class=\"top\">\n      <strong>灯りのアトリエ｜講師ページ</strong>\n      <span>鈴木 里奈 ▾</span>\n    </header>\n\n    <main class=\"wrap\">\n\n      <section class=\"view on\" id=\"listView\">\n        <div class=\"titlebar\">\n          <div class=\"en\">APPLICATIONS</div>\n          <div class=\"jp\">申込</div>\n        </div>\n        <div class=\"headbox\">\n          <p>申込後の対応はここで進めます。受講者との連絡、日程、受講料確認、開講ライセンス申込、開催、修了まで受講者ごとに管理します。</p>\n        </div>\n\n        <div class=\"tools\">\n          <input class=\"search\" placeholder=\"名前・講座名で検索\">\n          <button class=\"filter on\">対応待ち</button>\n          <button class=\"filter\">日程調整中</button>\n          <button class=\"filter\">入金確認待ち</button>\n          <button class=\"filter\">開講準備</button>\n          <button class=\"filter\">開催確定</button>\n          <button class=\"filter\">完了</button>\n          <button class=\"filter\">すべて</button>\n        </div>\n\n        <div class=\"list\">\n          <div class=\"application\" onclick=\"openDetail()\">\n            <div class=\"avatar\">田</div>\n            <div>\n              <h3>田中 花子</h3>\n              <div class=\"meta\">\n                <span>ベーシックキャンドルコース</span>\n                <span>オンライン希望</span>\n                <span>9/25申込</span>\n              </div>\n            </div>\n            <div class=\"right\">\n              <span class=\"status orange\">対応待ち</span>\n              <div class=\"next\">次：日程確認</div>\n            </div>\n          </div>\n\n          <div class=\"application\" onclick=\"openDetail()\">\n            <div class=\"avatar\">佐</div>\n            <div>\n              <h3>佐藤 由美</h3>\n              <div class=\"meta\">\n                <span>ベーシックキャンドルコース</span>\n                <span>対面</span>\n                <span>10/8 13:00</span>\n              </div>\n            </div>\n            <div class=\"right\">\n              <span class=\"status yellow\">開講準備</span>\n              <div class=\"next\">次：ライセンス申込</div>\n            </div>\n          </div>\n\n          <div class=\"application\" onclick=\"openDetail()\">\n            <div class=\"avatar\">山</div>\n            <div>\n              <h3>山本 美香</h3>\n              <div class=\"meta\">\n                <span>ベーシックキャンドルコース</span>\n                <span>対面</span>\n                <span>10/2 11:00</span>\n              </div>\n            </div>\n            <div class=\"right\">\n              <span class=\"status green\">開催確定</span>\n              <div class=\"next\">キット発送済</div>\n            </div>\n          </div>\n\n          <div class=\"application\" onclick=\"openDetail()\">\n            <div class=\"avatar\">高</div>\n            <div>\n              <h3>高橋 舞</h3>\n              <div class=\"meta\">\n                <span>ベーシックキャンドルコース</span>\n                <span>オンライン</span>\n                <span>9/20終了</span>\n              </div>\n            </div>\n            <div class=\"right\">\n              <span class=\"status gray\">修了報告待ち</span>\n              <div class=\"next\">次：修了報告</div>\n            </div>\n          </div>\n        </div>\n      </section>\n\n      <section class=\"view\" id=\"detailView\">\n        <div class=\"detail-head\">\n          <div class=\"detail-title\">\n            <button class=\"back\" onclick=\"backToList()\">← 申込一覧へ</button>\n            <h1>田中 花子</h1>\n            <p>ベーシックキャンドルコース｜オンライン希望</p>\n          </div>\n          <div class=\"detail-actions\">\n            <button class=\"btn\">受講者ページを見る</button>\n            <button class=\"btn blue\">受講者にメールする</button>\n          </div>\n        </div>\n\n        <div class=\"progress\">\n          <div class=\"step done\"><b>✓</b>申込</div>\n          <div class=\"step current\" id=\"stepSchedule\"><b>2</b>日程</div>\n          <div class=\"step\" id=\"stepPayment\"><b>3</b>支払い</div>\n          <div class=\"step\" id=\"stepLicense\"><b>4</b>開講準備</div>\n          <div class=\"step\" id=\"stepEvent\"><b>5</b>開催</div>\n          <div class=\"step\" id=\"stepFinish\"><b>6</b>修了</div>\n        </div>\n\n        <div class=\"detail-grid\">\n          <div class=\"stack\">\n\n            <section class=\"card green-soft order-application\">\n              <h2>申込内容</h2>\n              <div class=\"desc\">お客様が申込時に入力した内容です。</div>\n              <div class=\"row\"><b>申込日</b><span>2026/09/25 09:12</span></div>\n              <div class=\"row\"><b>メール</b><span>hanako@example.com</span></div>\n              <div class=\"row\"><b>電話番号</b><span>090-1234-5678</span></div>\n              <div class=\"row\"><b>受講方法</b><span>オンライン</span></div>\n              <div class=\"row\"><b>希望日</b><span>10/10・10/12・10/15</span></div>\n              <div class=\"row\"><b>備考</b><span>平日は14時以降希望</span></div>\n            </section>\n\n            <section class=\"card order-mail\" id=\"mailHistoryCard\">\n              <h2>自動メール履歴</h2>\n              <div class=\"desc\">申込や日程確定時に、講師の登録メールアドレスを返信先として自動送信されます。</div>\n\n              <div class=\"timeline\">\n                <div class=\"log\">\n                  <span class=\"dot\"></span>\n                  <div>\n                    <strong>申込受付メール</strong>\n                    <p>9/25 09:12 送信済み</p>\n                    <button class=\"btn\" style=\"margin-top:7px\" onclick=\"openMailPreview('申込受付メール')\">内容を見る</button>\n                  </div>\n                </div>\n                <div class=\"log\">\n                  <span class=\"dot\"></span>\n                  <div>\n                    <strong>日程確定メール</strong>\n                    <p>日程確定時に自動送信</p>\n                    <button class=\"btn\" style=\"margin-top:7px\" onclick=\"openMailPreview('日程確定メール')\">内容を見る</button>\n                  </div>\n                </div>\n              </div>\n\n              <div class=\"actionbox\">\n                <strong>日程調整などの個別連絡</strong>\n                <p>講師のメールから受講者と直接連絡を取り、日程を決めてください。</p>\n                <div class=\"row\" style=\"padding-bottom:0\">\n                  <b>受講者メール</b>\n                  <span>hanako@example.com</span>\n                </div>\n                <div class=\"buttons\">\n                  <button class=\"btn blue\">受講者にメールする</button>\n                </div>\n              </div>\n            </section>\n\n            <section class=\"card green-soft order-schedule\" id=\"scheduleCard\">\n              <h2>日程</h2>\n              <div class=\"desc\">「申込後に日程相談」の申込です。候補日を確認して確定します。</div>\n\n              <div class=\"grid2\">\n                <div class=\"field\">\n                  <label>開催日</label>\n                  <input type=\"date\" value=\"2026-10-10\">\n                </div>\n                <div class=\"field\">\n                  <label>時間</label>\n                  <input value=\"14:00 - 16:00\">\n                </div>\n              </div>\n\n              <div class=\"field\">\n                <label>参加URL</label>\n                <input value=\"https://zoom.us/j/example\">\n              </div>\n\n              <div class=\"buttons\">\n                <button class=\"btn blue\" onclick=\"confirmSchedule()\">この日程で確定</button>\n                <button class=\"btn\">候補日をメールする</button>\n              </div>\n            </section>\n\n            <section class=\"card order-payment\" id=\"paymentCard\">\n              <h2>受講料</h2>\n              <div class=\"desc\">この講座の受講料です。受講者様からの入金を確認します。</div>\n              <div class=\"row\"><b>受講料</b><span>¥18,000</span></div>\n              <div class=\"row\"><b>決済方法</b><span>銀行振込</span></div>\n              <div class=\"row\"><b>状態</b><span id=\"paymentStatus\"><span class=\"pill orange\">入金確認待ち</span></span></div>\n              <div class=\"buttons\">\n                <button class=\"btn green\" onclick=\"markPaid()\">入金済みにする</button>\n                <button class=\"btn\">支払い案内を再送</button><button class=\"btn\" onclick=\"openMailPreview('支払い案内メール')\">メール内容を見る</button>\n              </div>\n            </section>\n\n            <section class=\"card green-soft order-license\" id=\"licenseCard\">\n              <h2>開講ライセンス申込</h2>\n              <div class=\"desc\">この講座を開講するためのライセンス費用です。本部へ申込をおこないます。</div>\n\n              <div class=\"license-box\">\n                <h3>ベーシックキャンドルコース｜開講ライセンス ¥8,000</h3>\n                <p>この講座の設定では、以下が開講ライセンスに含まれています。</p>\n                <div class=\"license-items\">\n                  <span>キット</span>\n                  <span>テキスト</span>\n                  <span>デュプロマ</span>\n                  <span>教材</span>\n                  <span>システム利用</span>\n                </div>\n              </div>\n\n              <div class=\"row\"><b>状態</b><span id=\"licenseStatus\"><span class=\"pill orange\">未申込</span></span></div>\n              <div class=\"buttons\">\n                <button class=\"btn orange\" id=\"licenseButton\" onclick=\"openLicenseModal()\">開講ライセンスを申し込む</button>\n              </div>\n            </section>\n\n            <section class=\"card order-kit\" id=\"kitCard\">\n              <h2>キット・発送</h2>\n              <div class=\"desc\">開講ライセンスに含まれるキットの発送状況です。</div>\n              <div class=\"row\"><b>キット</b><span>あり</span></div>\n              <div class=\"row\"><b>発送先</b><span>講師登録住所</span></div>\n              <div class=\"row\"><b>発送状態</b><span id=\"kitStatus\"><span class=\"pill gray\">ライセンス申込前</span></span></div>\n              <div class=\"actionbox\">\n                <strong>講師側で発送操作は不要です</strong>\n                <p>開講ライセンス申込後、本部が発送準備を行います。発送されるとここに追跡情報を表示します。</p>\n              </div>\n            </section>\n\n            <section class=\"card green-soft order-finish\" id=\"finishCard\">\n              <h2>開催・修了</h2>\n              <div class=\"desc\">開催後は出席を確認し、修了報告を行います。</div>\n              <div class=\"row\"><b>出席</b><span id=\"attendanceStatus\"><span class=\"pill gray\">未確認</span></span></div>\n              <div class=\"buttons\">\n                <button class=\"btn\" onclick=\"markAttendance()\">出席済みにする</button>\n                <button class=\"btn blue\" onclick=\"openFinishModal()\">修了報告をする</button>\n              </div>\n            </section>\n\n          </div>\n\n          <aside class=\"stack\">\n            <section class=\"card mobile-status\">\n              <h2>ステータス</h2>\n              <div class=\"row\"><b>現在</b><span><span class=\"pill orange\">日程調整中</span></span></div>\n            </section>\n            <section class=\"card green-soft mobile-next\">\n              <h2>今やること</h2>\n              <div class=\"actionbox\" id=\"nextAction\">\n                <strong>日程を確定してください</strong>\n                <p>受講者の希望日を確認し、開催日と時間を決めます。</p>\n                <button class=\"btn orange\" onclick=\"document.getElementById('scheduleCard').scrollIntoView({behavior:'smooth'})\">日程設定へ</button>\n              </div>\n            </section>\n\n            <section class=\"card mobile-current\">\n              <h2>現在の状況</h2>\n              <div class=\"row\"><b>日程</b><span id=\"sideSchedule\">未確定</span></div>\n              <div class=\"row\"><b>受講料</b><span id=\"sidePayment\">未入金</span></div>\n              <div class=\"row\"><b>開講ライセンス</b><span id=\"sideLicense\">未申込</span></div>\n              <div class=\"row\"><b>キット</b><span id=\"sideKit\">未手配</span></div>\n              <div class=\"row\"><b>修了</b><span id=\"sideFinish\">未開催</span></div>\n            </section>\n\n            </aside>\n        </div>\n      </section>\n\n    </main>\n  </div>\n</div>\n\n<div class=\"modal-bg\" id=\"licenseModal\" onclick=\"if(event.target===this)closeModal('licenseModal')\">\n  <div class=\"modal\">\n    <div class=\"modal-head\">\n      <strong>開講ライセンス申込</strong>\n      <button onclick=\"closeModal('licenseModal')\">×</button>\n    </div>\n    <div class=\"modal-body\">\n      <div class=\"summary\">\n        <div><b>講師</b><span>鈴木 里奈</span></div>\n        <div><b>受講者</b><span>田中 花子</span></div>\n        <div><b>講座</b><span>ベーシックキャンドルコース</span></div>\n        <div><b>開講ライセンス料</b><span>¥8,000</span></div>\n      </div>\n\n      <div class=\"license-box\">\n        <h3>含まれるもの</h3>\n        <div class=\"license-items\">\n          <span>キット</span><span>テキスト</span><span>デュプロマ</span><span>教材</span><span>システム利用</span>\n        </div>\n      </div>\n\n      <div class=\"field\">\n        <label>キット発送先</label>\n        <select>\n          <option>講師登録住所へ発送</option>\n          <option>受講者へ直接発送</option>\n        </select>\n      </div>\n\n      <div class=\"field\">\n        <label>支払い方法</label>\n        <select>\n          <option>登録済みカードで支払う</option>\n          <option>銀行振込</option>\n        </select>\n      </div>\n\n      <div class=\"modal-actions\">\n        <button class=\"btn\" onclick=\"closeModal('licenseModal')\">キャンセル</button>\n        <button class=\"btn orange\" onclick=\"submitLicense()\">¥8,000で申し込む</button>\n      </div>\n    </div>\n  </div>\n</div>\n\n<div class=\"modal-bg\" id=\"finishModal\" onclick=\"if(event.target===this)closeModal('finishModal')\">\n  <div class=\"modal\">\n    <div class=\"modal-head\">\n      <strong>修了報告</strong>\n      <button onclick=\"closeModal('finishModal')\">×</button>\n    </div>\n    <div class=\"modal-body\">\n      <div class=\"summary\">\n        <div><b>受講者</b><span>田中 花子</span></div>\n        <div><b>講座</b><span>ベーシックキャンドルコース</span></div>\n      </div>\n\n      <div class=\"field\">\n        <label>修了日</label>\n        <input type=\"date\" value=\"2026-10-10\">\n      </div>\n\n      <div class=\"field\">\n        <label>修了確認</label>\n        <select>\n          <option>すべての講座・課題を修了</option>\n          <option>未修了項目あり</option>\n        </select>\n      </div>\n\n      <div class=\"field\">\n        <label>本部へのメモ</label>\n        <textarea placeholder=\"必要があれば入力\"></textarea>\n      </div>\n\n      <div class=\"modal-actions\">\n        <button class=\"btn\" onclick=\"closeModal('finishModal')\">キャンセル</button>\n        <button class=\"btn blue\" onclick=\"submitFinish()\">修了報告をする</button>\n      </div>\n    </div>\n  </div>\n</div>\n\n<div class=\"modal-bg\" id=\"mailModal\" onclick=\"if(event.target===this)closeModal('mailModal')\">\n  <div class=\"modal\">\n    <div class=\"modal-head\">\n      <strong id=\"mailModalTitle\">メール内容</strong>\n      <button onclick=\"closeModal('mailModal')\">×</button>\n    </div>\n    <div class=\"modal-body\">\n      <div class=\"info-note\">\n        <strong>内容確認のみ</strong>\n        <p>自動メール・案内メールの編集は本部側で行います。</p>\n      </div>\n      <div class=\"field\">\n        <label>件名</label>\n        <input id=\"mailSubject\" value=\"お申込みありがとうございます\" readonly>\n      </div>\n      <div class=\"field\">\n        <label>本文</label>\n        <textarea id=\"mailBody\" readonly>お申込みありがとうございます。内容を確認のうえ、講師よりご連絡いたします。</textarea>\n      </div>\n    </div>\n  </div>\n</div>\n\n<nav class=\"mobile-bottom\">\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 10.5V20h13v-9.5\"/></svg><small>ホーム</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4V2.8h6V4M9 9h6M9 13h6M9 17h4\"/></svg><small>申込</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14\" rx=\"2\"/><path d=\"M8 3v5M16 3v5M4 10h16\"/></svg><small>開催</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M4 5h16v11H9l-5 4z\"/></svg><small>メッセージ</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/></svg><small>その他</small></a>\n</nav>\n\n<script>\nlet state={schedule:false,payment:false,license:false,attendance:false,finish:false};\n\nfunction openMailPreview(title){\n  document.getElementById('mailModalTitle').textContent=title;\n  const subject=document.getElementById('mailSubject');\n  const body=document.getElementById('mailBody');\n  if(title==='支払い案内メール'){\n    subject.value='受講料のお支払いについて';\n    body.value='受講料のお支払い方法をご案内します。内容をご確認のうえ、お手続きをお願いします。';\n  }else if(title==='日程確定メール'){\n    subject.value='開催日程が確定しました';\n    body.value='開催日程が確定しました。日時と参加方法をご確認ください。';\n  }else{\n    subject.value='お申込みありがとうございます';\n    body.value='お申込みありがとうございます。内容を確認のうえ、講師よりご連絡いたします。';\n  }\n  document.getElementById('mailModal').classList.add('open');\n}\nfunction openDetail(){\n  document.getElementById('listView').classList.remove('on');\n  document.getElementById('detailView').classList.add('on');\n  window.scrollTo(0,0);\n}\nfunction backToList(){\n  document.getElementById('detailView').classList.remove('on');\n  document.getElementById('listView').classList.add('on');\n  window.scrollTo(0,0);\n}\nfunction confirmSchedule(){\n  state.schedule=true;\n  document.getElementById('sideSchedule').textContent='10/10 14:00';\n  updateSteps(); updateNext();\n}\nfunction markPaid(){\n  state.payment=true;\n  document.getElementById('paymentStatus').innerHTML='<span class=\"pill green\">入金済み</span>';\n  document.getElementById('sidePayment').textContent='入金済み';\n  updateSteps(); updateNext();\n}\nfunction openLicenseModal(){document.getElementById('licenseModal').classList.add('open')}\nfunction openFinishModal(){document.getElementById('finishModal').classList.add('open')}\nfunction closeModal(id){document.getElementById(id).classList.remove('open')}\nfunction submitLicense(){\n  state.license=true;\n  closeModal('licenseModal');\n  document.getElementById('licenseStatus').innerHTML='<span class=\"pill green\">申込・支払済み</span>';\n  document.getElementById('sideLicense').textContent='取得済み';\n  document.getElementById('kitStatus').innerHTML='<span class=\"pill yellow\">本部発送準備中</span>';\n  document.getElementById('sideKit').textContent='発送準備中';\n  document.getElementById('licenseButton').style.display='none';\n  updateSteps(); updateNext();\n}\nfunction markAttendance(){\n  state.attendance=true;\n  document.getElementById('attendanceStatus').innerHTML='<span class=\"pill green\">出席済み</span>';\n  document.getElementById('sideFinish').textContent='開催済み';\n  updateSteps(); updateNext();\n}\nfunction submitFinish(){\n  state.finish=true;\n  closeModal('finishModal');\n  document.getElementById('sideFinish').textContent='本部確認待ち';\n  updateSteps(); updateNext();\n}\nfunction updateSteps(){\n  ['stepSchedule','stepPayment','stepLicense','stepEvent','stepFinish'].forEach(id=>{\n    document.getElementById(id).className='step';\n  });\n  if(state.schedule){\n    const e=document.getElementById('stepSchedule');\n    e.className='step done'; e.querySelector('b').textContent='✓';\n  }\n  if(state.payment){\n    const e=document.getElementById('stepPayment');\n    e.className='step done'; e.querySelector('b').textContent='✓';\n  }\n  if(state.license){\n    const e=document.getElementById('stepLicense');\n    e.className='step done'; e.querySelector('b').textContent='✓';\n  }\n  if(state.attendance){\n    const e=document.getElementById('stepEvent');\n    e.className='step done'; e.querySelector('b').textContent='✓';\n  }\n  if(state.finish){\n    const e=document.getElementById('stepFinish');\n    e.className='step done'; e.querySelector('b').textContent='✓';\n    return;\n  }\n  const current=!state.schedule?'stepSchedule':!state.payment?'stepPayment':!state.license?'stepLicense':!state.attendance?'stepEvent':'stepFinish';\n  document.getElementById(current).className='step current';\n}\nfunction updateNext(){\n  const box=document.getElementById('nextAction');\n  if(!state.schedule){\n    box.innerHTML='<strong>日程を確定してください</strong><p>受講者の希望日を確認し、開催日と時間を決めます。</p><button class=\"btn orange\" onclick=\"document.getElementById(\\'scheduleCard\\').scrollIntoView({behavior:\\'smooth\\'})\">日程設定へ</button>';\n  }else if(!state.payment){\n    box.innerHTML='<strong>受講料の入金を確認してください</strong><p>入金後に開講ライセンス申込へ進みます。</p><button class=\"btn orange\" onclick=\"document.getElementById(\\'paymentCard\\').scrollIntoView({behavior:\\'smooth\\'})\">入金確認へ</button>';\n  }else if(!state.license){\n    box.innerHTML='<strong>開講ライセンスを申し込んでください</strong><p>本部へ開講ライセンスを申し込みます。</p><button class=\"btn orange\" onclick=\"document.getElementById(\\'licenseCard\\').scrollIntoView({behavior:\\'smooth\\'})\">申込へ</button>';\n  }else if(!state.attendance){\n    box.innerHTML='<strong>開催準備OK</strong><p>本部のキット発送状況を確認し、開催後に出席を記録してください。</p><button class=\"btn\" onclick=\"document.getElementById(\\'finishCard\\').scrollIntoView({behavior:\\'smooth\\'})\">開催・修了へ</button>';\n  }else if(!state.finish){\n    box.innerHTML='<strong>修了報告をしてください</strong><p>出席・修了を確認し、修了報告を送ります。</p><button class=\"btn blue\" onclick=\"openFinishModal()\">修了報告をする</button>';\n  }else{\n    box.innerHTML='<strong>本部確認待ち</strong><p>修了報告を送信しました。本部の認定処理をお待ちください。</p>';\n  }\n}\n<\\/script>\n</body>\n</html>\n"}, {"group": "講師", "title": "開催対応", "filename": "academy-ui-19-instructor-events-flow-v0.2.html", "status": "確認版", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-19 Instructor Events Flow v0.2</title>\n<style>\n:root{--pink:#f9d3d2;--yellow:#ffd370;--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;--ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3}\n*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-seri e-items:center;color:#537764;font-size:17px;font-weight:900}.event-title{font-size:14px;font-weight:850;margin-bottom:5px}.meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.state{text-align:right}.badge{display:inline-block;font-size:9px;padding:6px 8px;border-radius:999px;font-weight:850}.badge.green{background:#eaf7f0;color:#3d765e}.badge.yellow{background:#fff7d8;color:#7b6200}.badge.gray{background:#efefef;color:#666}.next{font-size:9px;color:var(--muted);margin-top:6px}.view{display:none}.view.on{display:block}.back{border:0;background:none;color:#4f806c;font-size:11px;font-weight:850;padding:0}.form-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.form-title h1{font-size:22px;margin:7px 0 3px}.form-title p{font-size:11px;color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-size:11px;font-weight:850}.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}.form-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.stack{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card h2{font-size:14px;margin:0 0 5px}.help{font-size:11px;color:var(--muted);line-height:1.55}.section-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:850;margin:0 0 10px}.section-title:before{content:\"\";width:7px;height:7px;border-radius:50%;background:var(--green)}.field{margin-top:12px}.field:first-child{margin-top:0}.field label{display:block;font-size:10px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;font-size:12px}.field textarea{min-height:84px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}\n.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.choice{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;cursor:pointer}.choice.on{border-color:var(--green);background:#f8fcfa}.choice strong{display:block;font-size:12px}.choice p{font-size:10px;color:var(--muted);line-height:1.45;margin:4px 0 0}.status-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.status-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850}.status-chip.on{background:#eaf7f0;color:#3d765e;border-color:#d9ebdf}.summary .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0}.summary .row:first-child{border-top:0}.summary b{font-size:10px;color:#666}.summary span{font-size:11px;font-weight:750;text-align:right}.note{margin-top:12px;background:#f5faf7;border:1px solid #e0ece5;border-radius:10px;padding:10px;font-size:10px;line-height:1.55;color:#617068}.note strong{display:block;color:#355a49;margin-bottom:3px}.conditional{display:none}.conditional.on{display:block}.mobile-bottom{display:none}@media(max-width:820px){body{padding-bottom:74px}.app{display:block}.side{display:none}.top{height:54px;padding:0 14px}.wrap{padding:16px 12px 80px}.headbox{display:block}.headbox .create{width:100%;margin-top:12px}.tools{overflow-x:auto;flex-wrap:nowrap}.search{min-width:220px}.filter{white-space:nowrap}.event{grid-template-columns:50px 1fr auto;padding:10px;gap:10px}.thumb{width:50px;height:50px}.meta{gap:6px 10px}.form-head{display:block}.actions{margin-top:12px}.form-title h1{font-size:20px}.form-layout{grid-template-columns:1fr}.grid2,.grid3,.choice-grid{grid-template-columns:1fr}.mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid var(--line);z-index:40;padding:0 6px env(safe-area-inset-bottom)}.mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#45484b;text-decoration:none}.mobile-bottom small{font-size:9px;font-weight:700}.nav-icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mobile-bottom a:nth-child(3){color:#4f806c}}\n</style>\n</head>\n<body>\n<div class=\"app\"><aside class=\"side\"><div class=\"brand\">mikkeOS<small>Academy｜講師</small></div><div class=\"nav\"><div>ホーム</div><div>申込</div><div class=\"on\">開催</div><div>開講</div><div>修了報告</div><div>講師マニュアル</div><div>Community</div><div>本部メッセージ</div><div>営業ページ</div><div>設定</div></div></aside><div><header class=\"top\"><strong>灯りのアトリエ｜講師ページ</strong><span>鈴木 里奈 ▾</span></header><main class=\"wrap\">\n<section class=\"view on\" id=\"listView\"><div class=\"titlebar\"><div class=\"en\">EVENTS</div><div class=\"jp\">開催</div></div><div class=\"headbox\"><p>この講座の受付方法・日程・会場・定員を設定します。1つの講座に複数の開催・日程相談受付を追加できます。申込後の個別対応は「申込」で進めます。</p><button class=\"create\" onclick=\"openCreate()\">開催を追加</button></div><div class=\"tools\"><input class=\"search\" placeholder=\"講座名・会場で検索\"><button class=\"filter on\">受付中</button><button class=\"filter\">日程相談</button><button class=\"filter\">開催確定</button><button class=\"filter\">本日</button><button class=\"filter\">終了</button><button class=\"filter\">すべて</button></div><div class=\"list\">\n<div class=\"event\" onclick=\"openEdit('fixed')\"><div class=\"thumb\">10/8</div><div><div class=\"event-title\">ベーシックキャンドルコース</div><div class=\"meta\"><span>10/8 13:00–15:00</span><span>対面</span><span>杉並区</span><span>定員6名</span></div></div><div class=\"state\"><span class=\"badge green\">受付中</span><div class=\"next\">申込 2 / 6</div></div></div>\n<div class=\"event\" onclick=\"openEdit('consult')\"><div class=\"thumb\">相談</div><div><div class=\"event-title\">ベーシックキャンドルコース</div><div class=\"meta\"><span>申込後に日程相談</span><span>オンライン</span><span>定員なし</span></div></div><div class=\"state\"><span class=\"badge yellow\">日程相談</span><div class=\"next\">申込 1件</div></div></div>\n<div class=\"event\" onclick=\"openEdit('fixed')\"><div class=\"thumb\">10/20</div><div><div class=\"event-title\">ベーシックキャンドルコース</div><div class=\"meta\"><span>10/20 10:00–12:00</span><span>オンライン</span><span>定員8名</span></div></div><div class=\"state\"><span class=\"badge green\">受付中</span><div class=\"next\">申込 4 / 8</div></div></div>\n<div class=\"event\" onclick=\"openEdit('fixed')\"><div class=\"thumb\">9/20</div><div><div class=\"event-title\">ベーシックキャンドルコース</div><div class=\"meta\"><span>9/20 11:00–13:00</span><span>対面</span><span>杉並区</span></div></div><div class=\"state\"><span class=\"badge gray\">終了</span><div class=\"next\">申込 5名</div></div></div>\n</div></section>\n<section class=\"view\" id=\"formView\"><div class=\"form-head\"><div class=\"form-title\"><button class=\"back\" onclick=\"backToList()\">← 開催一覧へ</button><h1 id=\"formTitle\">開催を追加</h1><p>この講座の受付に必要な開催情報だけを設定します。</p></div><div class=\"actions\"><button class=\"btn\" onclick=\"backToList()\">キャンセル</button><button class=\"btn blue\" onclick=\"saveEvent()\">保存</button></div></div><div class=\"form-layout\"><div class=\"stack\">\n<section class=\"card\"><div class=\"section-title\">対象講座</div><div class=\"field\"><label>講座</label><select><option>ベーシックキャンドルコース</option><option>アロマ基礎講座</option></select></div><div class=\"note\"><strong>開催できる講座だけ表示されます</strong>有効な講師ライセンス・契約・会費・本人の活動設定等の条件を満たす講座が対象です。</div></section>\n<section class=\"card\"><div class=\"section-title\">どのように受け付けますか？</div><div class=\"choice-grid\"><div class=\"choice on\" id=\"fixedChoice\" onclick=\"setReception('fixed')\"><strong>日時を決めて募集する</strong><p>開催日と時間を決めて募集します。</p></div><div class=\"choice\" id=\"consultChoice\" onclick=\"setReception('consult')\"><strong>申込後に日程を相談する</strong><p>申込後に受講者と相談して日程を決めます。</p></div></div></section>\n<section class=\"card\"><div class=\"section-title\">開催方法</div><div class=\"choice-grid\"><div class=\"choice o section>\n\n<section class=\"view\" id=\"detailView\">\n  <div class=\"detail-head\">\n    <div class=\"detail-title\">\n      <button class=\"back\" onclick=\"backToList()\">← 本部メッセージ一覧へ</button>\n      <h1>10/18 対面開催について</h1>\n      <p>灯りのアトリエ本部とのメッセージ</p>\n    </div>\n  </div>\n\n  <div class=\"context\">\n    <b>関連する開催</b>\n    <p>ベーシックキャンドルコース｜10/18 13:00｜対面・杉並区</p>\n    <a href=\"#\">開催詳細を見る →</a>\n  </div>\n\n  <div class=\"chat\">\n    <div class=\"msg hq\">\n      <div class=\"bubble\">10/18（土）13:00からのベーシックキャンドルコースについて、担当をお願いできますでしょうか。会場は杉並区です。</div>\n      <small>本部｜9/25 09:40</small>\n    </div>\n\n    <div class=\"msg me\">\n      <div class=\"bubble\">ありがとうございます。時間は問題ありません。会場の詳しい場所を教えていただけますか？</div>\n      <small>あなた｜9/25 09:52</small>\n    </div>\n\n    <div class=\"msg hq\">\n      <div class=\"bubble\">会場はRina Candle Roomです。住所は開催詳細に登録しました。ご確認をお願いします。</div>\n      <small>本部｜9/25 10:24</small>\n    </div>\n  </div>\n\n  <div class=\"compose\">\n    <textarea placeholder=\"本部へメッセージを入力\"></textarea>\n    <div class=\"compose-actions\">\n      <span class=\"help\">受講者への連絡には使用しません。</span>\n      <button class=\"btn blue\">送信</button>\n    </div>\n  </div>\n</section>\n\n</main>\n</div>\n</div>\n\n<nav class=\"mobile-bottom\">\n<a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 10.5V20h13v-9.5\"/></svg><small>ホーム</small></a>\n<a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4V2.8h6V4M9 9h6M9 13h6M9 17h4\"/></svg><small>申込</small></a>\n<a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14\" rx=\"2\"/><path d=\"M8 3v5M16 3v5M4 10h16\"/></svg><small>開催</small></a>\n<a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M4 5h16v11H9l-5 4z\"/></svg><small>メッセージ</small></a>\n<a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12 nd:var(--orange);border-color:var(--orange);color:#fff}\n\n.media-grid{display:grid;grid-template-columns:1.6fr .8fr;gap:14px;margin-top:12px}\n.hero-preview{height:180px;border-radius:14px;background:linear-gradient(120deg,#7eb89f,#a8d0bd);position:relative;overflow:hidden;border:1px solid var(--line)}\n.hero-preview:before{content:\"HERO IMAGE\";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900;letter-spacing:.08em}\n.logo-preview{height:180px;border-radius:14px;background:#fafafa;border:1px dashed #cfd2d6;display:grid;place-items:center}\n.logo-circle{width:88px;height:88px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);font-weight:900}\n.media-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}\n\n.pay-option{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px}\n.pay-head{display:flex;justify-content:space-between;gap:12px;align-items:center}\n.pay-head strong{font-size:12px}\n.toggle{width:38px;height:22px;border-radius:999px;background:#dfe3e1;position:relative;cursor:pointer}\n.toggle:after{content:\"\";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;box-shadow:0 1px 4px rgba(0,0,0,.2)}\n.toggle.on{background:var(--green)}.toggle.on:after{left:19px}\n\n.address-list{display:grid;gap:10px;margin-top:12px}\n.address-card{border:1px solid var(--line);border-radius:12px;padding:13px}\n.address-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}\n.address-name{font-size:12px;font-weight:850}\n.address-meta{font-size:10px;color:var(--muted);line-height:1.6;margin-top:4px}\n.default-badge{font-size:9px;background:#eaf7f0;color:#3d765e;border-radius:999px;padding:5px 7px;font-weight:850}\n.address-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}\n\n.law-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.checkrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px}\n.checkrow input{width:auto}\n\n.mobile-bottom{display:none}\n@media(max-width:820px){\n  body{padding-bottom:74px}.app{display:block}.side{display:none}.top{height:54px;padding:0 14px}.wrap{padding:16px 12px 80px}\n  .grid2,.grid3,.media-grid,.law-grid{grid-template-columns:1fr}\n  .tabs{margin-top:14px}\n  .mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid var(--line);z-index:40}\n  .mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#45484b}\n  .mobile-bottom small{font-size:9px;font-weight:700}\n  .nav-icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n}\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n<aside class=\"side\">\n  <div class=\"brand\">mikkeOS<small>Academy｜講師</small></div>\n  <div class=\"nav\">\n    <div>ホーム</div><div>申込</div><div>開催</div><div>修了・認定</div><div>講師マニュアル</div>\n    <div>Community</div><div>本部メッセージ</div><div>営業ページ</div><div class=\"on\">設定</div>\n  </div>\n</aside>\n\n<div>\n<header class=\"top\"><strong>灯りのアトリエ｜講師ページ</strong><span>鈴木 里奈 ▾</span></header>\n\n<main class=\"wrap\">\n  <div class=\"titlebar\">\n    <div class=\"en\">SETTINGS</div>\n    <div class=\"jp\">講師設定</div>\n  </div>\n  <div class=\"headbox\">\n    <p>プロフィール・販売時の連絡先・決済・表示情報・キット受取先を設定します。</p>\n  </div>\n\n  <div class=\"tabs\">\n    <button class=\"tab on\" onclick=\"showTab('profile',this)\">プロフィール</button>\n    <button class=\"tab\" onclick=\"showTab('home',this)\">ホーム表示</button>\n    <button class=\"tab\" onclick=\"showTab('contact',this)\">連絡・決済</button>\n    <button class=\"tab\" onclick=\"showTab('sales',this)\">販売・キャンセル</button>\n    <button class=\"tab\" onclick=\"showTab('kit',this)\">キット受取住所</button>\n  </div>\n\n  <section class=\"panel on\" id=\"profile\">\n    <div class=\"card\">\n      <h2>講師プロフィール</h2>\n      <div class=\"help\">本部HPや講師営業ページで使用する基本情報です。</div>\n\n      <div class=\"field\">\n        <label>プロフィール写真</label>\n        <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n          <div style=\"width:72px;height:72px;border-radius:50%;background:#fafafa;border:1px dashed #cfd2d6;display:grid;place-items:center;color:var(--muted);font-size:10px;font-weight:800\">PHOTO</div>\n          <div>\n            <button class=\"btn\">写真を変更</button>\n            <div class=\"help\" style=\"margin-top:5px\">本部HP・共通講師プロフィール・講師営業ページで共通使用します。</div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"grid2\">\n        <div class=\"field\"><label>講師名</label><input value=\"鈴木 里奈\"></div>\n        <div class=\"field\"><label>活動地域</label><input value=\"東京都杉並区・中野区\"></div>\n      </div>\n      <div class=\"field\"><label>自己紹介</label><textarea>キャンドルづくりを通して、日常に小さな灯りを届けています。</textarea></div>\n      <div class=\"field\"><label>教室・会場案内</label><textarea>杉並区の自宅アトリエを中心に開催しています。</textarea></div>\n      <div class=\"grid2\">\n        <div class=\"field\"><label>Instagram</label><input placeholder=\"@username\"></div>\n        <div class=\"field\"><label>Web / SNS</label><input placeholder=\"https://...\"></div>\n      </div>\n      <div class=\"actions\"><button class=\"btn orange\">保存</button></div>\n    </div>\n  </section>\n\n  <section class=\"panel\" id=\"home\">\n    <div class=\"card\">\n      <h2>ホーム表示</h2>\n      <div class=\"help\">講師ホームや共通プロフィールページに表示する画像です。</div>\n\n      <div class=\"media-grid\">\n        <div>\n          <div class=\"hero-preview\"></div>\n          <div class=\"media-actions\">\n            <button class=\"btn\">HERO画像を変更</button>\n            <button class=\"btn\">削除</button>\n          </div>\n        </div>\n        <div>\n          <div class=\"logo-preview\"><div class=\"logo-circle\">RINA</div></div>\n          <div class=\"media-actions\">\n            <button class=\"btn\">ロゴを変更</button>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"note\">講座ごとの公式画像は本部管理です。ここで設定する画像は講師本人のホーム・プロフィール用です。</div>\n      <div class=\"actions\"><button class=\"btn orange\">保存</button></div>\n    </div>\n  </section>\n\n  <section class=\"panel\" id=\"contact\">\n    <div class=\"card\">\n      <h2>連絡用メールアドレス</h2>\n      <div class=\"help\">受講者への自動メールの返信先や、本部からの連絡に使用します。</div>\n      <div class=\"field\"><label>メールアドレス</label><input type=\"email\" value=\"rina.suzuki@example.com\"></div>\n      <div class=\"actions\"><button class=\"btn orange\">保存</button></div>\n    </div>\n\n    <div class=\"card\">\n      <h2>受講料の受取方法</h2>\n      <div class=\"help\">講師本人が受注する講座で、受講者へ案内する支払い方法を設定します。</div>\n\n      <div class=\"pay-option\">\n        <div class=\"pay-head\"><strong>銀行振込</strong><div class=\"toggle on\"></div></div>\n        <div class=\"grid2\">\n          <div class=\"field\"><label>銀行名</label><input value=\"〇〇銀行\"></div>\n          <div class=\"field\"><label>支店名</label><input value=\"荻窪支店\"></div>\n          <div class=\"field\"><label>口座種別・番号</label><input value=\"普通 1234567\"></div>\n          <div class=\"field\"><label>口座名義</label><input value=\"スズキ リナ\"></div>\n        </div>\n      </div>\n\n      <div class=\"pay-option\">\n        <div class=\"pay-head\"><strong>カード決済</strong><div class=\"toggle\"></div></div>\n        <div class=\"help\" style=\"margin-top:7px\">利用可能になった場合に設定します。</div>\n      </div>\n\n      <div class=\"note\">Squareなどの商品・金額ごとに異なる外部決済URLは、講師設定ではなく各販売プランの支払い設定で管理します。</div>\n\n      <div class=\"actions\"><button class=\"btn orange\">保存</button></div>\n    </div>\n  </section>\n\n  <section class=\"panel\" id=\"sales\">\n    <div class=\"card\">\n      <h2>販売者情報</h2>\n      <div class=\"help\">講師本人が受注する販売ページに表示する情報を設定します。</div>\n\n      <div class=\"law-grid\">\n        <div class=\"field\"><label>販売者名 / 屋号</label><input value=\"Rina Candle\"></div>\n        <div class=\"field\"><label>運営責任者</label><input value=\"鈴木 里奈\"></div>\n        <div class=\"field\"><label>所在地</label><input value=\"東京都杉並区〇〇1-2-3\"></div>\n        <div class=\"field\"><label>電話番号</label><input value=\"090-0000-0000\"></div>\n        <div class=\"field\"><label>お問い合わせ先メール</label><input value=\"rina.suzuki@example.com\"></div>\n      </div>\n\n      <div class=\"field\"><label>支払い時期</label><textarea>お申込み後、案内された期限までにお支払いください。</textarea></div>\n      <div class=\"field\"><label>サービス提供時期</label><textarea>お申込みいただいた開催日、または日程相談後に確定した日時に提供します。</textarea></div>\n\n      <div class=\"note\">\n        講師営業ページ下部には「特定商取引法に基づく表記」「キャンセル・返金について」「利用規約」の3つの導線を表示します。\n      </div>\n      <div class=\"actions\"><button class=\"btn orange\">保存</button></div>\n    </div>\n\n    <div class=\"card\">\n      <h2>キャンセル・返金ポリシー</h2>\n      <div class=\"help\">受講者に案内するキャンセル・変更・返金条件を設定します。</div>\n\n      <div class=\"field\"><label>キャンセルポリシー</label><textarea>開催7日前まで：無料\n6日前〜3日前：受講料の50%\n2日前〜当日：受講料の100%</textarea></div>\n\n      <div class=\"field\"><label>日程変更について</label><textarea>日程変更をご希望の場合は、開催3日前までにご連絡ください。</textarea></div>\n\n      <div class=\"field\"><label>返金について</label><textarea>返金が発生する場合は、お支払い方法に応じてご案内します。</textarea></div>\n\n      <div class=\"field\"><label>無断キャンセルについて</label><textarea>ご連絡なく欠席された場合は、返金対象外となります。</textarea></div>\n\n      <div class=\"note\">設定したキャンセル・返金条件は営業ページだけでなく、申込直前の確認画面にも「キャンセルポリシーを確認する」導線を表示します。</div>\n      <div class=\"warn\">本部が共通ルールを設定する制度では、その条件を講師が上書きできないようにします。</div>\n      <div class=\"actions\"><button class=\"btn orange\">保存</button></div>\n    </div>\n  </section>\n\n  <section class=\"panel\" id=\"kit\">\n    <div class=\"card\">\n      <h2>キット受取住所</h2>\n      <div class=\"help\">本部から講師へキットを発送する場合の受取先を複数登録できます。</div>\n\n      <div class=\"address-list\">\n        <div class=\"address-card\">\n          <div class=\"address-top\">\n            <div>\n              <div class=\"address-name\">自宅</div>\n              <div class=\"address-meta\">鈴木 里奈<br>〒167-0000 東京都杉並区〇〇1-2-3<br>09 ck\">\n          <div class=\"titlebar\">\n            <div><div class=\"en\">UP NEXT</div><div class=\"jp\">次のおすすめ</div></div>\n          </div>\n          <div class=\"card soon\">\n            <a class=\"row row-link\" href=\"#next-course\"><div><div class=\"name\">応用デザイン講座</div><div class=\"meta\">次に受講できます</div></div>→</a>\n            <a class=\"row row-link\" href=\"#updated-material\"><div><div class=\"name\">教材更新</div><div class=\"meta\">PDF資料が更新されました</div></div>→</a>\n          </div>\n        </div>\n      </section>\n    </div>\n\n    <aside class=\"right\">\n      <section class=\"block\" id=\"learner-schedule\">\n        <div class=\"titlebar\">\n          <div><div class=\"en\">SCHEDULE</div><div class=\"jp\">次の予定</div></div>\n          <a class=\"title-more\" href=\"#schedule-list\">もっと見る →</a>\n        </div>\n        <div class=\"card list-card\">\n          <div class=\"row\">\n            <div><div class=\"name\">10/18 14:00</div><div class=\"meta\">季節のキャンドルコース / 対面</div></div>\n            <span class=\"badge info\">予定</span>\n          </div>\n          <div class=\"row\">\n            <div><div class=\"name\">日程相談中</div><div class=\"meta\">個別フォロー / 第2希望確認中</div></div>\n            <span class=\"badge\">調整中</span>\n          </div>\n        </div>\n      </section>\n\n      <section class=\"block\" id=\"notices\">\n        <div class=\"titlebar\">\n          <div><div class=\"en\">NOTICES</div><div class=\"jp\">お知らせ</div></div>\n        </div>\n        <div class=\"card list-card\">\n          <a class=\"row row-link\" href=\"#updated-material\"><div><div class=\"name\">教材を更新しました</div><div class=\"meta\">キャンドル認定講座 / PDF資料</div></div>→</a>\n          <a class=\"row row-link\" href=\"#certificate\"><div><div class=\"name\">証書を発送しました</div><div class=\"meta\">キャンドル認定</div></div>→</a>\n        </div>\n      </section>\n    </aside>\n  </div>\n</div>\n\n</main></div></div>\n<div class=\"cert-modal-bg\" id=\"certSettingsModal\" onclick=\"if(event.target===this)closeCertSettings()\">\n  <div class=\"cert-modal\">\n    <div class=\"cert-modal-head\">\n      <div>\n        <strong id=\"certModalTitle\">キャンドル認定</strong>\n        <small id=\"certModalCourse\">ベーシックキャンドルコース</small>\n      </div>\n      <button class=\"cert-modal-close\" onclick=\"closeCertSettings()\">×</button>\n    </div>\n\n    <div class=\"cert-modal-body\">\n      <div class=\"setting-row\">\n        <div>\n          <strong>この講座で活動する</strong>\n          <p>この講座だけ一時休止することもできます。</p>\n        </div>\n        <div class=\"switch on\" id=\"swActivity\" onclick=\"this.classList.toggle('on')\"></div>\n      </div>\n\n      <div class=\"setting-row\">\n        <div>\n          <strong>本部ホームページに掲載</strong>\n          <p>本部HPのプロフィール内に、この講座を掲載します。</p>\n        </div>\n        <div class=\"switch on\" id=\"swHp\" onclick=\"this.classList.toggle('on')\"></div>\n      </div>\n\n      <div class=\"setting-row\">\n        <div>\n          <strong>新規申込を受付</strong>\n          <p>この講座への新しい申込を受け付けます。</p>\n        </div>\n        <div class=\"switch on\" id=\"swApplication\" onclick=\"this.classList.toggle('on')\"></div>\n      </div>\n\n      <div class=\"setting-row\">\n        <div>\n          <strong>オンライン対応</strong>\n          <p>販売プランでオンラインが許可されている場合のみ利用できます。</p>\n        </div>\n        <div class=\"switch on\" id=\"swOnline\" onclick=\"this.classList.toggle('on')\"></div>\n      </div>\n\n      <div class=\"setting-field\">\n        <label>対面で対応できる地域</label>\n        <input id=\"certModalArea\" value=\"杉並区・中野区\">\n      </div>\n\n      <div class=\"cert-modal-note\">\n        本部が許可している範囲を超えて設定することはできません。契約・講師ライセンスが無効な場合は、本人設定がONでも掲載・受付されません。\n      </div>\n\n      <div class=\"cert-modal-actions\">\n        <button onclick=\"closeCertSettings()\">キャンセル</button>\n        <button class=\"save\" onclick=\"closeCertSettings()\">保存</button>\n      </div>\n    </div>\n  </div>\n</div>\n\n<nav class=\"mobile-bottom\" id=\"mobileBottom\"></nav>\n\n\n\n\n<div class=\"mobile-create-menu\" id=\"mobileCreateMenu\">\n  <a href=\"#opening\">開講手続き</a>\n  <a href=\"#schedule-new\">開催を追加</a>\n  <a href=\"#completion-report\">修了報告</a>\n</div>\n\n<script>\nlet personalRole='learner';\n\nconst icons = {\n  home:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 10.5V20h13v-9.5\"/></svg>`,\n  application:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4V2.8h6V4M9 9h6M9 13h6M9 17h4\"/></svg>`,\n  event:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14\" rx=\"2\"/><path d=\"M8 3v5M16 3v5M4 10h16\"/></svg>`,\n  learn:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M4 5.5h6.5c1.1 0 1.5.5 1.5 1.5v12c0-1-.5-1.5-1.5-1.5H4z\"/><path d=\"M20 5.5h-6.5C12.5 5.5 12 6 12 7v12c0-1 .5-1.5 1.5-1.5H20z\"/></svg>`,\n  notice:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7\"/><path d=\"M10 19h4\"/></svg>`,\n  more:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/></svg>`\n};\n\n\nfunction setSwitch(id,on){\n  document.getElementById(id)?.classList.toggle('on',!!on);\n}\n\nfunction openCertSettings(title,course,area,activity,hp,application,online){\n  document.getElementById('certModalTitle').textContent=title;\n  document.getElementById('certModalCourse').textContent=course;\n  document.getElementById('certModalArea').value=area || '';\n  setSwitch('swActivity',activity);\n  setSwitch('swHp',hp);\n  setSwitch('swApplication',application);\n  setSwitch('swOnline',online);\n  document.getElementById('certSettingsModal').classList.add('open');\n}\n\nfunction closeCertSettings(){\n  document.getElementById('certSettingsModal').classList.remove('open');\n}\n\nfunction updateDesktopSideNav(){\n  document.querySelectorAll('#desktopSideNav [data-role]').forEach(el=>{\n    const role=el.getAttribute('data-role');\n    el.classList.toggle('hidden', !(role==='both' || role===personalRole));\n  });\n  document.querySelectorAll('#desktopSideNav > div').forEach(el=>el.classList.remove('on'));\n  const home=[...document.querySelectorAll('#desktopSideNav > div')].find(el=>el.textContent.trim()==='ホーム');\n  if(home) home.classList.add('on');\n}\n\nfunction renderMobileNav(){\n  const bottom=document.getElementById('mobileBottom');\n\n  if(personalRole==='instructor'){\n    bottom.innerHTML=`\n      <a class=\"nav-cell active\" href=\"#home\" onclick=\"mobileAction('home');return false\">${icons.home}<small>ホーム</small></a>\n      <a class=\"nav-cell\" href=\"#applications\">${icons.application}<small>申込</small></a>\n      <div class=\"create-slot\">\n        <button class=\"create-btn\" onclick=\"document.getElementById('mobileCreateMenu').classList.toggle('open')\" aria-label=\"作成\"></button>\n        <small class=\"create-label\">作成</small>\n      </div>\n      <a class=\"nav-cell\" href=\"#schedule\" onclick=\"mobileAction('schedule');return false\">${icons.event}<small>開催</small></a>\n      <a class=\"nav-cell\" href=\"#more\">${icons.more}<small>その他</small></a>\n    `;\n  }else{\n    bottom.innerHTML=`\n      <a class=\"nav-cell active\" href=\"#home\" onclick=\"mobileAction('home');return false\">${icons.home}<small>ホーム</small></a>\n      <a class=\"nav-cell\" href=\"#learning\" onclick=\"mobileAction('learn');return false\">${icons.learn}<small>学ぶ</small></a>\n      <a class=\"nav-cell\" href=\"#learner-schedule\">${icons.event}<small>予定</small></a>\n      <a class=\"nav-cell\" href=\"#notices\">${icons.notice}<small>お知らせ</small></a>\n      <a class=\"nav-cell\" href=\"#more\">${icons.more}<small>その他</small></a>\n    `;\n  }\n}\n\nfunction switchRole(role){\n  personalRole=role;\n  document.getElementById('instructorMode').classList.toggle('active',role==='instructor');\n  document.getElementById('learnerMode').classList.toggle('active',role==='learner');\n  document.getElementById('instructorSwitch').classList.toggle('active',role==='instructor');\n  document.getElementById('learnerSwitch').classList.toggle('active',role==='learner');\n  document.getElementById('mobileCreateMenu').classList.remove('open');\n  updateDesktopSideNav();\n  renderMobileNav();\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n\nfunction mobileAction(type){\n  if(type==='home'){\n    window.scrollTo({top:0,behavior:'smooth'});\n    return;\n  }\n  if(type==='schedule'){\n    document.getElementById('schedule')?.scrollIntoView({behavior:'smooth'});\n    return;\n  }\n  if(type==='learn'){\n    document.querySelector('#learnerMode .left>.block:nth-of-type(1)')?.scrollIntoView({behavior:'smooth'});\n  }\n}\n\nfunction pick(el,d,t,m){\n  document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));\n  el.classList.add('active');\n  document.getElementById('sd').textContent=d;\n  document.getElementById('st').textContent=t;\n  document.getElementById('sm').textContent=m;\n}\n\nupdateDesktopSideNav();\nrenderMobileNav();\n<\\/script>\n</body></html>"}, {"group": "受講者", "title": "学ぶ／教材を見る", "filename": "academy-ui-25-learner-learning-v0.2.html", "status": "確認版", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-25 Learner Learning v0.1</title>\n<style>\n:root{\n  --pink:#f9d3d2;--yellow:#ffd370;--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;\n  --ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3;\n}\n*{box-sizing:border-box}\nbody{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:var(--ink);background:var(--bg)}\nbutton,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}\n\n.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}\n.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}\n.brand{font-size:18px;font-weight:800;padding:4px 10px 20px}\n.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}\n.nav div{padding:10px 12px;border-radius:9px;margin:2px 0;color:#565860}\n.nav .on{background:var(--blue);color:#fff;font-weight:700}\n.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}\n.wrap{max-width:1100px;margin:auto;padding:30px 30px 80px}\n\n.titlebar{background:#8bc7ad;padding:12px 16px 10px;border-radius:13px 13px 0 0}\n.titlebar .en{font-size:15px;font-weight:900;letter-spacing:.08em;color:#fff}\n.titlebar .jp{font-size:10px;font-weight:750;margin-top:4px}\n.headbox{padding:18px 18px 16px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;line-height:1.65}\n.headbox p{margin:0;color:var(--muted)}\n\n.tools{display:flex;gap:9px;margin:20px 0 12px}\n.search{width:100%;max-width:360px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}\n\n.list{display:grid;gap:10px}\n.manual{\n  display:grid;grid-template-columns:62px 1fr auto;gap:14px;padding:12px 14px;\n  background:#fff;border:1px solid var(--line);border-radius:14px;align-items:center;cursor:pointer\n}\n.thumb{width:62px;height:62px;border-radius:11px;background:linear-gradient(135deg,#dcefe6,#f2f4f3);display:grid;place-items:center;color:#537764;font-weight:900;font-size:16px}\n.manual h3{font-size:14px;margin:0 0 5px}\n.meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}\n.badge{font-size:9px;padding:6px 8px;border-radius:999px;background:#eaf7f0;color:#3d765e;font-weight:850}\n.arrow{font-size:18px;color:#999;margin-left:10px}\n\n.view{display:none}.view.on{display:block}\n.back{border:0;background:none;color:#4f806c;font-size:11px;font-weight:850;padding:0}\n.detail-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}\n.detail-title h1{font-size:22px;margin:7px 0 3px}\n.detail-title p{font-size:11px;color:var(--muted);margin:0}\n\n.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}\n.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}\n.card h2{font-size:14px;margin:0 0 7px}\n.card p{font-size:11px;color:#5f6470;line-height:1.75;margin:0}\n.section{padding:15px 0;border-top:1px solid var(--line)}\n.section:first-of-type{border-top:0;padding-top:0}\n.section h3{font-size:13px;margin:0 0 7px}\n.block{background:#f8faf9;border:1px solid #e2ece7;border-radius:11px;padding:11px;margin-top:8px}\n.block strong{font-size:11px;display:block;margin-bottom:4px}\n.block p{font-size:10px;line-height:1.6;color:#667069}\n.resource{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}\n.resource:first-child{border-top:0}\n.resource strong{font-size:11px}.resource small{display:block;font-size:9px;color:var(--muted);margin-top:2px}\n.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:10px;font-weight:850}\n.sidecard{position:sticky;top:78px}\n.sidecard .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0}\n.sidecard .row:first-of-type{border-top:0}.sidecard b{font-size:10px;color:#666}.sidecard span{font-size:11px;font-weight:750}\n.notice{margin-top:12px;background:#fff8dc;border-radius:10px;padding:10px 11px;font-size:10px;line-height:1.55;color:#6d634c}\n\n.mobile-bottom{display:none}\n@media(max-width:820px){\n  body{padding-bottom:74px}.app{display:block}.side{display:none}.top{height:54px;padding:0 14px}.wrap{padding:16px 12px 80px}\n  .manual{grid-template-columns:50px 1fr auto;padding:10px;gap:10px}.thumb{width:50px;height:50px}\n  .detail-head{display:block}.detail-title h1{font-size:20px}.detail-grid{grid-template-columns:1fr}.sidecard{position:static}\n  .mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid var(--line);z-index:40}\n  .mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#45484b;text-decoration:none}\n  .mobile-bottom small{font-size:9px;font-weight:700}.nav-icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n}\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n<aside class=\"side\">\n  <div class=\"brand\">mikkeOS<small>Academy｜受講者</small></div>\n  <div class=\"nav\">\n    <div>ホーム</div>\n    <div class=\"on\">学ぶ</div>\n    <div>予定</div>\n    <div>お知らせ</div>\n    <div>認定・証書</div>\n    <div>設定</div>\n  </div>\n</aside>\n\n<div>\n<header class=\"top\"><strong>灯りのアトリエ｜受講者ページ</strong><span>鈴木 里奈 ▾</span></header>\n\n<main class=\"wrap\">\n<section class=\"view on\" id=\"listView\">\n  <div class=\"titlebar\">\n    <div class=\"en\">LEARNING</div>\n    <div class=\"jp\">学ぶ</div>\n  </div>\n  <div class=\"headbox\">\n    <p>受講中・修了済みの講座を開いて、レッスン教材・動画・PDFなどを確認できます。</p>\n  </div>\n\n  <div class=\"tools\"><input class=\"search\" placeholder=\"講座名・教材名・キーワードで検索\"></div>\n\n  <div class=\"list\">\n    <div class=\"manual\" onclick=\"openDetail()\">\n      <div class=\"thumb\">認</div>\n      <div>\n        <h3>ベーシックキャンドルコース</h3>\n        <div class=\"meta\"><span>受講中・Lesson 02まで完了</span><span>PDF 2件</span><span>動画 1件</span></div>\n      </div>\n      <div><span class=\"badge\">受講中</span><span class=\"arrow\">›</span></div>\n    </div>\n\n    <div class=\"manual\" onclick=\"openDetail()\">\n      <div class=\"thumb\">AR</div>\n      <div>\n        <h3>アロマ基礎講座</h3>\n        <div class=\"meta\"><span>修了済み・復習できます</span><span>PDF 1件</span></div>\n      </div>\n      <div><span class=\"badge\">修了済み</span><span class=\"arrow\">›</span></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"view\" id=\"detailView\">\n  <div class=\"detail-head\">\n    <div class=\"detail-title\">\n      <button class=\"back\" onclick=\"backToList()\">← 学ぶ一覧へ</button>\n      <h1>ベーシックキャンドルコース</h1>\n      <p>学ぶ｜受講中・Lesson 02まで完了</p>\n    </div>\n  </div>\n\n  <div class=\"detail-grid\">\n    <div class=\"card\">\n      <div class=\"section\">\n        <h2>この講座について</h2>\n        <p>この講座のレッスン教材を順番に確認できます。完了条件がある場合は、条件を満たすと次の教材へ進めます。</p>\n      </div>\n\n      <div class=\"section\">\n        <h3>1. Lesson 02｜制作実技</h3>\n        <p>受講者の理解度を確認しながら、指定されたカリキュラムの順番で進めてください。</p>\n        <div class=\"block\">\n          <strong>ポイント</strong>\n          <p>レッスン内容や認定条件を独自に変更せず、本部の最新カリキュラムを使用します。</p>\n        </div>\n      </div>\n\n      <div class=\"section\">\n        <h3>2. Lesson 01｜基本を学ぶ</h3>\n        <p>申込詳細から開講ライセンス・キット・開催日程を確認します。必要な教材や備品を事前に準備してください。</p>\n      </div>\n\n      <div class=\"section\">\n        <h3>3. 指導時の注意事項</h3>\n        <p>安全管理、材料の扱い、説明の順番、受講者へのサポートについて講座からのお知らせに従います。</p>\n      </div>\n\n      <div class=\"section\">\n        <h3>4. 修了・修了について</h3>\n        <p>指定された内容を修了したことを確認し、申込詳細から修了報告を行います。最終認定は本部が行います。</p>\n      </div>\n\n      <div class=\"section\">\n        <h3>資料</h3>\n        <div class=\"resource\">\n          <div><strong>指導チェックリスト.pdf</strong><small>PDF｜1.8MB</small></div>\n          <button class=\"btn\">開く</button>\n        </div>\n        <div class=\"resource\">\n          <div><strong>修了について.pdf</strong><small>PDF｜820KB</small></div>\n          <button class=\"btn\">開く</button>\n        </div>\n        <div class=\"resource\">\n          <div><strong>指導デモ動画</strong><small>動画｜12分</small></div>\n          <button class=\"btn\">見る</button>\n        </div>\n      </div>\n\n      <div class=\"section\">\n        <h3>FAQ</h3>\n        <div class=\"block\"><strong>日程変更になった場合は？</strong><p>申込詳細の日程を変更し、必要な案内を受講者へ行います。</p> ilKitStatus').textContent=d.kitStatus;\n  document.getElementById('detailKitNote').textContent=d.kitNote;\n  document.getElementById('detailNotice').textContent=d.notice;\n  document.getElementById('listView').classList.add('hide');\n  document.getElementById('detailView').classList.add('on');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction backToList(){\n  document.getElementById('detailView').classList.remove('on');\n  document.getElementById('listView').classList.remove('hide');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n<\\/script>\n\n</body>\n</html>"}, {"group": "受講者", "title": "お知らせ", "filename": "academy-ui-27-learner-notices-v0.1.html", "status": "確認版", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-27 Learner Notices v0.1</title>\n<style>\n:root{\n  --pink:#f9d3d2;--yellow:#ffd370;--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;\n  --ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3;--white:#fff;\n}\n*{box-sizing:border-box}\nbody{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:var(--ink);background:var(--bg)}\nbutton,a{font:inherit}a{text-decoration:none;color:inherit}\n.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}\n.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}\n.brand{font-size:18px;font-weight:800;padding:4px 10px 20px}\n.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}\n.nav div{padding:10px 12px;border-radius:9px;margin:2px 0;color:#565860}\n.nav .on{background:var(--blue);color:#fff;font-weight:700}\n.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}\n.wrap{max-width:980px;margin:auto;padding:30px 30px 80px}\n\n.titlebar{background:var(--green);padding:12px 16px 10px;border-radius </small>\n      </div>\n\n      <div class=\"list\">\n        <div class=\"item\" onclick=\"openDetail('candle')\">\n          <div class=\"icon\">認</div>\n          <div>\n            <h3>キャンドル技術認定</h3>\n            <div class=\"meta\">認定日 2026/08/20</div>\n            <div class=\"badges\">\n              <span class=\"badge ok\">認定済み</span>\n              <span class=\"badge blue\">商用利用可</span>\n              <span class=\"badge yellow\">講師活動は未申請</span>\n            </div>\n          </div>\n          <div class=\"arrow\">›</div>\n        </div>\n\n        <div class=\"item\" onclick=\"openDetail('aroma')\">\n          <div class=\"icon\">AR</div>\n          <div>\n            <h3>アロマ基礎認定</h3>\n            <div class=\"meta\">認定日 2026/07/05</div>\n            <div class=\"badges\">\n              <span class=\"badge ok\">認定済み</span>\n              <span class=\"badge gray\">ライセンスなし</span>\n            </div>\n          </div>\n          <div class=\"arrow\">›</div>\n        </div>\n      </div>\n    </section>\n\n    <section class=\"section\">\n      <div class=\"section-head\">\n        <h2>証書</h2>\n        <small>2件</small>\n      </div>\n\n      <div class=\"list\">\n        <div class=\"item\" onclick=\"openDetail('candle')\">\n          <div class=\"icon\">PDF</div>\n          <div>\n            <h3>キャンドル技術認定証</h3>\n            <div class=\"meta\">デジタル証書・発行済み</div>\n          </div>\n          <div class=\"arrow\">›</div>\n        </div>\n\n        <div class=\"item\" onclick=\"openDetail('season')\">\n          <div class=\"icon\">修</div>\n          <div>\n            <h3>季節のキャンドルコース 修了証</h3>\n            <div class=\"meta\">デジタル証書・発行済み</div>\n          </div>\n          <div class=\"arrow\">›</div>\n        </div>\n      </div>\n    </section>\n\n  </div>\n\n  <section class=\"detail-view\" id=\"detailView\">\n    <button class=\"back\" onclick=\"backList()\">← 認定・証書一覧へ</button>\n\n    <article class=\"detail-card\">\n      <div class=\"detail-head\">\n        <div id=\"detailBadges\"></div>\n        <h1 id=\"detailTitle\"></h1>\n        <p id=\"detailDate\"></p>\n      </div>\n\n      <div class=\"detail-block\">\n        <h2>認定情報</h2>\n        <ul class=\"fact-list\">\n          <li>対象講座：<span id=\"detailCourse\"></span></li>\n          <li>認定日：<span id=\"detailCertDate\"></span></li>\n          <li>認定番号：<span id=\"detailNumber\"></span></li>\n        </ul>\n      </div>\n\n      <div class=\"detail-block\">\n        <h2>現在の権利</h2>\n        <div class=\"rights\">\n          <div class=\"right-row\"><strong>スキル認定</strong><span id=\"skillStatus\"></span></div>\n          <div class=\"right-row\"><strong>商用利用</strong><span id=\"commercialStatus\"></span></div>\n          <div class=\"right-row\"><strong>講師活動</strong><span id=\"teacherStatus\"></span></div>\n        </div>\n      </div>\n\n      <div class=\"detail-block\">\n        <h2>証書</h2>\n        <div class=\"certificate\">\n          <strong id=\"certificateTitle\"></strong>\n          <p id=\"certificateMeta\"></p>\n          <div class=\"actions\" id=\"certificateActions\"></div>\n        </div>\n      </div>\n\n      <div class=\"detail-block\" id=\"teacherActionBlock\">\n        <h2>講師として活動する</h2>\n        <p style=\"font-size:12px;line-height:1.7;color:#555b63;margin:0\">\n          この認定で講師制度が設定されている場合、希望する方は講師登録へ進めます。\n        </p>\n        <div class=\"actions\">\n          <button class=\"btn blue\">講師として活動したい</button>\n        </div>\n      </div>\n    </article>\n  </section>\n\n</main>\n</div>\n</div>\n\n<nav class=\"mobile-bottom\">\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 10.5V20h13v-9.5\"/></svg><small>ホーム</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M4 5.5h6.5c1 0 1.5.5 1.5 1.5v12c0-1-.5-1.5-1.5-1.5H4z\"/><path d=\"M20 5.5h-6.5C12.5 5.5 12 6 12 7v12c0-1 .5-1.5 1.5-1.5H20z\"/></svg><small>学ぶ</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14\" rx=\"2\"/><path d=\"M8 3v5M16 3v5M4 10h16\"/></svg><small>予定</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7\"/><path d=\"M10 19h4\"/></svg><small>お知らせ</small></a>\n  <a href=\"#\" style=\"color:var(--blue)\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/></svg><small>その他</small></a>\n</nav>\n\n<script>\nconst data={\n candle:{\n   title:'キャンドル技術認定',\n   badges:'<span class=\"badge ok\">認定済み</span> <span class=\"badge blue\">商用利用可</span>',\n   date:'取得済み',\n   course:'ベーシックキャンドルコース',\n   certDate:'2026/08/20',\n   number:'CANDLE-2026-018',\n   skill:'認定済み',\n   commercial:'利用できます',\n   teacher:'未申請',\n   certTitle:'キャンドル技術認定証',\n   certMeta:'デジタル証書・発行済み',\n   certificate:true,\n   teacherAction:true\n },\n aroma:{\n   title:'アロマ基礎認定',\n   badges:'<span class=\"badge ok\">認定済み</span>',\n   date:'取得済み',\n   course:'アロマ基礎講座',\n   certDate:'2026/07/05',\n   number:'AROMA-2026-011',\n   skill:'認定済み',\n   commercial:'付与されていません',\n   teacher:'対象外',\n   certTitle:'証書の発行はありません',\n   certMeta:'認定履歴はAcademyに保存されています。',\n   certificate:false,\n   teacherAction:false\n },\n season:{\n   title:'季節のキャンドルコース 修了',\n   badges:'<span class=\"badge gray\">修了済み</span>',\n   date:'修了済み',\n   course:'季節のキャンドルコース',\n   certDate:'2026/09/12',\n   number:'—',\n   skill:'認定なし',\n   commercial:'付与されていません',\n   teacher:'対象外',\n   certTitle:'季節のキャンドルコース 修了証',\n   certMeta:'デジタル証書・発行済み',\n   certificate:true,\n   teacherAction:false\n }\n};\n\nfunction openDetail(key){\n  const d=data[key];\n  document.getElementById('detailBadges').innerHTML=d.badges;\n  document.getElementById('detailTitle').textContent=d.title;\n  document.getElementById('detailDate').textContent=d.date;\n  document.getElementById('detailCourse').textContent=d.course;\n  document.getElementById('detailCertDate').textContent=d.certDate;\n  document.getElementById('detailNumber').textContent=d.number;\n  document.getElementById('skillStatus').textContent=d.skill;\n  document.getElementById('commercialStatus').textContent=d.commercial;\n  document.getElementById('teacherStatus').textContent=d.teacher;\n  document.getElementById('certificateTitle').textContent=d.certTitle;\n  document.getElementById('certificateMeta').textContent=d.certMeta;\n  document.getElementById('certificateActions').innerHTML=d.certificate\n    ? '<button class=\"btn blue\">証書を見る</button><button class=\"btn\">保存する</button>'\n    : '';\n  document.getElementById('teacherActionBlock').style.display=d.teacherAction?'block':'none';\n  document.getElementById('listView').classList.add('hide');\n  document.getElementById('detailView').classList.add('on');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction backList(){\n  document.getElementById('detailView').classList.remove('on');\n  document.getElementById('listView').classList.remove('hide');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n<\\/script>\n</body>\n</html>"}, {"group": "受講者", "title": "設定", "filename": "academy-ui-29-learner-settings-v0.1.html", "status": "確認版", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-29 Learner Settings v0.1</title>\n<style>\n:root{\n  --pink:#f9d3d2;--yellow:#ffd370;--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;\n  --ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3;--white:#fff;\n}\n*{box-sizing:border-box}\nbody{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:var(--ink);background:var(--bg)}\nbutton,input,a{font:inherit}a{text-decoration:none;color:inherit}\n.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}\n.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}\n.brand{font-size:18px;font-weight:800;padding:4px 10px 20px}\n.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}\n.nav div{padding:10px 12px;border-radius:9px;margin:2px 0;color:#565860}\n.nav .on{background:var(--blue);color:#fff;font-weight:700}\n.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}\n.wrap{max-width:980px;margin:auto;padding:30px 30px 80px}\n.titlebar{background:var(--green);padding:12px 16px 10px;border-radius:13px 13px 0 0}\n.titlebar .en{font-size:15px;font-weight:900;letter-spacing:.08em;color:#fff}\n.titlebar .jp{font-size:10px;font-weight:750;margin-top:4px}\n.headbox{padding:18px 18px 16px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}\n.headbox p{margin:0;color:var(--muted);line-height:1.65}\n.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}\n.card h2{font-size:14px;margin:0 0 4px}\n.help{font-size:11px;color:var(--muted);line-height:1.55}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.field{margin-top:12px}\n.field label{display:block;font-size:11px;font-weight:850;margin-bottom:5px}\n.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;font-size:12px}\n.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}\n.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-size:11px;font-weight:850}\n.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}\n.link-list{margin-top:10px;border-top:1px solid var(--line)}\n.link-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}\n.link-row:last-child{border-bottom:0}\n.link-row strong{font-size:12px}\n.link-row span{font-size:11px;color:var(--muted)}\n.arrow{font-size:18px;color:#aaa}\n.note{margin-top:11px;background:#f7faf8;border:1px solid #e0ece5;border-radius:10px;padding:10px 11px;font-size:11px;color:#5d6d64;line-height:1.6}\n.mobile-bottom{display:none}\n@media(max-width:820px){\n  body{padding-bottom:74px}.app{display:block}.side{display:none}\n  .top{height:54px;padding:0 14px}.wrap{padding:16px 12px 80px}\n  .grid2{grid-template-columns:1fr}\n  .actions{justify-content:flex-start}\n  .mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid var(--line);z-index:40}\n  .mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#45484b}\n  .mobile-bottom small{font-size:9px;font-weight:700}\n  .nav-icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n}\n</style>\n</head>\n<body>\n<div class=\"app\">\n<aside class=\"side\">\n  <div class=\"brand\">mikkeOS<small>Academy｜受講者</small></div>\n  <div class=\"nav\">\n    <div>ホーム</div>\n    <div>学ぶ</div>\n    <div>予定</div>\n    <div>お知らせ</div>\n    <div>認定・証書</div>\n    <div class=\"on\">設定</div>\n  </div>\n</aside>\n<div>\n<header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>鈴木 里奈 ▾</span></header>\n<main class=\"wrap\">\n  <div class=\"titlebar\">\n    <div class=\"en\">SETTINGS</div>\n    <div class=\"jp\">設定</div>\n  </div>\n  <div class=\"headbox\">\n    <p>受講時に使用する基本情報やアカウント情報を確認・変更できます。</p>\n  </div>\n\n  <section class=\"card\">\n    <h2>基本情報</h2>\n    <div class=\"help\">申込内容や受講者情報の確認に使用します。</div>\n    <div class=\"grid2\">\n      <div class=\"field\">\n        <label>お名前</label>\n        <input value=\"鈴木 里奈\">\n      </div>\n      <div class=\"field\">\n        <label>電話番号</label>\n        <input value=\"090-0000-0000\">\n      </div>\n    </div>\n    <div class=\"field\">\n      <label>メールアドレス</label>\n      <input value=\"rina.suzuki@example.com\">\n    </div>\n    <div class=\"actions\">\n      <button class=\"btn orange\">変更を保存</button>\n    </div>\n  </section>\n\n  <section class=\"card\">\n    <h2>証書・発送先について</h2>\n    <div class=\"help\">証書のお名前やキット・証書の発送先は、必要な講座の申込時に確認します。</div>\n    <div class=\"note\">\n      申込者名を証書記載名へ自動変換したり、この設定の住所を発送先として自動確定したりしません。\n    </div>\n  </section>\n\n  <section class=\"card\">\n    <h2>mikke ID・アカウント</h2>\n    <div class=\"help\">ログインやmikkeOS共通のアカウント情報を確認します。</div>\n    <div class=\"link-list\">\n      <div class=\"link-row\">\n        <div>\n          <strong>mikke IDの設定</strong><br>\n          <span>ログイン・共通アカウント情報</span>\n        </div>\n        <div class=\"arrow\">›</div>\n      </div>\n      <div class=\"link-row\">\n        <div>\n          <strong>パスワード・ログイン設定</strong><br>\n          <span>セキュリティ設定を確認</span>\n        </div>\n        <div class=\"arrow\">›</div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"card\">\n    <h2>規約・プライバシー</h2>\n    <div class=\"link-list\">\n      <div class=\"link-row\"><strong>利用規約</strong><div class=\"arrow\">›</div></div>\n      <div class=\"link-row\"><strong>プライバシーポリシー</strong><div class=\"arrow\">›</div></div>\n    </div>\n  </section>\n</main>\n</div>\n</div>\n\n<nav class=\"mobile-bottom\">\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 10.5V20h13v-9.5\"/></svg><small>ホーム</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M4 5.5h6.5c1 0 1.5.5 1.5 1.5v12c0-1-.5-1.5-1.5-1.5H4z\"/><path d=\"M20 5.5h-6.5C12.5 5.5 12 6 12 7v12c0-1 .5-1.5 1.5-1.5H20z\"/></svg><small>学ぶ</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14\" rx=\"2\"/><path d=\"M8 3v5M16 3v5M4 10h16\"/></svg><small>予定</small></a>\n  <a href=\"#\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7\"/><path d=\"M10 19h4\"/></svg><small>お知らせ</small></a>\n  <a href=\"#\" style=\"color:var(--blue)\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/></svg><small>その他</small></a>\n</nav>\n</body>\n</html>"}];
let current = -1;

function render(filter='all'){
  const list = document.getElementById('list');
  list.innerHTML='';
  let lastGroup='';
  pages.forEach((p,i)=>{
    if(filter!=='all' && p.group!==filter) return;
    if(filter==='all' && p.group!==lastGroup){
      const h=document.createElement('h2');
      h.className='section-title'; h.textContent=p.group;
      list.appendChild(h); lastGroup=p.group;
    }
    const row=document.createElement('div'); row.className='row';
    row.innerHTML = `
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div>
        <div class="title">${escapeHtml(p.title)} <span class="badge">${escapeHtml(p.status)}</span></div>
        <div class="file">${escapeHtml(p.filename)}</div>
      </div>
      <button class="open">画面を開く</button>`;
    row.querySelector('.open').onclick=()=>openPage(i);
    list.appendChild(row);
  });
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function openPage(i){
  current=i;
  document.getElementById('viewerTitle').textContent = `${i+1}. ${pages[i].group}｜${pages[i].title}`;
  document.getElementById('frame').srcdoc = pages[i].html;
  document.getElementById('viewer').classList.add('show');
}
document.getElementById('close').onclick=()=>{
  document.getElementById('viewer').classList.remove('show');
  document.getElementById('frame').srcdoc='';
};
document.getElementById('prev').onclick=()=>{ if(current>0) openPage(current-1); };
document.getElementById('next').onclick=()=>{ if(current<pages.length-1) openPage(current+1); };
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); render(b.dataset.filter);
});
render();
</script>
</body>
</html>
