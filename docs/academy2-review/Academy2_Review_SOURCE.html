<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academy 2.0 ネオンちゃん確認用 - 1ファイル版</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f6f6f6;color:#222}
header{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #ddd;padding:14px 18px}
h1{font-size:20px;margin:0 0 4px}
.sub{font-size:12px;color:#666}
.wrap{max-width:1200px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.tabs button{border:1px solid #ddd;background:white;border-radius:999px;padding:8px 12px;cursor:pointer}
.tabs button.active{background:#222;color:white;border-color:#222}
.section-title{font-size:18px;margin:24px 0 10px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:white;border:1px solid #e5e5e5;border-radius:12px;padding:12px 14px;margin:8px 0}
.num{font-size:12px;color:#888}
.title{font-weight:700}
.file{font-size:11px;color:#777;margin-top:3px;word-break:break-all}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;background:#f0f0f0;margin-left:7px}
.open{border:0;background:#f75a3b;color:white;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}
.viewer{display:none;position:fixed;inset:0;background:#fff;z-index:20;flex-direction:column}
.viewer.show{display:flex}
.viewerbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #ddd;background:#fff}
.viewerbar .vt{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewerbar button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
iframe{width:100%;height:100%;border:0;flex:1;background:white}
.note{background:#fff7e8;border:1px solid #ffe0a8;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
@media(max-width:700px){
  .row{grid-template-columns:38px 1fr}
  .open{grid-column:1/-1;width:100%}
}
</style>
</head>
<body>
<header>
  <h1>Academy 2.0 ネオンちゃん確認用</h1>
  <div class="sub">このHTML 1ファイルだけで全画面を開けます</div>
</header>
<div class="wrap">
  <div class="note">上から順番に確認してください。画面はこのファイル内に埋め込まれているので、別HTMLは不要です。</div>
  <div class="tabs">
    <button class="active" data-filter="all">全部</button>
    <button data-filter="本部">本部</button>
    <button data-filter="講師">講師</button>
    <button data-filter="受講者">受講者</button>
  </div>
  <div id="list"></div>
</div>

<div id="viewer" class="viewer">
  <div class="viewerbar">
    <button id="prev">← 前へ</button>
    <div class="vt" id="viewerTitle"></div>
    <button id="next">次へ →</button>
    <button id="close">一覧に戻る</button>
  </div>
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
</div>

/div><div>認定</div><div>講師</div><div>ページ</div><div>設定</div></div></aside>\n<div><header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>本部責任者 ▾</span></header><main class=\"wrap\">\n<a class=\"back\" href=\"#courses\">← 講座一覧へ</a>\n<div class=\"titlebar\"><div class=\"en\">COURSE SAMPLES</div><div class=\"jp\">講座見本</div></div>\n<div class=\"intro\"><strong>自分の講座に近いものを選んでください。</strong><p>見本にはレッスン構成と書き方のヒントが入っています。選んだあと、名前も内容も自由に変更できます。</p></div>\n\n<div class=\"filters\"><button class=\"chip on\">すべて</button><button class=\"chip\">体験・WS</button><button class=\"chip\">基礎講座</button><button class=\"chip\">知識・座学</button><button class=\"chip\">実技・スキル</button><button class=\"chip\">オンライン教材</button></div>\n\n<section class=\"samples\">\n<article class=\"sample\"><div class=\"sample-top\"><span class=\"sample-type\">EXPERIENCE / WORKSHOP</span></div><div class=\"sample-body\"><h3>はじめての○○体験</h3><div class=\"sample-desc\">短時間で「知る・やってみる・完成する」までを体験してもらう講座。</div><div class=\"lessons\"><div class=\"lesson\"><b>01</b>はじめに・今日つくるもの</div><div class=\"lesson\"><b>02</b>基本を知る</div><div class=\"lesson\"><b>03</b>実際につくってみる</div><div class=\"lesson\"><b>04</b>仕上げ・まとめ</div></div><div class=\"use\"><span>4レッスン</span><button>この見本を使う →</button></div></div></article>\n\n<article class=\"sample\"><div class=\"sample-top\"><span class=\"sample-type\">BASIC COURSE</span></div><div class=\"sample-body\"><h3>○○基礎講座</h3><div class=\"sample-desc\">初めて学ぶ人が、基礎から実践まで順番に理解できる構成。</div><div class=\"lessons\"><div class=\"lesson\"><b>01</b>○○とは</div><div class=\"lesson\"><b>02</b>基本の材料・道具</div><div class=\"lesson\"><b>03</b>基本のやり方</div><div class=\"lesson\"><b>04</b>実践</div><div class=\"lesson\"><b>05</b>振り返り</div></div><div class=\"use\"><span>5レッスン</span><button>この見本を使う →</button></div></div></article>\n\n<article class=\"sample\"><div class=\"sample-top\"><span class=\"sample-type\">KNOWLEDGE</span></div><div class=\"sample-body\"><h3>○○を学ぶ講座</h3><div class=\"sample-desc\">知識や考え方を体系的に伝えたい講座向け。</div><div class=\"lessons\"><div class=\"lesson\"><b>01</b>はじめに</div><div class=\"lesson\"><b>02</b>基礎知識</div><div class=\"lesson\"><b>03</b>考え方・ポイント</div><div class=\"lesson\"><b>04</b>実例</div><div class=\"lesson\"><b>05</b>まとめ</div></div><div class=\"use\"><span>5レッスン</span><button>この見本を使う →</button></div></div></article>\n\n<article class=\"sample\"><div class=\"sample-top\"><span class=\"sample-type\">PRACTICAL SKILL</span></div><div class=\"sample-body\"><h3>○○実践レッスン</h3><div class=\"sample-desc\">手順や技術を、実際にやりながら身につける講座向け。</div><div class=\"lessons\"><div class=\"lesson\"><b>01</b>準備</div><div class=\"lesson\"><b>02</b>基本の動き</div><div class=\"lesson\"><b>03</b>実践</div><div class=\"lesson\"><b>04</b>応用</div><div class=\"lesson\"><b>05</b>仕上げ</div></div><div class=\"use\"><span>5レッスン</span><button>この見本を使う →</button></div></div></article>\n\n<article class=\"sample\"><div class=\"sample-top\"><span class=\"sample-type\">ONLINE LESSON</span></div><div class=\"sample-body\"><h3>自分のペースで学ぶ○○</h3><div class=\"sample-desc\">動画やPDFを中心に、自分のペースで進める教材型の講座。</div><div class=\"lessons\"><div class=\"lesson\"><b>01</b>Welcome</div><div class=\"lesson\"><b>02</b>Lesson 1</div><div class=\"lesson\"><b>03</b>Lesson 2</div><div class=\"lesson\"><b>04</b>Lesson 3</div><div class=\"lesson\"><b>05</b>まとめ</div></div><div class=\"use\"><span>5レッスン</span><button>この見本を使う →</button></div></div></article>\n\n<article class=\"sample\"><div class=\"sample-top\"><span class=\"sample-type\">SIMPLE LESSON</span></div><div class=\"sample-body\"><h3>シンプルな1レッスン</h3><div class=\"sample-desc\">まず1つだけ作りたい人向け。あとからレッスンを追加できます。</div><div class=\"lessons\"><div class=\"lesson\"><b>01</b>レッスン内容</div></div><div class=\"use\"><span>1レッスン</span><button>この見本を使う →</button></div></div></article>\n</section>\n\n<div class=\"blank\"><div><strong>近い見本がなくても大丈夫です。</strong><p>まっさらな講座を作って、自分の構成で始められます。</p></div><a href=\"#blank\">まっさらからつくる →</a></div>\n</main></div></div>\n\n<nav class=\"mobile-bottom\"><a href=\"#home\"><svg c  class=\"help\" style=\"margin:4px 0 0\">見本の構成が入っています。名前の変更・追加・削除・並び替えができます。</div></div><button class=\"add\">＋ レッスン追加</button></div>\n<div class=\"lesson\"><div class=\"lesson-title\"><span class=\"num\">01</span><strong>キャンドルとは</strong><span class=\"chev\">›</span></div><div class=\"materials\"><div class=\"material\"><span>📄 キャンドルの基本</span><a href=\"#material-1\">編集 →</a></div><a class=\"material-add\" href=\"#material-new\">＋ 教材を追加</a></div></div>\n<div class=\"lesson\"><div class=\"lesson-title\"><span class=\"num\">02</span><strong>材料と道具</strong><span class=\"chev\">›</span></div><div class=\"materials\"><div class=\"material\"><span>📄 材料について</span><a href=\"#material-2\">編集 →</a></div><div class=\"material\"><span>▶ 道具の使い方</span><a href=\"#material-3\">編集 →</a></div><a class=\"material-add\" href=\"#material-new\">＋ 教材を追加</a></div></div>\n<div class=\"lesson\"><div class=\"lesson-title\"><span class=\"num\">03</span><strong>基本の制作</strong><span class=\"chev\">›</span></div><div class=\"materials\"><div class=\"material\"><span>📄 基本の制作手順</span><a href=\"#material-4\">編集 →</a></div><a class=\"material-add\" href=\"#material-new\">＋ 教材を追加</a></div></div>\n</section>\n</div>\n\n<aside class=\"side-note\"><div class=\"note\"><div class=\"note-title\">この講座について</div><div class=\"note-body\"><b>講座は「教える内容」です。</b><br>ここでは内容と教材だけを作ります。<hr>この講座をどう売るかは、次に<b>販売プラン</b>で設定します。<div class=\"not-here\">ここでは設定しません：<br>価格 / 支払方法 / 開催日時 / 定員 / 認定 / キット / ライセンス</div></div></div>\n<div class=\"card\" style=\"margin-top:13px\"><h2>サムネイル</h2><div class=\"help\">講座一覧や販売ページで表示する画像です。</div><div class=\"thumbbox\"><div>画像がありません<br><button>画像を選ぶ</button></div></div></div>\n<div class=\"card preview-card\" style=\"margin-top:13px\">\n<div class=\"preview-image\"><span>COURSE IMAGE</span></div>\n<div class=\"preview-body\"><div class=\"preview-no\">COURSE 01</div><h3>キャンドル基礎</h3><p>材料と道具の基本から、キャンドル制作まで学びます。</p><div class=\"preview-meta\"><span>約120分</span><span>3レッスン</span><span>4教材</span></d }\n@media(max-width:820px){\n  .study-options,.method-options,.review-grid{grid-template-columns:1fr}\n}\n\n\n/* v0.7 kit, certificate controls, application form, page launch choices */\n.kit-panel,.cert-panel,.form-panel,.launch-panel{margin-top:12px;background:#f8faf9;border-radius:10px;padding:12px}\n.toggle-row{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;margin-top:8px}\n.toggle-box{width:20px;height:20px;border-radius:6px;border:1px solid #cfd0d4;display:grid;place-items:center;flex:0 0 auto}\n.toggle-row.on{border-color:var(--green);background:#f7fcf9}\n.toggle-row.on .toggle-box{background:var(--green);border-color:var(--green)}\n.toggle-row.on .toggle-box:after{content:\"✓\";font-weight:900}\n.mini-fields{display:none;margin:8px 0 0 29px;gap:8px}\n.toggle-row.on + .mini-fields{display:grid}\n.mini-fields label{font-size:9px;font-weight:800;color:#555}\n.mini-fields input,.mini-fields select,.form-row input,.form-row select{width:100%;border:1px solid #dcdde2;border-radius:8px;padding:8px;background:#fff;font-size:10px}\n.cert-settings{display:none;margin:8px 0 0 30px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:9px}\n.after-choice.on + .cert-settings{display:block}\n.cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}\n.cert-grid label{font-size:9px;font-weight:800}\n.form-builder{display:grid;gap:8px;margin-top:12px}\n.form-row{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}\n.form-row strong{font-size:10px}\n.form-row p{font-size:9px;color:var(--muted);margin:3px 0 0}\n.form-badge{display:inline-block;font-size:8px;font-weight:850;background:#eef5f1;color:#4f806c;padding:3px 6px;border-radius:999px;margin-left:5px}\n.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.form-actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:9px;font-weight:800}\n.launch-options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}\n.launch-card{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff}\n.launch-card strong{display:block;font-size:11px;margin-bottom:4px}\n.launch-card p{font-size:9px;color:var(--muted);line-height:1.5;margin:0 0 10px}\n.launch-card button{width:100%;border:0;border-radius:8px;padding:9px;font-size:9px;font-weight:850}\n.launch-card .plain{background:#eef7f2;color:#3d735e}\n.launch-card .builder{background:var(--blue);color:#fff}\n.launch-card .template{background:#fff3c9;color:#735b00}\n.publish-checklist{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}\n.publish-checklist div{display:flex;justify-content:space-between;padding:9px 10px;border-top:1px solid var(--line);font-size:10px}\n.publish-checklist div:first-child{border-top:0}\n.status-ok{color:#4f806c;font-weight:850}.status-warn{color:#a27600;font-weight:850}\n@media(max-width:820px){.cert-grid,.launch-options{grid-template-columns:1fr}}\n\n\n/* v0.10 application form conditional preview */\n.auto-fields{margin-top:12px;background:#f4f7ff;border-radius:10px;padding:11px}\n.auto-fields h3{font-size:10px;margin:0 0 5px}\n.auto-fields p{font-size:9px;color:#666;line-height:1.55;margin:0 0 8px}\n.auto-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:7px;font-size:9px}\n.auto-item b{display:block;font-size:9px;margin-bottom:3px}\n.preview-form-btn{margin-top:10px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:9px 11px;font-size:9px;font-weight:850}\n.form-overlay{position:fixed;inset:0;background:rgba(32,33,38,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:120}\n.form-overlay.on{display:flex}\n.form-modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 20px 70px rgba(0,0,0,.24)}\n.form-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}\n.form-modal-head strong{font-size:12px}.form-close{border:0;background:#eee;border-radius:8px;width:30px;height:30px;font-weight:900}\n.customer-form{padding:18px}\n.customer-form h2{font-size:18px;margin:0 0 4px}\n.customer-form .lead{font-size:9px;color:#777;line-height:1.55;margin-bottom:14px}\n.consult-note{background:#fff8dc;border-radius:10px;padding:10px;font-size:9px;line-height:1.6;margin-bottom:12px}\n.customer-field{margin-top:10px}\n.customer-field label{display:block;font-size:9px;font-weight:850;margin-bottom:5px}\n.customer-field input,.customer-field textarea,.customer-field select{width:100%;border:1px solid #d9dbe0;border-radius:8px;padding:9px;font-size:10px;background:#fff}\n.customer-field textarea{min-height:70px}\n.date-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.submit-demo{margin-top:15px;border:0;background:var(--orange);color:#fff;border-radius:9px;padding:11px 15px;font-size:10px;font-weight:850;width:100%}\n@media(max-width:700px){.date-grid{grid-template-columns:1fr}}\n\n</style></head><body>\n<div class=\"app\"><aside class=\"side\"><div class=\"brand\">mikkeOS<small>Academy</small></div><div class=\"nav\"><div>ホーム</div><div>講座</div><div class=\"on\">販売プラン</div><div>開催</div><div>申込</div><div>認定</div><div>講師</div><div>ページ</div><div>設定</div></div></aside>\n<div><header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>本部責任者 ▾</span></header><main class=\"wrap\">\n<a class=\"back\" href=\"#plans\">← 販売プラン一覧へ</a>\n<div class=\"titlebar\"><div class=\"en\">COURSE</div><div class=\"jp\">コースをつくる</div></div><div class=\"intro\"><strong>質問に答えていけば、販売プランが完成します。</strong><p>選んだ内容に必要な設定だけを表示します。</p></div>\n<div class=\"steps\"><div class=\"step on\" onclick=\"goStep1()\">1 講座・順番</div><div class=\"step\" onclick=\"goStep2()\">2 受講スタイル</div><div class=\"step\" onclick=\"goStep3()\">3 金額</div><div class=\"step\" onclick=\"goStep4()\">4 支払い</div><div class=\"step\" onclick=\"goStep5()\">5 受講後</div><div class=\"step\" onclick=\"goStep6()\">6 申込フォーム</div><div class=\"step\" onclick=\"goStep7()\">7 確認・販売ページ</div></div>\n<div class=\"layout\">\n<section class=\"card\"><h2>このコースに入れる講座を選ぶ</h2><div class=\"help\">作成済みの講座から選びます。ここでは販売する講座の組み合わせだけを決めます。</div>\n<div class=\"course-list\">\n<div class=\"course\" onclick=\"this.classList.toggle('open')\"><span class=\"drag\">☰</span><div class=\"thumb\">01</div><div><strong>キャンドル基礎</strong><small>3レッスン・4教材<span class=\"course-price\">単品参考 ¥8,000</span></small></div><button class=\"remove\" onclick=\"event.stopPropagation()\">×</button><div class=\"course-details\"><b>講座内容</b><br>キャンドルの基本 → 材料と道具 → 基本の制作<br><a href=\"#course-1\" style=\"color:#4f806c;font-weight:800\">講座を確認 →</a></div></div>\n<div class=\"course\" onclick=\"this.classList.toggle('open')\"><span class=\"drag\">☰</span><div class=\"thumb\">02</div><div><strong>制作実技</strong><small>4レッスン・6教材<span class=\"course-price\">単品参考 ¥7,000</span></small></div><button class=\"remove\" onclick=\"event.stopPropagation()\">×</button><div class=\"course-details\"><b>講座内容</b><br>制作準備 → 基本制作 → 仕上げ → 振り返り<br><a href=\"#course-2\" style=\"color:#4f806c;font-weight:800\">講座を確認 →</a></div></div>\n<div class=\"course\" onclick=\"this.classList.toggle('open')\"><span class=\"drag\">☰</span><div class=\"thumb\">03</div><div><strong>応用デザイン</strong><small>2レッスン・3教材<span class=\"course-price\">単品参考 ¥6,000</span></small></div><button class=\"remove\" onclick=\"event.stopPropagation()\">×</button><div class=\"course-details\"><b>講座内容</b><br>デザインの考え方 → 応用制作<br><a href=\"#course-3\" style=\"color:#4f806c;font-weight:800\">講座を確認 →</a></div></div>\n</div><button class=\"add\">＋ 講座を追加</button>\n<div class=\"note\">次のSTEPで、受講する順番を決めます。レッスンや教材の並び替えは、それぞれの「講座」編集で行います。</div>\n<div class=\"actions\"><span></span><button class=\"next\" onclick=\"goStep2()\">次へ：受講する順番 →</button></div></section>\n<aside class=\"card preview\"><div class=\"preview-label\">現在選んでいる講座</div><div class=\"pitem\"><b>COURSE 01</b><strong>キャンドル基礎</strong><span>材料と道具の基本から学びます。</span></div><div class=\"down\">↓</div><div class=\"pitem\"><b>COURSE 02</b><strong>制作実技</strong><span>実際に制作しながら身につけます。</span></div><div class=\"down\">↓</div><div class=\"pitem\"><b>COURSE 03</b><strong>応用デザイン</strong><span>応用デザインを学びます。</span></div><a href=\"#learner-preview\">受講者から見る →</a></aside>\n</div>\n</main></div></div>\n<nav class=\"mobile-bottom\"><a href=\"#home\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 10.5V20h13v-9.5\"/></svg><small>ホーム</small></a><a href=\"#courses\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M4 5.5h6.5c1.1 0 1.5.5 1.5 1.5v12c0-1-.5-1.5-1.5-1.5H4z\"/><path d=\"M20 5.5h-6.5C12.5 5.5 12 6 12 7v12c0-1 .5-1.5 1.5-1.5H20z\"/></svg><small>講座</small></a><div class=\"slot\"><button class=\"plus\"></button></div><a href=\"#applications\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 9h6M9 13h6M9 17h4\"/></svg><small>申込</small></a><a href=\"#more\"><svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.3\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\"/></svg><small>その他</small></a></nav>\n<script>\n\nfunction markStep(n){document.querySelectorAll('.step').forEach((x,i)=>{x.classList.remove('on');if(i<n-1)x.classList.add('done');else x.classList.remove('done')});document.querySelectorAll('.step')[n-1].classList.add('on')}\nfunction C(){return document.querySelector('.layout > .card')}\nfunction cleanup(c){c.querySelectorAll('.schedule-options,.study-panel,.price-panel,.payment-panel,.after-panel,.form-panel,.review-panel,.launch-panel').forEach(x=>x.remove())}\nfunction showCourses(c){c.querySelector('.course-list').style.display='grid';c.querySelector('.add').style.display='inline-block';c.querySelector('.note').style.display='block'}\nfunction hideCourses(c){c.querySelector('.course-list').style.display='none';c.querySelector('.add').style.display='none';c.querySelector('.note').style.display='none'}\n\nfunction goStep1(){\n  markStep(1);let c=C();cleanup(c);showCourses(c);\n  c.querySelector('h2').textContent='講座を選んで、受講する順番を決める';\n  c.querySelector('.help').textContent='作成済みの講座から選び、そのままドラッグして受講する順番に並べます。講座を押すと内容を確認できます。';\n  c.querySelector('.note').textContent='この順番は講座単位です。各講座内のレッスン・教材の順番は、それぞれの「講座」編集で管理します。';\n  c.querySelector('.actions').innerHTML='<span></span><button class=\"next\" onclick=\"goStep2()\">次へ：受講スタイル →</button>';\n}\n\nfunction goStep2(){\n  markStep(2);let c=C();cleanup(c);hideCourses(c);\n  c.querySelector('h2').textContent='どうやって受講しますか？';\n  c.querySelector('.help').textContent='この販売プラン全体の受講スタイルを決めます。日程や定員はここでは設定しません。';\n  let b=document.createElement('div');b.className='study-panel';\n  b.innerHTML=`\n    <div class=\"study-options\">\n      <div class=\"study-choice on\" data-mode=\"teacher\"><strong>先生から受講する</strong><p>対面やオンラインで、先生から直接レッスンを受けます。</p></div>\n      <div class=\"study-choice\" data-mode=\"self\"><strong>レッスン教材だけで学ぶ</strong><p>動画・PDF・文章などを使って、自分で学びます。</p></div>\n    </div>\n\n    <div class=\"conditional\" id=\"teacherOptions\">\n      <h3>この販売プランで利用できる開催方法</h3>\n      <div class=\"method-options\">\n        <div class=\"method-choice on\"><strong>対面</strong><p>会場で受講できるようにします。</p></div>\n        <div class=\"method-choice on\"><strong>オンライン</strong><p>Zoom等で受講できるようにします。</p></div>\n      </div>\n      <div style=\"margin-top:12px;font-size:10px;font-weight:850\">レッスン教材も使いますか？</div>\n      <div class=\"radio-line on\"><span class=\"radio-dot\"></span><span><b>使わない</b><br><small>受講者には教材を公開しません。</small></span></div>\n      <div class=\"radio-line\"><span class=\"radio-dot\"></span><span><b>受講前から見せる</b><br><small>講座中に一緒に使う場合もこちらです。</small></span></div>\n      <div class=\"radio-line\"><span class=\"radio-dot\"></span><span><b>受講後に見せる</b><br><small>復習教材として受講後から利用できます。</small></span></div>\n    </div>\n\n    <div class=\"conditional\" id=\"selfOptions\" style=\"display:none\">\n      <h3>レッスン教材について</h3>\n      <div style=\"font-size:10px;line-height:1.6\">講座に設定されているレッスン・教材・順番を使います。開催の登録は必要ありません。</div>\n    </div>\n\n    <div class=\"kit-panel\">\n      <h3 style=\"font-size:11px;margin:0\">受講に必要なキット・発送物はありますか？</h3>\n      <div class=\"toggle-row\" id=\"kitToggle\"><span class=\"toggle-box\"></span><div><strong>キット・発送物あり</strong><p>材料セット、道具、冊子などを受講者へ渡す場合に設定します。</p></div></div>\n      <div class=\"mini-fields\">\n        <label>キット・発送物の名前<input value=\"キャンドル制作キット\"></label>\n        <div>\n          <div style=\"font-size:9px;font-weight:800;color:#555;margin-bottom:6px\">受け渡し方法</div>\n          <div class=\"method-options\">\n            <div class=\"method-choice on\" id=\"kitShip\"><strong>事前に発送</strong><p>オンライン受講など、開催前に受講者へ送ります。</p></div>\n            <div class=\"method-choice on\" id=\"kitHand\"><strong>会場で手渡し</strong><p>対面開催で、当日に直接お渡しします。</p></div>\n          </div>\n          <div style=\"font-size:9px;color:var(--muted);margin-top:7px\">両方選べます。実際にどちらで渡すかは、各「開催」で決めます。</div>\n        </div>\n      </div>\n      <div style=\"font-size:9px;color:var(--muted);margin-top:7px\">※ 講師が認定講座を開講するときに本部へ注文する「開講用キット」とは別の設定です。</div>\n    </div>\n\n    <div class=\"schedule-note\"><b>日程・受付方法・担当者・定員は、作成後に「開催」で設定します。</b></div>`;\n  c.insertBefore(b,c.querySelector('.actions'));\n\n  b.querySelectorAll('.study-choice').forEach(o=>o.onclick=()=>{\n    b.querySelectorAll('.study-choice').forEach(x=>x.classList.remove('on'));o.classList.add('on');\n    let teacher=o.dataset.mode==='teacher';b.querySelector('#teacherOptions').style.display=teacher?'block':'none';b.querySelector('#selfOptions').style.display=teacher?'none':'block';\n  });\n  b.querySelectorAll('.method-choice').forEach(o=>o.onclick=()=>o.classList.toggle('on'));\n  b.querySelectorAll('.radio-line').forEach(o=>o.onclick=()=>{b.querySelectorAll('.radio-line').forEach(x=>x.classList.remove('on'));o.classList.add('on')});\n  b.querySelector('#kitToggle').onclick=()=>b.querySelector('#kitToggle').classList.toggle('on');\n  c.querySelector('.actions').innerHTML='<button class=\"back-step\" onclick=\"goStep1()\">← 戻る</button><button class=\"next\" onclick=\"goStep3()\">次へ：金額 →</button>';\n}\n\nfunction goStep3(){\n  markStep(3);let c=C();cleanup(c);hideCourses(c);\n  c.querySelector('h2').textContent='このコースの金額を決める';\n  c.querySelector('.help').textContent='単品参考価格を見ながら、この販売プランでの実際の料金を設定します。';\n  let b=document.createElement('div');b.className='price-panel';\n  b.innerHTML=`<div class=\"price-summary\"><div class=\"price-head\">選んだ講座の単品参考価格</div><div class=\"price-row\"><span>キャンドル基礎</span><b>¥8,000</b></div><div class=\"price-row\"><span>制作実技</span><b>¥7,000</b></div><div class=\"price-row\"><span>応用デザイン</span><b>¥6,000</b></div><div class=\"price-total\"><span>参考価格の合計</span><strong>¥21,000</strong></div></div>\n  <div class=\"billing-model\"><div class=\"billing-choice on\" data-billing=\"bundle\"><strong>コースまとめて料金</strong><p>コース全体の価格を決めて、まとめて販売します。</p></div><div class=\"billing-choice\" data-billing=\"step\"><strong>講座ごとに料金</strong><p>前の講座を修了後、次の講座ごとに購入する方式です。</p></div></div>\n  <div id=\"bundlePrice\"><div class=\"field\"><label>コース販売価格</label><div class=\"input-wrap\"><span>¥</span><input id=\"planPrice\" value=\"18000\" oninput=\"checkPrice()\"></div><div class=\"discount\" id=\"discount\"></div><div class=\"price-warning\" id=\"priceWarning\"><b>参考価格より大きく下回っています。</b><br>入力間違いや必要な費用が含まれているか確認してください。</div></div></div>\n  <div id=\"stepPrices\" style=\"display:none\"><div class=\"price-summary\"><div class=\"price-head\">このコースでの価格</div><div class=\"price-row\"><span>01 キャンドル基礎</span><b>¥7,000</b></div><div class=\"price-row\"><span>02 制作実技</span><b>¥6,000</b></div><div class=\"price-row\"><span>03 応用デザイン</span><b>¥5,000</b></div><div class=\"price-total\"><span>コース内合計</span><strong>¥18,000</strong></div></div><div class=\"note\">これはクレジットカードの分割払いではありません。前の講座を修了し、次の講座のお支払い確認後に次へ進みます。</div></div>`;\n  c.insertBefore(b,c.querySelector('.actions'));\n  b.querySelectorAll('.billing-choice').forEach(o=>o.onclick=()=>{b.querySelectorAll('.billing-choice').forEach(x=>x.classList.remove('on'));o.classList.add('on');let bundle=o.dataset.billing==='bundle';b.querySelector('#bundlePrice').style.display=bundle?'block':'none';b.querySelector('#stepPrices').style.display=bundle?'none':'block'});\n  c.querySelector('.actions').innerHTML='<button class=\"back-step\" onclick=\"goStep2()\">← 戻る</button><button class=\"next\" onclick=\"goStep4()\">次へ：支払い →</button>';checkPrice();\n}\nfunction checkPrice(){let v=Number(document.getElementById('planPrice')?.value||0),sum=21000,d=document.getElementById('discount'),w=document.getElementById('priceWarning');if(!d)return;d.textContent=v<sum?`参考合計より ¥${(sum-v).toLocaleString()} お得`:v>sum?`参考合計より ¥${(v-sum).toLocaleString()} 高い設定`:'参考価格の合計と同額';w.classList.toggle('show',v>0&&v<sum*.65)}\n\nfunction goStep4(){markStep(4);let c=C();cleanup(c);hideCourses(c);c.querySelector('h2').textContent='支払い方法を決める';c.querySelector('.help').textContent='受講者が使える支払い方法を選びます。必要な方法だけ設定してください。';let b=document.createElement('div');b.className='payment-panel';b.innerHTML=`<div class=\"pay-options\"><div class=\"pay-option\"><span class=\"check\">✓</span><div><strong>カード決済</strong><p>Academy上でクレジットカード決済を受け付けます。</p></div></div><div class=\"pay-option\"><span class=\"check\">✓</span><div><strong>銀行振込</strong><p>受講者に振込先を案内します。</p></div></div><div class=\"pay-option\"><span class=\"check\">✓</span><div><strong>外部の決済サービスを使う</strong><p>Squareなど、すでに利用している決済ページへ案内します。</p></div></div></div>`;c.insertBefore(b,c.querySelector('.actions'));c.querySelector('.actions').innerHTML='<button class=\"back-step\" onclick=\"goStep3()\">← 戻る</button><button class=\"next\" onclick=\"goStep5()\">次へ：受講後 →</button>'}\n\nfunction goStep5(){markStep(5);let c=C();cleanup(c);hideCourses(c);c.querySelector('h2').textContent='受講後はどうしますか？';c.querySelector('.help').textContent='必要なものだけ選びます。選んだ内容に必要な設定だけが表示されます。';let b=document.createElement('div');b.className='after-panel';b.innerHTML=`<div class=\"after-list\">\n<div class=\"after-choice on\"><span class=\"after-check\"></span><div><strong>修了として記録する</strong><p>このコースを修了した記録を残します。</p></div></div><div class=\"subsettings\">修了条件の詳細は、講座側の完了・確認条件と販売プラン全体の条件に従います。</div>\n<div class=\"after-choice\"><span class=\"after-check\"></span><div><strong>証書を発行する</strong><p>修了証、認定証・デュプロマ、その他の証書を発行できます。</p></div></div><div class=\"cert-settings\"><b>証書の設定</b><div class=\"cert-grid\"><label>証書の種類<select><option>修了証</option><option>認定証・デュプロマ</option><option>その他</option></select></label><label>発行方法<select><option>デジタル</option><option>現物を発送</option><option>デジタル＋現物</option></select></label></div></div>\n<div class=\"after-choice\"><span class=\"after-check\"></span><div><strong>スキル認定する</strong><p>この講座で学んだ技術・知識を習得したことを認定します。</p></div></div><div class=\"subsettings\">認定するスキル・対象を設定します。</div>\n<div class=\"after-choice\"><span class=\"after-check\"></span><div><strong>商用利用を許可する</strong><p>認定した技術を仕事に使えるようにします。</p></div></div><div class=\"subsettings\">商用利用ライセンスの対象技術・継続条件を設定します。</div>\n<div class=\"after-choice\"><span class=\"after-check\"></span><div><strong>この講座を教えられるようにする</strong><p>本部の講座を、講師として販売・開催できるようにします。</p></div></div><div class=\"subsettings\">講師登録・契約・会費・マニュアル・営業ページ・開講ライセンス等を設定します。</div></div>`;c.insertBefore(b,c.querySelector('.actions'));b.querySelectorAll('.after-choice').forEach(o=>o.onclick=()=>o.classList.toggle('on'));c.querySelector('.actions').innerHTML='<button class=\"back-step\" onclick=\"goStep4()\">← 戻る</button><button class=\"next\" onclick=\"goStep6()\">次へ：申込フォーム →</button>'}\n\nfunction goStep6(){\n  markStep(6);let c=C();cleanup(c);hideCourses(c);\n  c.querySelector('h2').textContent='申込フォームを設定する';\n  c.querySelector('.help').textContent='募集時に、お客様へ入力してもらう内容を決めます。開催の受付 "side\"><div class=\"brand\">mikkeOS<small>Academy</small></div><div class=\"nav\"><div>ホーム</div><div>講座</div><div class=\"on\">販売プラン</div><div>開催</div><div>申込</div><div>認定</div><div>講師</div><div>ページ</div><div>設定</div></div></aside>\n<div><header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>本部責任者 ▾</span></header><main class=\"wrap\">\n<a class=\"back\" href=\"#\">← 販売プラン「ベーシックキャンドルコース」へ</a>\n<div class=\"headrow\"><div class=\"title\"><h1>販売ページ</h1><p>販売プランの内容から標準ページを自動で作成します。このまま使うことも、好きな見せ方に変更することもできます。</p></div><div class=\"status-actions\"><button class=\"btn\">スマホで確認</button><button class=\"btn\">プレビュー</button><button class=\"btn blue\">保存</button></div></div>\n<div class=\"notice\"><div><b>まだ受付できる「開催」がありません。</b><br>ページは作成できますが、先生から受講するプランの募集開始には開催の登録が必要です。</div><a href=\"#\">開催を追加 →</a></div>\n<div class=\"tabs\"><button class=\"tab on\" data-tab=\"standard\">標準ページ</button><button class=\"tab\" data-tab=\"templates\">テンプレート</button><button class=\"tab\" data-tab=\"builder\">ビルダー</button></div>\n<section class=\"panel on\" id=\"standard\"><div class=\"two\"><div><div class=\"preview-shell\"><div class=\"browser\"><div class=\"browserbar\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span><div class=\"url\">academy.mikke.app/.../basic-candle-course</div></div><div class=\"public\"><div class=\"pub-top\"><div class=\"pub-brand\">灯りのアトリエ <small>Candle School</small></div><div class=\"pub-nav\">講座について　開催日程　お申込み</div></div>\n<section class=\"hero\"><div class=\"hero-copy\"><div class=\"eyebrow\">BASIC CANDLE COURSE</div><h2>はじめてから学べる<br>ベーシックキャンドルコース</h2><p>材料と道具の基本から、制作、応用デザインまで。3つの講座を順番に学ぶコースです。</p><div class=\"hero-meta\"><span class=\"pill\">3講座</span><span class=\"pill\">対面 / オンライン</span><span class=\"pill\">キットあり</span></div><button class=\"cta\">開催日程・お申込みを見る</button></div><div class=\"hero-img\"></div></section>\n<section class=\"section\"><div class=\"section-head\"><b>ABOUT</b><h3>このコースについて</h3><p>キャンドルづくりを基礎から順番に学びたい方のためのコースです。先生から直接受講しながら、必要に応じてレッスン教材も利用できます。</p></div><div class=\"course-grid\"><div class=\"course-card\"><div class=\"course-photo\"></div><div class=\"course-body\"><b>COURSE 01</b><strong>キャンドル基礎</strong><p>材料と道具の基本から学びます。</p></div></div><div class=\"course-card\"><div class=\"course-photo\"></div><div class=\"course-body\"><b>COURSE 02</b><strong>制作実技</strong><p>実際に制作しながら身につけます。</p></div></div><div class=\"course-card\"><div class=\"course-photo\"></div><div class=\"course-body\"><b>COURSE 03</b><strong>応用デザイン</strong><p>応用デザインを学びます。</p></div></div></div></section>\n<section class=\"section alt\"><div class=\"section-head\"><b>STYLE</b><h3>受講について</h3></div><div class=\"info-grid\"><div class=\"info\"><b>受講スタイル</b><strong>先生から受講</strong><p>対面またはオンラインで受講できます。実際の方法は各開催から選びます。</p></div><div class=\"info\"><b>キット</b><strong>キャンドル制作キット</strong><p>事前発送、または対面開催では当日手渡しに対応します。</p></div><div class=\"info\"><b>レッスン教材</b><strong>必要に応じて利用</strong><p>講座で設定されたレッスン教材を、設定されたタイミングから利用します。</p></div><div class=\"info\"><b>受講後</b><strong>修了として記録</strong><p>追加の証書・認定・ライセンスがある場合はここに表示されます。</p></div></div></section>\n<section class=\"section\"><div class=\"section-head\"><b>PRICE</b><h3>料金</h3></div><div class=\"price-box\"><div><small>コースまとめて料金</small><div class=\"price\">¥18,000</div></div><button class=\"cta\">お申込みへ</button></div></section>\n<section class=\"section alt\"><div class=\"section-head\"><b>SCHEDULE</b><h3>開催日程</h3><p>登録されている開催日程や、日程相談の受付がここに表示されます。</p></div><div class=\"schedule-empty\">現在、受付できる開催を準備中です。</div></section>\n<section class=\"section\"><div class=\"apply-box\"><h3>お申込み</h3><p>開催を選択したあと、こちらの申込フォームへ進みます。</p><div class=\"form-preview\"><div class=\"fake-input\">お名前</div><div class=\"fake-input\">メールアドレス</div><div class=\"fake-input\">電話番号</div><div class=\"fake-input\">備考・質問</div><div class=\"fake-input\">□ 申込規約に同意する</div></div></div></section>\n<div class=\"pub-footer\"><span>© 灯りのアトリエ</span><span>Powered by mikkeOS Academy</span></div></div></div></div></div>\n<aside><div class=\"card\"><h3>標準ページ</h3><div class=\"help\">販売プランの設定から自動で作られるページです。ビルダーを使わなくても、このまま募集ページとして利用できます。</div><div class=\"summary-list\"><div class=\"sum\"><span>販売プラン</span><span>ベーシックキャンドルコース</span></div><div class=\"sum\"><span>講座</span><span>3講座</span></div><div class=\"sum\"><span>料金</span><span>¥18,000</span></div><div class=\"sum\"><span>開催</span><span style=\"color:#a27600\">未登録</span></div><div class=\"sum\"><span>申込フォーム</span><span style=\"color:#4f806c\">設定済み</span></div></div></div>\n<div class=\"card\" style=\"margin-top:12px\"><h3>ページの作り方</h3><div class=\"mode-cards\" style=\"grid-template-columns:1fr\"><div class=\"mode\"><strong>このまま使う</strong><p>標準ページをそのまま利用します。</p><button class=\"plain\">このページを使う</button></div><div class=\"mode\"><strong>ビルダーでカスタム</strong><p>標準ページを土台に自由に編集します。</p><button class=\"builder\" onclick=\"switchTab('builder')\">ビルダーを開く</button></div><div class=\"mode\"><strong>テンプレートから作る</strong><p>目的に合った完成テンプレートから始めます。</p><button class=\"template\" onclick=\"switchTab('templates')\">テンプレートを見る</button></div></div></div></aside></div></section>\n<section class=\"panel\" id=\"templates\"><div class=\"card\" style=\"margin-bottom:12px\"><h3>テンプレートから作る</h3><div class=\"help\">販売プランの内容はそのまま使い、ページの見せ方だけを選びます。テンプレートを選んでも価格・開催・申込条件を入力し直す必要はありません。</div></div><div class=\"template-grid\"><div class=\"template-card\"><div class=\"template-thumb\">Handmade<br>& Craft</div><div class=\"template-body\"><strong>ハンドメイド・クラフト</strong><p>作品写真や制作風景を大きく見せる構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Beauty<br>& Wellness</div><div class=\"template-body\"><strong>美容・ウェルネス</strong><p>清潔感と変化が伝わるレッスン向け。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Food<br>& Cooking</div><div class=\"template-body\"><strong>食・料理</strong><p>完成写真や工程を魅力的に見せる構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Lesson<br>& School</div><div class=\"template-body\"><strong>レッスン・スクール</strong><p>カリキュラムや学びの流れが伝わりやすい構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Session<br>& Consultation</div><div class=\"template-body\"><strong>相談・セッション</strong><p>人柄、相談内容、安心感を中心にした構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Creative<br>& Business</div><div class=\"template-body\"><strong>クリエイティブ・ビジネス</strong><p>実績・内容・提供価値を整理して見せる構成。</p><button>このテンプレートを使う</button></div></div></div></section>\n<section class=\"panel\" id=\"builder\"><div class=\"builder-tools\"><div class=\"left\"><button class=\"btn\" onclick=\"resetToStandard()\">標準ページを元に戻す</button><button class=\"btn\" onclick=\"switchTab('templates')\">テンプレート変更</button></div><div class=\"right\"><button class=\"btn\">スマホ</button><button class=\"btn\">プレビュー</button><button class=\"btn blue\">保存</button></div></div><div class=\"builder-layout\"><aside class=\"builder-side\"><h3>セクションを追加</h3><div class=\"block\" onclick=\"addSection('hero')\">＋ HERO</div><div class=\"block\" onclick=\"addSection('text')\">＋ 文章</div><div class=\"block\" onclick=\"addSection('image')\">＋ 画像</div><div class=\"block\" onclick=\"addSection('courses')\">＋ 講座一覧</div><div class=\"block\" onclick=\"addSection('price')\">＋ 料金</div><div class=\"block\" onclick=\"addSection('schedule')\">＋ 開催日程</div><div class=\"block\" onclick=\"addSection('teacher')\">＋ 講師紹介</div><div class=\"block\" onclick=\"addSection('faq')\">＋ FAQ</div><div class=\"block\" onclick=\"addSection('cta')\">＋ 申込ボタン</div><div class=\"block\" onclick=\"addSection('divider')\">＋ 区切り</div></aside><div class=\"canvas\"><div class=\"canvas-page\" id=\"canvasPage\">\n<div class=\"canvas-section\" draggable=\"true\"><div class=\"section-controls\"><button>↕ 移動</button><button onclick=\"removeSection(this)\">削除</button></div><div style=\"display:grid;grid-template-columns:1.1fr .9fr;min-height:250px\"><div style=\"padding:34px\"><div class=\"eyebrow\">BASIC CANDLE COURSE</div><h2 style=\"font-size:27px;margin:8px 0 10px\">はじめてから学べる<br>ベーシックキャンドルコース</h2><p style=\"font-size:10px;color:#777;line-height:1.7\">材料と道具の基本から、制作、応用デザインまで。</p><button class=\"cta\">お申込みへ</button></div><div class=\"hero-img\"></div></div></div>\n<div class=\"canvas-section\" draggable=\"true\" style=\"padding:30px\"><div class=\"section-controls\"><button>↕ 移動</button><button onclick=\"removeSection(this)\">削除</button></div><h3>このコースについて</h3><p style=\"font-size:10px;color:#777;line-height:1.7\">販売プランの内容から自動生成された文章です。クリックして編集できます。</p></div>\n<div class=\"canvas-section\" draggable=\"true\" style=\"padding:30px;background:#faf9f7\"><div class=\"section-controls\"><button>↕ 移動</button><button onclick=\"removeSection(this)\">削除</button></div><h3>講座内容</h3><div class=\"course-grid\"><div class=\"course-card\"><div class=\"course-body\"><strong>01 キャンドル基礎</strong></div></div><div class=\"course-card\"><div class=\"course-body\"><strong>02 制作実技</strong></div></div><div class=\"course-card\"><div class=\"course-body\"><strong>03 応用デザイン</strong></div></div></div></div>\n<div class=\"canvas-section\" draggable=\"true\" style=\"padding:30px\"><div class=\"section-controls\"><button>↕ 移動</button><button onclick=\"removeSection(this)\">削除</button></div><h3>料金</h3><div class=\"price\">¥18,000</div></div>\n<div class=\"canvas-section\" draggable=\"true\" style=\"padding:30px;background:#faf9f7\"><div class=\"section-controls\"><button>↕ 移動</button><button onclick=\"removeSection(this)\">削除</button></div><h3>開催日程</h3><div class=\"schedule-empty\">関連する「開催」から自動表示されます。</div></div>\n</div></div><aside class=\"builder-settings\"><h3>選択中：HERO</h3><div class=\"setting\"><label>見出し</label><input value=\"はじめてから学べる ベーシックキャンドルコース\"></div><div class=\"setting\"><label>サブテキスト</label><input value=\"材料と道具の基本から学べます\"></div><div class=\"setting\"><label>画像</label><button class=\"btn\" style=\"width:100%\">画像を変更</button></div><div class=\"setting\"><label>配置</label><select><option>文字左・画像右</option><option>画像左・文字右</option><option>画像全面</option></select></div><div class=\"setting\"><label>余白</label><select><option>標準</option><option>狭い</option><option>広い</option></select></div><div style=\"font-size:8px;color:#888;line-height:1.5;margin-top:12px\">標準ページを土台に、配置換え・写真・文章の編集、セクションの追加／削除ができます。料金・開催日程・申込フォームなどの販売条件は販売プラン／開催と連動します。</div></aside></div></section>\n</main></div></div>\n<nav class=\"mobile-bottom\"><a>ホーム</a><a>講座</a><div class=\"slot\">＋</div><a>申込</a><a>その他</a></nav>\n<script>const tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.panel')];tabs.forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));function switchTab(id){tabs.forEach(t=>t.classList.toggle('on',t.dataset.tab===id));panels.forEach(p=>p.classList.toggle('on',p.id===id));window.scrollTo({top:0,behavior:'smooth'})}\nlet dragEl=null;\nfunction initDnD(){\n  document.querySelectorAll('#canvasPage .canvas-section').forEach(sec=>{\n    sec.addEventListener('dragstart',()=>{dragEl=sec;sec.classList.add('dragging')});\n    sec.addEventListener('dragend',()=>{sec.classList.remove('dragging');dragEl=null});\n    sec.addEventListener('dragover',e=>{e.preventDefault();sec.classList.add('drop-hint')});\n    sec.addEventListener('dragleave',()=>sec.classList.remove('drop-hint'));\n    sec.addEventListener('drop',e=>{e.preventDefault();sec.classList.remove('drop-hint');if(dragEl&&dragEl!==sec){let r=sec.getBoundingClientRect();sec.parentNode.insertBefore(dragEl,e.clientY<r.top+r.height/2?sec:sec.nextSibling)}});\n  });\n}\nfunction removeSection(btn){btn.closest('.canvas-section').remove()}\nfunction addSection(kind){\n  const labels={hero:'HERO',text:'文章',image:'画像',courses:'講座一覧',price:'料金',schedule:'開催日程',teacher:'講師紹介',faq:'FAQ',cta:'申込ボタン',divider:'区切り'};\n  const s=document.createElement('div');s.className='canvas-section';s.draggable=true;s.style.padding='30px';\n  s.innerHTML=`<div class=\"section-controls\"><button>↕ 移動</button><button onclick=\"removeSection(this)\">削除</button></div><h3>${labels[kind]}</h3><p style=\"font-size:10px;color:#777\">追加したセクションです。右側の編集パネルで内容を変更します。</p>`;\n  document.getElementById('canvasPage').appendChild(s);initDnD();\n}\nfunction resetToStandard(){alert('標準ページの構成に戻す想定です（確認画面を出してから実行）')}\ninitDnD();\n<\\/script>\n</body></html>\n"}, {"group": "本部", "title": "開催を作る", "filename": "academy-ui-07-event-create-v0.3.html", "status": "確認版", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-07 Event Create v0.3</title>\n<style>\n:root{\n  --pink:#f9d3d2;--yellow:#ffd370;--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;\n  --ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3;--white:#fff;\n}\n*{box-sizing:border-box}\nbody{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:var(--ink);background:var(--bg)}\nbutton,input,select,textarea{font:inherit}\nbutton{cursor:pointer}\n.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}\n.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}\n.brand{font-size:18px;font-weight:850;padding:4px 10px 20px}\n.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}\n.nav div{padding:10px 12px;border-radius:9px;margin:2px 0;color:#565860}\n.nav .on{background:var(--blue);color:#fff;font-weight:750}\n.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}\n.wrap{max-width:1120px;margin:auto;padding:26px 30px 90px}\n.back{font-size:11px;font-weight:850;color:#4f806c}\n.head{margin-top:12px;background:var(--green);padding:13px 16px;border-radius:13px 13px 0 0}\n.head .en{color:#fff;font-size:15px;font-weight:900;letter-spacing:.08em}\n.head .jp{font-size:10px;font-weight:750;mar :#666;line-height:1.5;margin:4px 0 8px}\n.kit-options{display:flex;gap:8px;flex-wrap:wrap}\n.kit-pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:800;cursor:pointer}\n.kit-pill.on{background:#eef7f2;border-color:var(--green);color:#3c725d}\n.actions{display:flex;justify-content:space-between;margin-top:18px}\n.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;font-size:10px;font-weight:850}\n.btn.primary{border:0;background:var(--orange);color:#fff}\n.summary{position:sticky;top:80px}\n.summary h3{font-size:11px;margin:0 0 9px}\n.sumrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:9px}\n.sumrow:first-of-type{border-top:0}.sumrow span:last-child{font-weight:850;text-align:right}\n.status{margin-top:12px;border-radius:10px;padding:10px;background:#fff8dc;font-size:9px;line-height:1.55}\n.ready{background:#f2faf6}\n.hide{display:none}\n@media(max-width:820px){\n  .app{display:block}.side{display:none}.top{height:54px;padding:0 14px}.wrap{padding:16px 12px 80px}\n  .layout{grid-template-columns:1fr}.choices,.grid2,.methods{grid-template-columns:1fr}.summary{position:static}\n}\n\n.assignee-type{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}\n.assignee-choice{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer}\n.assignee-choice.on{border-color:var(--green);background:#f7fcf9}\n.assignee-choice strong{display:block;font-size:10px}\n.assignee-choice p{font-size:8px;color:#777;line-height:1.45;margin:3px 0 0}\n.instructor-list{display:grid;gap:8px;margin-top:10px}\n.instructor-card{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}\n.instructor-card strong{display:block;font-size:10px}\n.instructor-card p{font-size:8px;color:#777;line-height:1.45;margin:3px 0 0}\n.instructor-card button{border:1px solid var(--green);background:#fff;color:#3c725d;border-radius:8px;padding:7px 9px;font-size:8px;font-weight:850}\n.instructor-card.selected{border-color:var(--green);background:#f7fcf9}\n.instructor-card.selected button{background:var(--green);color:#16352a}\n.request-box{margin-top:10px;background:#f4f7ff;border-radius:10px;padding:10px;font-size:9px;line-height:1.55}\n.visibility-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}\n.visibility{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer}\n.visibility.on{border-color:var(--green);background:#f7fcf9}\n.visibility strong{display:block;font-size:9px}\n.visibility p{font-size:8px;color:#777;margin:3px 0 0;line-height:1.45}\n.kit-destination{margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font-size:9px;line-height:1.5}\n@media(max-width:820px){.assignee-type,.visibility-options{grid-template-columns:1fr}}\n\n\n.preview-link{margin-top:8px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:8px 10px;font-size:9px;font-weight:850}\n.overlay{position:fixed;inset:0;background:rgba(32,33,38,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}\n.overlay.on{display:flex}\n.modal{width:min(920px,100%);max-height:90vh;overflow:auto;background:#f7f6f3;border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.22)}\n.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}\n.modal-head strong{font-size:13px}.close{border:0;background:#eee;border-radius:8px;width:30px;height:30px;font-weight:900}\n.portal{padding:18px}\n.portal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}\n.portal-top h2{margin:0;font-size:18px}.portal-top span{font-size:9px;color:#777}\n.portal-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}\n.request-status{display:inline-block;background:#fff8dc;color:#8c6a00;font-size:8px;font-weight:850;padding:5px 8px;border-radius:999px}\n.req-title{font-size:15px;margin:10px 0 5px}.req-sub{font-size:9px;color:#777;line-height:1.55}\n.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}\n.req-item{border:1px solid var(--line);border-radius:9px;padding:9px}\n.req-item b{display:block;font-size:8px;color:#4f806c;margin-bottom:3px}\n.req-item span{font-size:10px;font-weight:800}\n.hq-message{margin-top:12px;background:#f4f7ff;border-radius:10px;padding:11px;font-size:9px;line-height:1.6}\n.portal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}\n.portal-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:9px;font-weight:850}\n.portal-actions .accept{background:var(--green);border-color:var(--green);color:#17372c}\n.portal-actions .consult{background:var(--blue);border-color:var(--blue);color:#fff}\n.portal-actions .decline{color:#8a4a3d}\n.message-box{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}\n.message-box h3{font-size:11px;margin:0 0 8px}\n.thread{display:grid;gap:8px;margin-bottom:10px}\n.bubble{max-width:78%;padding:9px 10px;border-radius:10px;font-size:9px;line-height:1.5}\n.bubble.hq{background:#eef2ff}\n.bubble.teacher{background:#eef7f2;margin-left:auto}\n.msg-compose{display:grid;grid-template-columns:1fr auto;gap:8px}\n.msg-compose input{border:1px solid #ddd;border-radius:8px;padding:9px;font-size:9px}\n.msg-compose button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:9px 12px;font-size:9px;font-weight:850}\n.mail-note{margin-top:10px;background:#fff;border:1px dashed #cfd0d4;border-radius:9px;padding:9px;font-size:8px;color:#666;line-height:1.5}\n@media(max-width:700px){.req-grid{grid-template-columns:1fr}.modal{max-height:94vh}}\n\n</style>\n</head>\n<body>\n<div class=\"app\">\n<aside class=\"side\">\n  <div class=\"brand\">mikkeOS<small>Academy</small></div>\n  <div class=\"nav\">\n    <div>ホーム</div><div>講座</div><div>販売プラン</div><div class=\"on\">開催</div><div>申込</div><div>認定</div><div>講師</div><div>ページ</div><div>設定</div>\n  </div>\n</aside>\n\n<div>\n<header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>本部責任者 ▾</span></header>\n\n<main class=\"wrap\">\n<a class=\"back\">← 販売プラン「ベーシックキャンドルコース」へ</a>\n\n<div class=\"head\"><div class=\"en\">EVENT</div><div class=\"jp\">開催を追加</div></div>\n<div class=\"intro\">\n  <strong>この販売プランの受付方法と、実際の開催内容を設定します。</strong>\n  <p>販売プランでは「対面・オンラインのどちらに対応できるか」まで設定済みです。ここでは今回の受付方法・日時・担当者・定員などを決めます。</p>\n</div>\n\n<div class=\"layout\">\n<section class=\"card\">\n  <h2>どのように受け付けますか？</h2>\n  <div class=\"help\">同じ販売プランに、日時指定の開催と日程相談の受付を両方追加できます。</div>\n\n  <div class=\"planbox\">\n    <b>販売プラン</b>\n    <strong>ベーシックキャンドルコース</strong>\n    <span>先生から受講 / 対面・オンライン対応 / キットあり</span>\n  </div>\n\n  <div class=\"choices\">\n    <div class=\"choice on\" data-mode=\"fixed\">\n      <strong>日時を決めて募集する</strong>\n      <p>開催日・時間・会場などを決めて、その日程で参加者を募集します。</p>\n    </div>\n    <div class=\"choice\" data-mode=\"consult\">\n      <strong>申込後に日程を相談する</strong>\n      <p>まず申込を受け付け、申込者と相談して開催日時を決めます。</p>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h3>開催方法</h3>\n    <div class=\"methods\">\n      <div class=\"method on\" data-method=\"offline\"><strong>対面</strong><p>会場で開催します。</p></div>\n      <div class=\"method\" data-method=\"online\"><strong>オンライン</strong><p>Zoomなどで開催します。</p></div>\n    </div>\n  </div>\n\n  <div id=\"fixedFields\">\n    <div class=\"section\">\n      <h3>日時</h3>\n      <div class=\"grid2\">\n        <div class=\"field\"><label>開催日</label><input type=\"date\" value=\"2026-10-10\"></div>\n        <div class=\"field\"><label>開始時間</label><input type=\"time\" value=\"13:00\"></div>\n        <div class=\"field\"><label>終了時間</label><input type=\"time\" value=\"15:00\"></div>\n        <div class=\"field\"><label>定員</label><input type=\"number\" value=\"6\"></div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h3>担当者</h3>\n    <div class=\"help\">本部開催、外部講師、認定講師から選びます。認定講師は、この販売プランを担当できる人だけ表示します。</div>\n\n    <div class=\"assignee-type\">\n      <div class=\"assignee-choice on\" data-assignee=\"hq\"><strong>本部</strong><p>本部スタッフが担当します。</p></div>\n      <div class=\"assignee-choice\" data-assignee=\"external\"><strong>外部講師</strong><p>通常の外部講師へ依頼します。</p></div>\n      <div class=\"assignee-choice\" data-assignee=\"certified\"><strong>認定講師</strong><p>この販売プランを担当できる認定講師へ依頼します。</p></div>\n    </div>\n\n    <div id=\"hqAssignee\" style=\"margin-top:10px\">\n      <div class=\"field\"><label>担当する人</label><select><option>野田 あゆみ（本部）</option><option>本部スタッフA</option></select></div>\n    </div>\n\n    <div id=\"externalAssignee\" class=\"hide\" style=\"margin-top:10px\">\n      <div class=\"field\"><label>外部講師</label><select><option>外部講師を選択</option><option>佐藤 まい</option><option>高橋 りえ</option></select></div>\n    </div>\n\n    <div id=\"certifiedAssignee\" class=\"hide\" style=\"margin-top:10px\">\n      <div class=\"help\">対象の講師ライセンス・契約・活動状態を確認し、担当可能な認定講師だけ表示します。</div>\n      <div class=\"instructor-list\">\n        <div class=\"instructor-card\" data-name=\"山田 花子\"><div><strong>山田 花子</strong><p>対面：杉並区・中野区 / オンライン可<br>販売プラン担当可・申込受付中</p></div><button type=\"button\">担当を依頼</button></div>\n        <div class=\"instructor-card\" data-name=\"佐々木 由美\"><div><strong>佐々木 由美</strong><p>対面：武蔵野市 / オンライン可<br>販売プラン担当可・申込受付中</p></div><button type=\"button\">担当を依頼</button></div>\n      </div>\n      <div class=\"request-box\" id=\"requestBox\"><b>担当依頼の流れ</b><br>講師マイページへ依頼を送り、講師は「承諾・相談・辞退」で回答します。<br><b>申込者との日程調整は本部が行います。</b></div>\n      <button type=\"button\" class=\"preview-link\" onclick=\"openPreview()\">講師側の依頼画面をプレビュー →</button>\n    </div>\n  </div>\n\n  <div id=\"offlineFields\" class=\"section\">\n    <h3>会場</h3>\n    <div class=\"grid2\">\n      <div class=\"field\"><label>会場名</label><input value=\"灯りのアトリエ 荻窪教室\"></div>\n      <div class=\"field\"><label>詳しい住所（管理用）</label><input value=\"東京都杉並区○○1-2-3\"></div>\n    </div>\n\n    <div style=\"margin-top:10px;font-size:9px;font-weight:850\">販売ページではどこまで見せますか？</div>\n    <div class=\"visibility-options\">\n      <div class=\"visibility on\" data-visibility=\"full\"><strong>詳しい住所まで公開</strong><p>申込前から会場住所を表示します。</p></div>\n      <div class=\"visibility\" data-visibility=\"area\"><strong>エリアだけ公開</strong><p>例：東京都杉並区。詳しい場所は申込後に案内します。</p></div>\n    </div>\n\n    <div class=\"field\" style=\"margin-top:10px\"><label>販売ページに表示するエリア</label><input id=\"publicArea\" value=\"東京都杉並区\"></div>\n    <div class=\"field\" style=\"margin-top:10px\"><label>参加者への案内</label><textarea>開始10分前からご入室いただけます。</textarea></div>\n  </div>\n\n  <div id=\"onlineFields\" class=\"section hide\">\n    <h3>オンライン参加</h3>\n    <div class=\"field\"><label>参加URL</label><input placeholder=\"https://zoom.us/...\"></div>\n    <div class=\"field\" style=\"margin-top:10px\"><label>参加者への案内</label><textarea>開始5分前からZoomへお入りください。</textarea></div>\n  </div>\n\n  <div id=\"consultFields\" class=\"section hide\">\n    <h3>日程相談の案内</h3>\n    <div class=\"field\"><label>申込者へ表示する案内</label><textarea>お申込み後、担当者より日程調整のご連絡をいたします。</textarea></div>\n    <div class=\"field\" style=\"margin-top:10px\"><label>対応エリア・補足</label><input value=\"対面の場合：杉並区周辺\"></div>\n  </div>\n\n  <div class=\"section\">\n    <h3>キットの受け渡し</h3>\n    <div class=\"kit\">\n      <strong>キャンドル制作キット</strong>\n      <p id=\"kitHelp\">販売プランでは「事前発送」「会場で手渡し」の両方が許可されています。この開催ではどちらにしますか？</p>\n      <div class=\"kit-options\" id=\"kitOptions\">\n        <div class=\"kit-pill on\" data-kit=\"hand\">会場で手渡し</div>\n        <div class=\"kit-pill\" data-kit=\"ship\">事前に発送</div>\n      </div>\n      <div class=\"kit-destination hide\" id=\"instructorKitBox\">\n        <b>認定講師担当の対面開催</b><br>\n        キットは受講者ではなく、<b>担当講師の指定キット受取住所</b>へ本部から発送します。<br>\n        <span id=\"kitInstructorName\">担当講師未選択</span> / 登録済み住所を使用\n      </div>\n    </div>\n  </div>\n\n  <div class=\"section\">\n    <h3>受付状態</h3>\n    <div class=\"field\">\n      <select>\n        <option>下書き</option>\n        <option>受付準備中</option>\n        <option>受付中</option>\n        <option>受付終了</option>\n      </select>\n    </div>\n  </div>\n\n  <div class=\"actions\">\n    <button class=\"btn\">← 戻る</button>\n    <button class=\"btn primary\">開催を保存</button>\n  </div>\n</section>\n\n<aside class=\"card summary\">\n  <h3>この開催の内容</h3>\n  <div class=\"sumrow\"><span>販売プラン</span><span>ベーシックキャンドルコース</span></div>\n  <div class=\"sumrow\"><span>受付方法</span><span id=\"sumMode\">日時を決めて募集</span></div>\n  <div class=\"sumrow\"><span>開催方法</span><span id=\"sumMethod\">対面</span></div>\n  <div class=\"sumrow\"><span>日時</span><span id=\"sumDate\">10/10 13:00〜15:00</span></div>\n  <div class=\"sumrow\"><span>担当</span><span id=\"sumAssignee\">野田 あゆみ（本部）</span></div>\n  <div class=\"sumrow\"><span>定員</span><span id=\"sumCapacity\">6名</span></div>\n  <div class=\"sumrow\"><span>会場公開</span><span id=\"sumVenue\">詳しい住所まで公開</span></div><div class=\"sumrow\"><span>キット</span><span id=\"sumKit\">会場で手渡し</span></div>\n  <div class=\"status ready\" id=\"summaryStatus\"><b>保存できます。</b><br>保存後、この開催が販売ページの「開催日程」に表示されます。</div>\n</aside>\n</div>\n</main>\n</div>\n</div>\n\n\n<div class=\"overlay\" id=\"requestPreview\">\n  <div class=\"modal\">\n    <div class=\"modal-head\">\n      <strong>講師マイページ｜担当依頼プレビュー</strong>\n      <button class=\"close\" onclick=\"closePreview()\">×</button>\n    </div>\n    <div class=\"portal\">\n      <div class=\"portal-top\">\n        <h2>担当依頼</h2>\n        <span>山田 花子さんの講師マイページ</span>\n      </div>\n\n      <div class=\"portal-card\">\n        <span class=\"request-status\">回答待ち</span>\n        <div class=\"req-title\">ベーシックキャンドルコース</div>\n        <div class=\"req-sub\">灯りのアトリエ本部から、講座担当の依頼が届いています。</div>\n\n        <div class=\"req-grid\">\n          <div class=\"req-item\"><b>開催方法</b><span>対面</span></div>\n          <div class=\"req-item\"><b>エリア</b><span>東京都杉並区</span></div>\n          <div class=\"req-item\"><b>予定日時</b><span>10月10日 13:00〜15:00</span></div>\n          <div class=\"req-item\"><b>定員</b><span>6名</span></div>\n          <div class=\"req-item\"><b>キット</b><span>本部から講師住所へ発送</span></div>\n          <div class=\"req-item\"><b>申込者との日程調整</b><span>本部が対応</span></div>\n        </div>\n\n        <div class=\"hq-message\">\n          <b>本部からのメッセージ</b><br>\n          10月10日のベーシックキャンドルコースをお願いしたいです。  \n          申込者との連絡・日程調整は本部で行います。ご都合をご確認ください。\n        </div>\n\n        <div class=\"portal-actions\">\n          <button class=\"accept\">承諾する</button>\n          <button class=\"consult\" onclick=\"document.getElementById('messageArea').scrollIntoView({behavior:'smooth'})\">相談する</button>\n          <button class=\"decline\">辞退する</button>\n        </div>\n\n        <div class=\"mail-note\">\n          この担当依頼は講師マイページに表示され、同時に登録メールアドレスへも通知されます。  \n          メールには依頼概要と「講師マイページで確認する」リンクを掲載する想定です。\n        </div>\n      </div>\n\n      <div class=\"message-box\" id=\"messageArea\">\n        <h3>本部メッセージ</h3>\n        <div class=\"thread\">\n          <div class=\"bubble hq\"><b>本部</b><br>10/10の開催をお願いできますか？キットはこちらから発送します。</div>\n          <div class=\"bubble teacher\"><b>山田 花子</b><br>ありがとうございます。13時開始で大丈夫です。会場について少し確認したいです。</div>\n          <div class=\"bubble hq\"><b>本部</b><br>ありがとうございます。会場は杉並区内を予定しています。詳細決まり次第こちらで共有します。</div>\n        </div>\n        <div class=\"msg-compose\">\n          <input placeholder=\"本部へメッセージを送る\">\n          <button>送信</button>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n\n<script>\nconst choices=[...document.querySelectorAll('.choice')];\nconst methods=[...document.querySelectorAll('.method')];\nconst kitPills=[...document.querySelectorAll('.kit-pill')];\nconst assigneeChoices=[...document.querySelectorAll('.assignee-choice')];\nconst visChoices=[...document.querySelectorAll('.visibility')];\nlet assigneeType='hq';\nlet selectedInstructor='';\n\nchoices.forEach(c=>c.onclick=()=>{\n  choices.forEach(x=>x.classList.remove('on'));c.classList.add('on');\n  const fixed=c.dataset.mode==='fixed';\n  document.getElementById('fixedFields').classList.toggle('hide',!fixed);\n  document.getElementById('consultFields').classList.toggle('hide',fixed);\n  document.getElementById('sumMode').textContent=fixed?'日時を決めて募集':'申込後に日程相談';\n  document.getElementById('sumDate').textContent=fixed?'10/10 13:00〜15:00':'申込後に相談';\n  document.getElementById('sumCapacity').textContent=fixed?'6名':'相談受付';\n});\n\nmethods.forEach(m=>m.onclick=()=>{\n  methods.forEach(x=>x.classList.remove('on'));m.classList.add('on');\n  const offline=m.dataset.method==='offline';\n  document.getElementById('offlineFields').classList.toggle('hide',!offline);\n  document.getElementById('onlineFields').classList.toggle('hide',offline);\n  document.getElementById('sumMethod').textContent=offline?'対面':'オンライン';\n  refreshKitRule();\n});\n\nassigneeChoices.forEach(a=>a.onclick=()=>{\n  assigneeChoices.forEach(x=>x.classList.remove('on'));a.classList.add('on');\n  assigneeType=a.dataset.assignee;\n  document.getElementById('hqAssignee').classList.toggle('hide',assigneeType!=='hq');\n  document.getElementById('externalAssignee').classList.toggle('hide',assigneeType!=='external');\n  document.getElementById('certifiedAssignee').classList.toggle('hide',assigneeType!=='certified');\n  document.getElementById('sumAssignee').textContent=assigneeType==='hq'?'野田 あゆみ（本部）':assigneeType==='external'?'外部講師を選択':'認定講師を選択';\n  refreshKitRule();\n});\n\ndocument.querySelectorAll('.instructor-card button').forEach(btn=>btn.onclick=()=>{\n  document.querySelectorAll('.instructor-card').forEach(x=>x.classList.remove('selected'));\n  const card=btn.closest('.instructor-card');\n  card.classList.add('selected');\n  selectedInstructor=card.dataset.name;\n  document.getElementById('sumAssignee').textContent=selectedInstructor+'（認定講師・依頼中）';\n  document.getElementById('kitInstructorName').textContent=selectedInstructor;\n  refreshKitRule();\n});\n\nvisChoices.forEach(v=>v.onclick=()=>{\n  visChoices.forEach(x=>x.classList.remove('on'));v.classList.add('on');\n  document.getElementById('sumVenue').textContent=v.dataset.visibility==='full'?'詳しい住所まで公開':'エリアのみ公開';\n});\n\nkitPills.forEach(k=>k.onclick=()=>{\n  if(k.closest('#kitOptions').classList.contains('hide')) return;\n  kitPills.forEach(x=>x.classList.remove('on'));k.classList.add('on');\n  document.getElementById('sumKit').textContent=k.dataset.kit==='ship'?'受講者へ事前発送':'会場で手渡し';\n});\n\nfunction refreshKitRule(){\n  const offline=document.querySelector('.method.on')?.dataset.method==='offline';\n  const certified=assigneeType==='certified';\n  const box=document.getElementById('instructorKitBox');\n  const opts=document.getElementById('kitOptions');\n  const help=document.getElementById('kitHelp');\n\n  if(offline && certified){\n    box.classList.remove('hide');\n    opts.classList.add('hide');\n    help.textContent='認定講師が担当する対面開催では、本部から担当講師の指定住所へキットを発送します。';\n    document.getElementById('sumKit').textContent=selectedInstructor?selectedInstructor+'へ発送':'担当認定講師へ発送';\n  }else{\n    box.classList.add('hide');\n    opts.classList.remove('hide');\n    help.textContent='販売プランでは「事前発送」「会場で手渡し」の両方が許可されています。この開催ではどちらにしますか？';\n    if(!offline){\n      kitPills.forEach(x=>x.classList.remove('on'));\n      document.querySelector('[data-kit=\"ship\"]').classList.add('on');\n      document.getElementById('sumKit').textContent='受講者へ事前発送';\n    }else{\n      document.getElementById('sumKit').textContent=document.querySelector('.kit-pill.on')?.dataset.kit==='ship'?'受講者へ事前発送':'会場で手渡し';\n    }\n  }\n}\n\nfunction openPreview(){document.getElementById('requestPreview').classList.add('on')}\nfunction closePreview(){document.getElementById('requestPreview').classList.remove('on')}\ndocument.getElementById('requestPreview').addEventListener('click',e=>{if(e.target.id==='requestPreview')closePreview()});\n<\\/script>\n</body>\n</html>"}, {"group": "本部", "title": "開催一覧", "filename": "academy-ui-09-events-list-v0.8.html", "status": "LOCK", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-09 Events List v0.8</title>\n<style>\n:root{--pink:#f9d3d2;--yellow:#ffd370;--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;--ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3}\n*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:var(--ink);background:var(--bg)}\nbutton,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}\n.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}\n.brand{font-size:18px;font-weight:850;padding:4px 10px 20px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}\n.nav div{padding:10px 12px;border-radius:9px;margin:2px 0;color:#565860}.nav .on{background:var(--blue);color:#fff;font-weight:750}\n.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}\n.wrap{max-width:1100px;margin:auto;padding:30px 30px 80px}\n.hero-title{background:var(--green);padding:12px 16px 10px;border-radius:13px 13px 0 0}.hero-title .en{color:#fff;font-size:15px;font-weight:900;letter-spacing:.08em}.hero-title .jp{color:#202126;font-size:10px;font-weight:750;margin-top:4px}\n.hero-body{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:18px}\n.hero-body p{margin:0;color:var(--muted);line-height:1.65}.primary{background:var(--orange);color:#fff;border:0;b lter\">開催確定</button>\n    <button class=\"filter\">本日</button>\n    <button class=\"filter\">終了</button>\n  </div>\n\n  <div class=\"event-list\">\n    <div class=\"event-card\" onclick=\"openDetail()\">\n      <div class=\"event-icon\" style=\"background-image:url('https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=160&q=70')\"></div>\n      <div class=\"event-main\">\n        <strong>ベーシックキャンドルコース</strong>\n        <div class=\"meta\">\n          <span>田中 美咲</span><span>希望日 10/12・14・18</span><span>担当 未確定</span><span class=\"status yellow\">日程相談中</span>\n        </div>\n      </div><div class=\"chev\">›</div>\n    </div>\n\n    <div class=\"event-card\">\n      <div class=\"event-icon\" style=\"background-image:url('https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=160&q=70')\"></div>\n      <div class=\"event-main\">\n        <strong>ベーシックキャンドルコース</strong>\n        <div class=\"meta\">\n          <span>10/10 13:00</span><span>対面・杉並区</span><span>4 / 6名</span><span>担当 野田 あゆみ</span><span class=\"status green\">開催確定</span>\n        </div>\n      </div><div class=\"chev\">›</div>\n    </div>\n\n    <div class=\"event-card\">\n      <div class=\"event-icon\" style=\"background-image:url('https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=160&q=70')\"></div>\n      <div class=\"event-main\">\n        <strong>ベーシックキャンドルコース</strong>\n        <div class=\"meta\">\n          <span>10/20 10:00</span><span>オンライン</span><span>3 / 8名</span><span>担当 山田 花子</span><span class=\"status blue\">講師回答待ち</span>\n        </div>\n      </div><div class=\"chev\">›</div>\n    </div>\n\n    <div class=\"event-card\">\n      <div class=\"event-icon\" style=\"background-image:url('https://images.unsplash.com/photo-1608181831718-c9ffd66e3e29?auto=format&fit=crop&w=160&q=70')\"></div>\n      <div class=\"event-main\">\n        <strong>キャンドル体験ワークショップ</strong>\n        <div class=\"meta\">\n          <span>9/30 11:00</span><span>対面・荻窪</span><span>5 / 6名</span><span>担当 本部</span><span class=\"status orange\">本日</span>\n        </div>\n      </div><div class=\"chev\">›</div>\n    </div>\n  </div>\n</section>\n\n<section class=\"detail\" id=\"detailView\">\n  <a class=\"back\" onclick=\"backList()\">← 開催一覧へ</a>\n\n  <div class=\"detail-grid\">\n    <div>\n      <div class=\"card\">\n        <div class=\"header-info\">\n          <div><strong>ベーシックキャンドルコース</strong><p>受付方法：申込後に日程相談<br>受講方法：対面</p></div>\n          <span class=\"badge yellow\">日程相談中</span>\n        </div>\n        <div class=\"status-line\"><span class=\"badge gray\">受講者1名</span><span class=\"badge yellow\">講師未確定</span><span class=\"badge yellow\">日時未確定</span></div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>受講者</h3>\n        <div class=\"people\">\n          <div class=\"person\">\n            <div><strong>田中 美咲</strong><p>希望日：10/12午後・10/14午後・10/18<br>希望エリア：東京都杉並区</p></div>\n            <span class=\"badge yellow\">日程調整中</span>\n          </div>\n        </div>\n\n        <div class=\"section\">\n          <h3>希望日</h3>\n          <div class=\"rows\">\n            <div class=\"row\"><b>第1希望</b><span>10/12 午後</span></div>\n            <div class=\"row\"><b>第2希望</b><span>10/14 午後</span></div>\n            <div class=\"row\"><b>第3希望</b><span>10/18 指定なし</span></div>\n            <div class=\"row\"><b>補足</b><span>平日は14時以降、土日は終日可能</span></div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>担当講師</h3>\n        <div class=\"notice\"><b>まだ担当講師は決まっていません。</b><br>受講者の希望日を確認してから、この販売プランを担当できる認定講師へ依頼できます。</div>\n        <div class=\"actions\" style=\"margin-top:10px\"><button class=\"btn\">対応できる講師を探す</button></div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>日程・会場</h3>\n        <div class=\"rows\">\n          <div class=\"row\"><b>開催日</b><span>未確定</span></div>\n          < n<body>\n<div class=\"app\">\n<aside class=\"side\"><div class=\"brand\">mikkeOS<small>Academy</small></div><div class=\"nav\"><div>ホーム</div><div>講座</div><div>販売プラン</div><div>開催</div><div>申込</div><div class=\"on\">認定</div><div>講師</div><div>ページ</div><div>設定</div></div></aside>\n<div><header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>本部責任者 ▾</span></header>\n<main class=\"wrap\">\n\n<section class=\"list-panel\" id=\"listPanel\">\n  <div class=\"titlebar\"><div class=\"en\">COMPLETION</div><div class=\"jp\">受講・修了</div></div>\n  <div class=\"headbox\">\n    <p>開催後の出欠・受講完了・修了・証書・認定を、受講者ごとに確認します。</p>\n    <button class=\"create\">修了待ちを確認</button>\n  </div>\n\n  <div class=\"guide\"><b>開催</b><span>→</span><b>受講・修了</b><span>→</span><b>証書</b><span>→</span><b>認定</b></div>\n\n  <div class=\"card\" style=\"margin-top:18px\">\n    <h2>ベーシックキャンドルコース</h2>\n    <div class=\"help\">10/10 13:00〜15:00 / 対面 / 開催終了</div>\n\n    <div class=\"people\">\n      <div class=\"person\" onclick=\"openDetail()\">\n        <div class=\"avatar\">田</div>\n        <div><strong>田中 美咲</strong><div class=\"person-meta\"><span>出席</span><span>受講完了</span><span>認定証・デュプロマ</span></div></div>\n        <span class=\"badge yellow\">認定確認待ち</span>\n      </div>\n\n      <div class=\"person\">\n        <div class=\"avatar\">鈴</div>\n        <div><strong>鈴木 里奈</strong><div class=\"person-meta\"><span>出席</span><span>受講完了</span><span>認定証・デュプロマ</span></div></div>\n        <span class=\"badge green\">認定済み</span>\n      </div>\n\n      <div class=\"person\">\n        <div class=\"avatar\">佐</div>\n        <div><strong>佐藤 真由</strong><div class=\"person-meta\"><span>出席</span><span>教材確認待ち</span></div></div>\n        <span class=\"badge blue\">受講中</span>\n      </div>\n\n      <div class=\"person\">\n        <div class=\"avatar\">高</div>\n        <div><strong>高橋 ゆか</strong><div class=\"person-meta\"><span>欠席</span><span>振替未設定</span></div></div>\n        <span class=\"badge gray\">未完了</span>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"detail-panel\" id=\"detailPanel\">\n  <a class=\"back\" onclick=\"backList()\">← 受講・修了一覧へ</a>\n\n  <div class=\"titlebar\"><div class=\"en\">LEARNER</div><div class=\"jp\">受講者詳細</div></div>\n  <div class=\"headbox\">\n    <p>田中 美咲さんの受講・修了・証書・認定の状態を確認します。</p>\n    <button class=\"create\" onclick=\"openLearnerPreview()\">受講者ページをプレビュー</button>\n  </div>\n\n  <div class=\"detail-grid\">\n    <div>\n      <div class=\"card\">\n        <h2>田中 美咲</h2>\n        <div class=\"help\">ベーシックキャンドルコース / 10月10日開催</div>\n\n        <div class=\"section\">\n          <h3>受講状況</h3>\n          <div class=\"rows\">\n            <div class=\"row\"><b>出欠</b><span>出席</span></div>\n            <div class=\"row\"><b>受講完了</b><span>完了</span></div>\n            <div class=\"row\"><b>支払い</b><span>確認済み ¥18,000</span></div>\n            <div class=\"row\"><b>担当講師</b><span>山田 花子</span></div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>受講後の処理</h3>\n        <div class=\"help\">この販売プランで設定されている項目だけ表示します。</div>\n\n        <div class=\"step-list\">\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>1. 修了として記録する</strong><p>受講と必要な完了条件を確認して修了を記録します。</p></div><span class=\"badge green\">完了</span></div>\n          </div>\n\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>2. 証書</strong><p>認定証・デュプロマ / 現物。発行・発送のタイミングは本部運用に合わせて記録します。</p></div><span class=\"badge yellow\">状態確認</span></div>\n            <div class=\"cert-box\">\n              <b>証書記載名</b>\n              <p>MI SAKI TANAKA</p>\n            </div>\n\n            <div class=\"cert-status\">\n              <label class=\"cert-check\">\n                <input type=\"checkbox\" checked>\n                <div><strong>発行済み</strong><p>証書を作成済みの場合にチェックします。</p></div>\n              </label>\n              <label class=\"cert-check\">\n                <input type=\"checkbox\" checked>\n                <div><strong>発送済み</strong><p>キット同封など、すでに発送済みの場合にチェックします。</p></div>\n              </label>\n            </div>\n\n            <div class=\"cert-meta\">\n              <label>発行日<input type=\"date\" value=\"2026-10-01\"></label>\n              <label>発送日<input type=\"date\" value=\"2026-10-03\"></label>\n            </div>\n            <div class=\"actions\"><button class=\"btn\">証書情報を見る</button></div>\n          </div>\n\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>3. スキル認定する</strong><p>この講座で学んだ技術・知識の習得を本部が確認します。</p></div><span class=\"badge yellow\">確認待ち</span></div>\n            <div class=\"actions\"><button class=\"btn green\">認定する</button></div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>認定後</h3>\n        <div class=\"notice blue\"><b>この販売プランには講師ライセンス設定はありません。</b><br>認定後は認定者として記録され、講師登録・講師契約には進みません。</div>\n      </div>\n    </div>\n\n    <aside class=\"card todo\">\n      <h2>次にやること</h2>\n      <div class=\"help\">田中 美咲さんに必要な処理だけを表示します。</div>\n\n      <div class=\"todo-item\">\n        <b>証書の状態</b>\n        <p>発行済み・発送済みを確認します。</p>\n        <button class=\"btn\">証書情報を見る</button>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>スキル認定</b>\n        <p>本部確認後に認定を確定します。</p>\n        <button class=\"btn green\">認定する</button>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>通知</b>\n        <p>認定確定後、受講者へ認定完了メールを送ります。</p>\n        <button class=\"btn\">メール内容を見る</button>\n      </div>\n    </aside>\n  </div>\n</section>\n\n</main></div></div>\n\n<script>\nfunction openDetail(){document.getElementById('listPanel').classList.add('hide');document.getElementById('detailPanel').classList.add('on');window.scrollTo(0,0)}\nfunction backList(){document.getElementById('listPanel').classList.remove('hide');document.getElementById('detailPanel').classList.remove('on');window.scrollTo(0,0)}\n\nfunction openLearnerPreview(){document.getElementById('learnerPreview').classList.add('on')}\nfunction closeLearnerPreview(){document.getElementById('learnerPreview').classList.remove('on')}\ndocument.getElementById('learnerPreview')?.addEventListener('click',e=>{if(e.target.id==='learnerPreview')closeLearnerPreview()});\n<\\/script>\n\n<div class=\"preview-overlay\" id=\"learnerPreview\">\n  <div class=\"preview-modal\">\n    <div class=\"preview-head\">\n      <strong>受講者ページ プレビュー｜田中 美咲</strong>\n      <button class=\"preview-close\" onclick=\"closeLearnerPreview()\">×</button>\n    </div>\n    <div class=\"learner-page\">\n      <div class=\"learner-shell\">\n        <div class=\"learner-top\">\n          <h2>ベーシックキャンドルコース</h2>\n          <p>灯りのアトリエ キャンドル教室</p>\n        </div>\n        <div class=\"learner-grid\">\n          <div class=\"learner-card\">\n            <h3>あなたの受講状況</h3>\n            <div class=\"lesson-row\"><b>01 キャンドル基礎</b><br><span class=\"learner-badge\">修了</span></div>\n            <div class=\"lesson-row\"><b>02 制作実技</b><br><span class=\"learner-badge\">修了</span></div>\n            <div class=\"lesson-row\"><b>03 応用デザイン</b><br><span class=\"learner-badge\">修了</span></div>\n          </div>\n          <div class=\"learner-card\">\n            <h3>修了・認定</h3>\n            <div class=\"lesson-row\"><b>コース修了</b><br>修了として記録されています。</div>\n            <div class=\"lesson-row\"><b>スキル認定</b><br>本部確認待ち</div>\n            <div class=\"lesson-row\"><b>証書</b><br>認定証・デュプロマ：発送済み</div>\n          </div>\n          <div class=\"learner-card\">\n            <h3>レッスン教材</h3>\n            <div class=\"lesson-row\">復習教材を見る →</div>\n            <div class=\"lesson-row\">PDF資料を見る →</div>\n          </div>\n          <div class=\"learner-card\">\n            <h3>お知らせ</h3>\n            <div class=\"lesson-row\">認定が確定すると、こちらに認定情報が表示されます。</div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n\n</body>\n</html>"}, {"group": "本部", "title": "講師登録", "filename": "academy-ui-12-instru
