</div><div class=\"nav\"><div>ホーム</div><div>講座</div><div>販売プラン</div><div>開催</div><div>申込</div><div>認定</div><div class=\"on\">講師</div><div>ページ</div><div>設定</div></div></aside>\n<div><header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>本部責任者 ▾</span></header>\n<main class=\"wrap\">\n\n<section class=\"list-panel\" id=\"listPanel\">\n  <div class=\"titlebar\"><div class=\"en\">INSTRUCTORS</div><div class=\"jp\">講師</div></div>\n  <div class=\"headbox\">\n    <p>認定済みの方から講師活動の希望が届いたら、登録・契約・ライセンスの手続きを進めます。</p>\n    <button class=\"create\">＋ 既存講師を登録</button>\n  </div>\n\n  <div class=\"guide\"><b>認定済み</b><span>→</span><b>講師活動希望</b><span>→</span><b>講師登録</b><span>→</span><b>認定講師</b></div>\n\n  <div class=\"tools\"><input class=\"search\" placeholder=\"名前・講師番号で検索\"><button class=\"filter\">並び替え ▾</button></div>\n\n  <section class=\"list\">\n    <div class=\"person-row\" onclick=\"openDetail()\">\n      <div class=\"avatar\">田</div>\n      <div><h3>田中 美咲</h3><div class=\"meta\"><span><b>スキル認定済み</b></span><span>ベーシックキャンドルコース</span><span class=\"badge yellow\">講師活動希望</span></div></div>\n      <span class=\"arrow\">›</span>\n    </div>\n\n    <div class=\"person-row\">\n      <div class=\"avatar\">鈴</div>\n      <div><h3>鈴木 里奈</h3><div class=\"meta\"><span><b>認定講師</b></span><span>講師番号 L-0012</span><span class=\"badge green\">活動中</span></div></div>\n      <span class=\"arrow\">›</span>\n    </div>\n\n    <div class=\"person-row\">\n      <div class=\"avatar\">佐</div>\n      <div><h3>佐藤 真由</h3><div class=\"meta\"><span><b>講師登録中</b></span><span>契約同意待ち</span><span class=\"badge blue\">手続き中</span></div></div>\n      <span class=\"arrow\">›</span>\n    </div>\n  </section>\n</section>\n\n<section class=\"detail-panel\" id=\"detailPanel\">\n  <a class=\"back\" onclick=\"backList()\">← 講師一覧へ</a>\n\n  <div class=\"titlebar\"><div class=\"en\">INSTRUCTOR REGISTRATION</div><div class=\"jp\">講師登録</div></div>\n  <div class=\"headbox\">\n    <p>田中 美咲さんから講師活動の希望が届いています。必要な手続きだけ順番に確認します。</p>\n    <button class=\"create\">本人情報を見る</button>\n  </div>\n\n  <div class=\"detail-grid\">\n    <div>\n      <div class=\"card\">\n        <h2>田中 美咲</h2>\n        <div class=\"help\">スキル認定済み / ベーシックキャンドルコース</div>\n\n        <div class=\"section\">\n          <h3>講師活動希望</h3>\n          <div class=\"rows\">\n            <div class=\"row\"><b>希望受付日</b><span>2026/09/25</span></div>\n            <div class=\"row\"><b>希望する活動</b><span>本部認定講座の講師として活動したい</span></div>\n            <div class=\"row\"><b>対応方法</b><span>対面・オンライン</span></div>\n            <div class=\"row\"><b>対面希望地域</b><span>東京都杉並区・中野区</span></div>\n          </div>\n          <div class=\"notice blue\" style=\"margin-top:10px\"><b>認定しただけでは講師登録されません。</b><br>本人から講師活動希望が届いたため、この登録フローが表示されています。</div>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>講師登録の手続き</h3>\n        <div class=\"help\">この販売プランで設定されている項目だけ表示します。</div>\n\n        <div class=\"step-list\">\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>1. 講師登録を確認</strong><p>本人情報・認定状態・活動希望を確認します。</p></div><span class=\"badge green\">確認済み</span></div>\n          </div>\n\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>2. 登録料</strong><p>この制度では講師登録料があります。</p></div><span class=\"badge yellow\">未確認</span></div>\n            <div class=\"fee-box\"><strong>¥10,000</strong><p>銀行振込 / カード決済 / 外部決済サービス</p></div>\n            <div class=\"actions\"><button class=\"btn\">支払い案内を送る</button><button class=\"btn orange\">支払い済みにする</button></div>\n          </div>\n\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>3. 講師契約</strong><p>講師契約書を本人へ提示し、同意を記録します。</p></div><span class=\"badge yellow\">未同意</span></div>\n            <div class=\"actions\"><button class=\"btn primary\">契約書を送る</button><button class=\"btn\">契約内容を確認</button></div>\n          </div>\n\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>4. 講師ライセンス</strong><p>対象販売プランを本部ルールに従って販売・開催できる権利です。</p></div><span class=\"badge gray\">条件待ち</span></div>\n            <label class=\"checkline\"><input type=\"checkbox\"><span>登録料・契約同意など必要条件を確認後、講師ライセンスを有効にする</span></label>\n          </div>\n\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>5. 会費</strong><p>この制度では年額会費を継続条件として設定しています。</p></div><span class=\"badge gray\">未開始</span></div>\n            <div class=\"fee-box\"><strong>¥12,000 / 年</strong><p>講師ライセンスの継続条件</p></div>\n          </div>\n\n          <div class=\"step\">\n            <div class=\"step-head\"><div><strong>6. 講師ページ準備</strong><p>講師マニュアル、講師営業ページ、申込受付などを設定します。</p></div><span class=\"badge gray\">準備前</span></div>\n            <div class=\"actions\"><button class=\"btn\">講師ページをプレビュー</button></div>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <aside class=\"card todo\">\n      <h2>次にやること</h2>\n      <div class=\"help\">田中 美咲さんの登録で必要な操作だけ表示します。</div>\n\n      <div class=\"todo-item\">\n        <b>登録料の案内</b>\n        <p>講師登録料 ¥10,000 の案内を送ります。</p>\n        <button class=\"btn orange\">支払い案内</button>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>講師契約</b>\n        <p>本人へ契約内容を提示し、同意を取得します。</p>\n        <button class=\"btn primary\">契約書を送る</button>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>ライセンス有効化</b>\n        <p>必要条件が揃った後に有効化します。</p>\n        <button class=\"btn\">条件を確認</button>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>登録完了後</b>\n        <p>講師番号・講師ページ・マニュアル等を利用できるようにします。</p>\n        <button class=\"btn\">まだ操作できません</button>\n      </div>\n    </aside>\n  </div>\n</section>\n\n</main></div></div>\n\n<script>\nfunction openDetail(){document.getElementById('listPanel').classList.add('hide');document.getElementById('detailPanel').classList.add('on');window.scrollTo(0,0)}\nfunction backList(){document.getElementById('listPanel').classList.remove('hide');document.getElementById('detailPanel').cla lass=\"toggle-row\">\n            <div><strong>新規申込を受付</strong><p>講師本人が新しい申込を受け付ける設定にしています。</p></div>\n            <div class=\"status-value\"><span class=\"status-dot on\"></span>ON</div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>講師向け機能</h3>\n\n        <div class=\"linkbox\">\n          <div><strong>講師マニュアル</strong><p>対象講座の指導・運営資料</p></div>\n          <span class=\"badge green\">利用可</span>\n        </div>\n\n        <div class=\"linkbox\">\n          <div><strong>講師営業ページ</strong><p>本部公式情報＋本人のプロフィール・補足情報</p></div>\n          <button class=\"btn\">編集・確認</button>\n        </div>\n\n        <div class=\"linkbox\">\n          <div><strong>Community</strong><p>販売プランの講師ライセンス設定に基づく連携</p></div>\n          <span class=\"badge green\">利用中</span>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>制度設定</h3>\n        <div class=\"notice blue\">\n          Community必須・本部HP掲載可否などは、販売プランの講師ライセンス設定を参照します。個々の講師ごとに制度そのものを作り直しません。\n        </div>\n        <div class=\"actions\"><button class=\"btn\">販売プランの講師設定を見る</button></div>\n      </div>\n    </div>\n\n    <aside class=\"card todo\">\n      <h2>現在の状態</h2>\n\n      <div class=\"todo-item\">\n        <b>講師ライセンス</b>\n        <p>有効です。</p>\n        <span class=\"badge green\">有効</span>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>講師契約</b>\n        <p>契約中 / 更新期限 2027/09/30</p>\n        <button class=\"btn\">契約を見る</button>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>HP掲載</b>\n        <p>現在掲載中です。</p>\n        <button class=\"btn\">掲載ページを見る</button>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>申込受付</b>\n        <p>新規申込を受付中です。</p>\n        <button class=\"btn\">営業ページを見る</button>\n      </div>\n\n      <div class=\"todo-item\">\n        <b>Community</b>\n        <p>講師Communityを利用中です。</p>\n        <button class=\"btn\">Communityを見る</button>\n      </div>\n    </aside>\n  </d %;padding:12px;font-size:12px}.mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid var(--line);z-index:50}.mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;color:#45484b}\n}\n</style>\n</head>\n<body>\n<div class=\"app\">\n<aside class=\"side\"><div class=\"brand\">mikkeOS<small>Academy</small></div><div class=\"nav\"><div>ホーム</div><div>講座</div><div>販売プラン</div><div>開催</div><div>申込</div><div>認定</div><div>講師</div><div class=\"on\">ページ</div><div>設定</div></div></aside>\n<div>\n<header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>本部責任者 ▾</span></header>\n<main class=\"wrap\">\n<a class=\"back\" href=\"#\">← ページ一覧へ</a>\n<div class=\"headrow\">\n  <div class=\"title\"><h1>本部ホームページ</h1><p>Academyの講座・認定講師情報を使って、スクールの公式ホームページを作ります。</p></div>\n  \n</div>\n\n<div class=\"notice\"><b>販売ページ・講師営業ページと同じページビルダーを使用します。</b><br>講座・価格・講師プロフィールなどのAcademy情報は正本を参照し、ホームページ用に同じ情報を再入力しません。</div>\n\n<section class=\"panel on\" id=\"templates\">\n  <div class=\"tabs\">\n    <button class=\"tab on\" data-tab=\"templates\" onclick=\"switchTab('templates',this)\">テンプレート</button>\n    <button class=\"tab\" data-tab=\"builder\" onclick=\"switchTab('builder',this)\">ビルダー</button>\n    <button class=\"tab\" data-tab=\"publish\" onclick=\"switchTab('publish',this)\">公開</button>\n  </div>\n  <div class=\"card\" style=\"margin-bottom:12px\">\n    <h3>ホームページのテンプレートから作る</h3>\n    <div class=\"help\">完成したホームページ構成を選びます。講座や認定講師などのAcademy情報は自動で反映し、選択後は共通ビルダーで自由に編集できます。</div>\n  </div>\n  <div class=\"template-grid\">\n    <div class=\"template-card\"><div class=\"template-thumb\">ATELIER<br>CRAFT</div><div class=\"template-body\"><strong>ATELIER</strong><p>作品写真・講座・先生を軽やかに見せる、ハンドメイド・クラフト向け。</p><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\"><button onclick=\"previewTemplate('ATELIER')\">プレビュー</button><button onclick=\"useTemplate('ATELIER')\">このテンプレートを使う</button></div></div></div>\n    <div class=\"template-card\"><div class=\"template-thumb\">MODERN<br>SCHOOL</div><div class=\"template-body\"><strong>SCHOOL</strong><p>講座・認定制度・講師を整理して見せるスクール向け。</p><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\"><button onclick=\"previewTemplate('SCHOOL')\">プレビュー</button><button onclick=\"useTemplate('SCHOOL')\">このテンプレートを使う</button></div></div></div>\n    <div class=\"template-card\"><div class=\"template-thumb\">NATURAL<br>SALON</div><div class=\"template-body\"><strong>SALON</strong><p>世界観・サービス・人柄を中心に見せる美容・ウェルネス向け。</p><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\"><button onclick=\"previewTemplate('SALON')\">プレビュー</button><button onclick=\"useTemplate('SALON')\">このテンプレートを使う</button></div></div></div>\n    <div class=\"template-card\"><div class=\"template-thumb\">FOOD<br>STUDIO</div><div class=\"template-body\"><strong>FOOD & COOKING</strong><p>教室・メニュー・レッスン案内を写真中心で見せる構成。</p><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\"><button onclick=\"previewTemplate('FOOD')\">プレビュー</button><button onclick=\"useTemplate('FOOD')\">このテンプレートを使う</button></div></div></div>\n    <div class=\"template-card\"><div class=\"template-thumb\">SESSION<br>ROOM</div><div class=\"template-body\"><strong>SESSION</strong><p>相談・セッション・個別サービス向けの落ち着いた構成。</p><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\"><button onclick=\"previewTemplate('SESSION')\">プレビュー</button><button onclick=\"useTemplate('SESSION')\">このテンプレートを使う</button></div></div></div>\n    <div class=\"template-card\"><div class=\"template-thumb\">CREATIVE<br>LAB</div><div class=\"template-body\"><strong>CREATIVE</strong><p>クリエイティブ・ビジネス講座をシャープに見せる構成。</p><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\"><button onclick=\"previewTemplate('CREATIVE')\">プレビュー</button><button onclick=\"useTemplate('CREATIVE')\">このテンプレートを使う</button></div></div></div>\n  </div>\n</section>\n\n<section class=\"panel\" id=\"builder\">\n  \n  <div class=\"builder-layout\">\n    <aside class=\"builder-side\">\n      <div class=\"left-sticky-controls\">\n        <div class=\"tabs left-tabs\">\n          <button class=\"tab\" data-tab=\"templates\" onclick=\"switchTab('templates',this)\">テンプレート</button>\n          <button class=\"tab on\" data-tab=\"builder\" onclick=\"switchTab('builder',this)\">ビルダー</button>\n          <button class=\"tab\" data-tab=\"publish\" onclick=\"switchTab('publish',this)\">公開</button>\n        </div>\n        <div class=\"left-page-actions single\">\n          <button class=\"btn\">ページ設定</button>\n        </div>\n      </div>\n      <h3>セクションを追加</h3>\n      <div class=\"group-title\">ACADEMY連携</div>\n      <div class=\"block data\">＋ 講座一覧</div>\n      <div class=\"block data\">＋ 講座から探す</div>\n      <div class=\"block data\">＋ 認定講師一覧</div>\n      <div class=\"block data\">＋ 講師から探す</div>\n      <div class=\"block data\">＋ 開催予定</div>\n      <div class=\"group-title\">自由セクション</div>\n      <div class=\"block free\">＋ HERO</div>\n      <div class=\"block free\">＋ テキスト</div>\n      <div class=\"block free\">＋ 画像</div>\n      <div class=\"block free\">＋ 本部・スクール紹介</div>\n      <div class=\"block free\">＋ ギャラリー</div>\n      <div class=\"block free\">＋ お客様の声</div>\n      <div class=\"block free\">＋ FAQ</div>\n      <div class=\"block free\">＋ CTA / ボタン</div>\n      <div class=\"block free\">＋ 区切り</div>\n    </aside>\n\n    <div class=\"canvas\">\n      <div class=\"canvas-page\">\n        <div class=\"canvas-section\">\n          <div class=\"public\">\n            <div class=\"pub-top\"><div class=\"pub-brand\">灯りのアトリエ</div><div class=\"pub-nav\">ABOUT　COURSES　INSTRUCTORS　FAQ</div></div>\n            <section class=\"hero\">\n              <div class=\"hero-copy\"><div class=\"eyebrow\">AKARI NO ATELIER</div><h2>手を動かす時間が、<br>暮らしの灯りになる。</h2><p>キャンドルづくりを基礎から学べる教室です。体験レッスンから認定講座まで、自分に合った学び方を選べます。</p><button class=\"cta\">講座を探す</button></div>\n              <div class=\"hero-img\"></div>\n            </section>\n          </div>\n        </div>\n\n        <div class=\"canvas-section\">\n          <section class=\"section\">\n            <div class=\"section-head\"><b>COURSES</b><h3>講座から探す</h3><p>Academyで公開中の販売プランから表示します。</p></div>\n            <div class=\"course-grid\">\n              <div class=\"course-card\"><div class=\"course-photo\"></div><div class=\"course-body\"><b>COURSE</b><strong>ベーシックキャンドルコース</strong><p>基礎から順番に学べる3講座コース。</p></div></div>\n              <div class=\"course-card\"><div class=\"course-photo\"></div><div class=\"course-body\"><b>WORKSHOP</b><strong>季節のキャンドル体験</strong><p>初めての方にもおすすめの1DAY体験。</p></div></div>\n              <div class=\"course-card\"><div class=\"course-photo\"></div><div class=\"course-body\"><b>COURSE</b><strong>アロマ基礎講座</strong><p>香りと素材の基本を学ぶ講座。</p></div></div>\n            </div>\n          </section>\n        </div>\n\n        <div class=\"canvas-section\">\n          <section class=\"section alt\">\n            <div class=\"section-head\"><b>FIND</b><h3>自分に合った受講方法を探す</h3><p>講座からでも、先生からでも探せます。</p></div>\n            <div class=\"split-entry\">\n              <div class=\"entry-box\"><strong>講座から探す</strong><p>受けたい講座 → 対面 / オンライン → 対面なら希望エリアから対応講師を探します。</p><button>講座から探す</button></div>\n              <div class=\"entry-box\"><strong>講師から探す</strong><p>先生のプロフィール・活動地域・対応講座を見て、先生から選べます。</p><button>講師から探す</button></div>\n            </div>\n          </section>\n        </div>\n\n        <div class=\"canvas-section\">\n          <section class=\"section\">\n            <div class=\"section-head\"><b>INSTRUCTORS</b><h3>認定講師</h3><p>掲載条件を満たしている講師の共通プロフィールを自動表示します。</p></div>\n            <div class=\"teacher-grid\">\n              <div class=\"teacher-card\"><div class=\"teacher-photo\"></div><div class=\"teacher-body\"><b>東京都杉並区</b><strong>鈴木 里奈</strong><p>対面 / オンライン<br>キャンドル認定講座</p></div></div>\n              <div class=\"teacher-card\"><div class=\"teacher-photo\"></div><div class=\"teacher-body\"><b>東京都中野区</b><strong>山田 花子</strong><p>対面<br>キャンドル認定講座</p></div></div>\n              <div class=\"teacher-card\"><div class=\"teacher-photo\"></div><div class=\"teacher-body\"><b>オンライン</b><strong>佐藤 美香</strong><p>オンライン<br>アロマ認定講座</p></div></div>\n            </div>\n          </section>\n        </div>\n\n        <div class=\"canvas-section\">\n          <section class=\"section alt\">\n            <div class=\"about-grid\"><div class=\"about-img\"></div><div class=\"about-copy\"><h3>灯りのアトリエについて</h3><p>手を動かすこと、学ぶこと、誰かに伝えること。キャンドルを通して、小さな活動を長く続けられる場所を目指しています。</p></div></div>\n          </section>\n        </div>\n\n        <div class=\"canvas-section\">\n          <section class=\"section\">\n            <div class=\"section-head\"><b>FAQ</b><h3>よくある質問</h3></div>\n            <div class=\"faq\"><div class=\"faq-item\">Q. 初めてでも参加できますか？</div><div class=\"faq-item\">Q. オンラインでも受講できますか？</div><div class=\"faq-item\">Q. 認定講座について教えてください。</div></div>\n          </section>\n        </div>\n        <div class=\"canvas-section\"><footer class=\"pub-footer\"><span>© 灯りのアトリエ</span><span>利用規約　プライバシーポリシー</span></footer></div>\n      </div>\n    </div>\n\n    <aside class=\"builder-settings\">\n      <div class=\"sticky-actions\">\n        <button class=\"btn\">PC</button>\n        <button class=\"btn\">スマホ</button>\n        <button class=\"btn\">プレビュー</button>\n        <button class=\"btn orange\">保存</button>\n      </div>\n      <h3>選択中：HERO</h3>\n      <div class=\"setting\"><label>小見出し</label><input value=\"AKARI NO ATELIER\"></div>\n      <div class=\"setting\"><label>見出し</label><textarea>手を動かす時間が、暮らしの灯りになる。</textarea></div>\n      <div class=\"setting\"><label>紹介文</label><textarea>キャンドルづくりを基礎から学べる教室です。</textarea></div>\n      <div class=\"setting\"><label>画像</label><button class=\"btn\" style=\"width:100%\">画像を変更</button></div>\n      <div class=\"setting\"><label>ボタン</label><select><option>講座を探す</option><option>講師を探す</option><option>なし</option></select></div>\n      <div class=\"lock-note\">講座一覧・認定講師一覧などのAcademy連携セクションは、正本データを参照します。講座名・公式価格・講師プロフィール等をホームページ用に別入力しません。</div>\n    </aside>\n  </div>\n</section>\n\n<section class=\"panel\" id=\"publish\">\n  <div class=\"tabs\">\n    <button class=\"tab\" data-tab=\"templates\" onclick=\"switchTab('templates',this)\">テンプレート</button>\n    <button class=\"tab\" data-tab=\"builder\" onclick=\"switchTab('builder',this)\">ビルダー</button>\n    <button class=\"tab on\" data-tab=\"publish\" onclick=\"switchTab('publish',this)\">公開</button>\n  </div>\n  <div class=\"publish-grid\">\n    <div class=\"publish-card\">\n      <h3>公開</h3><p>保存と公開は別です。内容を確認してから公式ホームページとして公開します。</p>\n      <div class=\"status-row\"><span class=\"pill gray\">現在：下書き</span></div>\n      <div class=\"url-box\"><input value=\"https://academy.mikke.app/akari-atelier\" readonly><button class=\"btn\">URLをコピー</button></div>\n      <div class=\"check-list\">\n        <div class=\"check\"><span>HERO・スクール紹介</span><b>設定済み</b></div>\n        <div class=\"check\"><span>公開中の講座</span><b>3件</b></div>\n        <div class=\"check\"><span>HP掲載対象の認定講師</span><b>3名</b></div>\n        <div class=\"check\"><span>講座から探す / 講師から探す</span><b>表示中</b></div>\n        <div class=\"check\"><span>スマホプレビュー</span><b>確認してください</b></div>\n      </div>\n      <div class=\"actions\" style=\"justify-content:flex-start;margin-top:16px\"><button class=\"btn orange\">ホームページを公開</button><button class=\"btn\">プレビュー</button></div>\n    </div>\n    <div class=\"preview-card\">\n      <h3>公開ページ</h3><p>公開後はこのURLから本部・スクールの公式ページを確認できます。</p>\n      <div style=\"margin-top:16px;padding:18px;border-radius:12px;background:linear-gradient(135deg,#dceee6,#f4dfdb);height:180px;display:flex;align-items:end;font-size:18px;font-weight:900\">灯りのアトリエ</div>\n      <button class=\"btn\" style=\"width:100%;margin-top:12px\">公開ページを見る</button>\n    </div>\n  </div>\n</section>\n\n</main></div></div>\n\n\n<div class=\"mobile-save\" id=\"mobileSave\">\n  <button class=\"btn orange\">保存</button>\n</div>\n\n<nav class=\"mobile-bottom\">\n<a href=\"#\">ホーム</a><a href=\"#\">講座</a><a href=\"#\">申込</a><a href=\"#\" style=\"color:var(--blue)\">ページ</a><a href=\"#\">その他</a>\n</nav>\n\n<div class=\"template-modal\" id=\"templateModal\">\n  <div class=\"template-modal-inner\">\n    <div class=\"template-modal-head\">\n      <strong id=\"templateModalTitle\">テンプレートプレビュー</strong>\n      <button class=\"btn\" onclick=\"closeTemplatePreview()\">閉じる</button>\n    </div>\n    <div class=\"template-modal-body\">\n      <div class=\"template-preview-page\">\n        <div class=\"pub-top\"><div class=\"pub-brand\">灯りのアトリエ</div><div class=\"pub-nav\">ABOUT　COURSES　INSTRUCTORS　FAQ</div></div>\n        <section class=\"hero\">\n          <div class=\"hero-copy\"><div class=\"eyebrow\">AKARI NO ATELIER</div><h2>手を動かす時間が、<br>暮らしの灯りになる。</h2><p>テンプレートの完成イメージをここで確認します。</p><button class=\"cta\">講座を探す</button></div>\n          <div class=\"hero-img\"></div>\n        </section>\n        <section class=\"section\"><div class=\"section-head\"><b>COURSES</b><h3>講座から探す</h3><p>講座情報はAcademyから反映されます。</p></div></section>\n        <section class=\"section alt\"><div class=\"section-head\"><b>INSTRUCTORS</b><h3>認定講師</h3><p>講師プロフィールは共通プロフィールから反映されます。</p></div></section>\n      </div>\n    </div>\n  </div>\n</div>\n\n<script>\nfunction switchTab(id,el){\n  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));\n  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));\n  document.getElementById(id).classList.add('on');\n  document.querySelectorAll('[data-tab=\"'+id+'\"]').forEach(x=>x.classList.add('on'));\n  document.querySelector('.wrap').classList.toggle('builder-full', id==='builder');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction useTemplate(name){\n  document.querySelector('[data-tab=builder]').click();\n}\nfunction previewTemplate(name){\n  document.getElementById('templateModalTitle').textContent = name + '｜テンプレートプレビュー';\n  document.getElementById('templateModal').classList.add('on');\n}\nfunction closeTemplatePreview(){\n  document.getElementById('templateModal').classList.remove('on');\n}\n<\\/script>\n</body></html>"}, {"group": "本部", "title": "設定", "filename": "academy-ui-31-headquarters-settings-v0.2.html", "status": "確認版", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-31 Headquarters Settings v0.2</title>\n<style>\n:root{--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;--ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3;--white:#fff}\n*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:var(--ink);background:var(--bg)}\nbutton,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}.brand{font-size:18px;font-weight:850;padding:4px 10px 20px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}.nav div{padding:10px 12px;border-radius:9px;margin:2px 0;color:#565860}.nav .on{background:var(--blue);color:#fff;font-weight:750}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.wrap{max-width:1100px;margin:auto;padding:30px 30px 80px}\n.titlebar{background:var(--green);padding:12px 16px 10px;border-radius:13px 13px 0 0}.titlebar .en{font-size:15px;font-weight:900;letter-spacing:.08em;color:#fff}.titlebar .jp{font-size:10px;font-weight:750;margin-top:4px}.headbox{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:18px}.headbox p{margin:0;color:var(--muted);line-height:1.65}\n.tabs{display:flex;gap:7px;overflow-x:auto;margin:18px 0 14px;padding-bottom:2px}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:850;white-space:nowrap}.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}.panel{display:none}.panel.on{display:block}\n.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card+.card{margin-top:12px}.card h2{font-size:14px;margin:0 0 5px}.help{font-size:11px;color:var(--muted);line-height:1.55}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:12px}.field label{display:block;font-size:10px;font-weight:850;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;font-size:12px}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-size:10px;font-weight:850}.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}.note{margin-top:10px;background:#f5faf7;border:1px solid #dfece5;border-radius:10px;padding:10px 11px;font-size:10px;color:#617068;line-height:1.55}\n.media-grid{display:grid;grid-template-columns:1.6fr .8fr;gap:14px;margin-top:12px}.hero-preview{height:170px;border-radius:14px;background:linear-gradient(120deg,#7eb89f,#a8d0bd);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}.logo-preview{height:170px;border-radius:14px;background:#fafafa;border:1px dashed #cfd2d6;display:grid;place-items:center}.logo-circle{width:86px;height:86px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);font-weight:900}\n.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.summary-box{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafafa}.summary-box b{display:block;font-size:10px;margin-bottom:3px}.summary-box span{font-size:13px;font-weight:850}.link-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:11px}.arrow{font-size:17px;color:#aaa}\n.method{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:10px}.method-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.method-head strong{font-size:12px}.status{font-size:9px;padding:5px 7px;border-radius:999px;font-weight:850}.status.ok{background:#eaf7f0;color:#3d765e}\n.template-list,.notice-list,.role-list{display:grid;gap:8px;margin-top:12px}.template-row,.notice-item,.role{border:1px solid var(--line);border-radius:11px;padding:11px 12px}.template-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.template-row strong,.notice-item strong,.role strong{font-size:12px}.template-row p,.notice-item p,.role p{font-size:10px;color:var(--muted);margin:3px 0 0;line-height:1.5}\n.mail-layout{display:grid;grid-template-columns:240px 1fr;gap:12px}.mail-list{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}.mail-item{padding:9px 10px;border-radius:8px;font-size:10px;font-weight:800}.mail-item.on{background:#eef0ff;color:#4652a7}.mail-editor{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:9px;background:#fff}\n@media(max-width:820px){.app{display:block}.side{display:none}.top{height:54px;padding:0 14px}.wrap{padding:16px 12px 80px}.grid2,.media-grid,.summary-row,.mail-layout{grid-template-columns:1fr}}\n</style>\n</head><body>\n<div class=\"app\">\n<aside class=\"side\"><div class=\"brand\">mikkeOS<small>Academy</small></div><div class=\"nav\"><div>ホーム</div><div>講座</div><div>販売プラン</div><div>開催</div><div>申込</div><div>認定</div><div>講師</div><div>ページ</div><div class=\"on\">設定</div></div></aside>\n<div><header class=\"top\"><strong>灯りのアトリエ キャンドル教室</strong><span>本部責任者 ▾</span></header><main class=\"wrap\">\n<div class=\"titlebar\"><div class=\"en\">SETTINGS</div><div class=\"jp\">本部設定</div></div>\n<div class=\"headbox\"><p>このAcademy本部で使う基本情報や決済方法、規約、メール、お知らせ、Community、スタッフ権限などを設定します。</p></div>\n<div class=\"tabs\">\n<button class=\"tab on\" onclick=\"showTab('basic',this)\">本部情報</button><button class=\"tab\" onclick=\"showTab('payment',this)\">決済</button><button class=\"tab\" onclick=\"showTab('terms',this)\">規約・契約書</button><button class=\"tab\" onclick=\"showTab('mail',this)\">通知メール</button><button class=\"tab\" onclick=\"showTab('notice',this)\">お知らせ</button><button class=\"tab\" onclick=\"showTab('community',this)\">Community</button><button class=\"tab\" onclick=\"showTab('roles',this)\">スタッフ・権限</button><button class=\"tab\" onclick=\"showTab('billing',this)\">利用料金</button>\n</div>\n\n<section class=\"panel on\" id=\"basic\">\n<div class=\"card\"><h2>本部情報</h2><div class=\"help\">このAcademy本部で使う名前や問い合わせ先などを設定します。</div>\n<div class=\"grid2\"><div class=\"field\"><label>本部名</label><input value=\"灯りのアトリエ\"></div><div class=\"field\"><label>問い合わせメール</label><input value=\"info@akari-atelier.jp\"></div></div>\n<div class=\"field\"><label>本部紹介</label><textarea>キャンドルを基礎から学び、楽しみながら技術を身につけられる教室です。</textarea></div>\n<div class=\"field\"><label>支払い案内の既定文</label><textarea>お申込み後、案内された期限までにお支払いください。</textarea></div>\n<div class=\"actions\"><button class=\"btn orange\">本部情報を保存</button></div></div>\n<div class=\"card\"><h2>本部表示</h2><div class=\"help\">このAcademy本部の画面に表示するロゴとHERO画像を設定します。本部ホームページの画像とは別に設定できます。</div>\n<div class=\"media-grid\"><div><div class=\"hero-preview\">ACADEMY HERO</div><div class=\"actions\" style=\"justify-content:flex-start\"><button class=\"btn\">HERO画像を変更</button><button class=\"btn\">削除</button></div></div><div><div class=\"logo-preview\"><div class=\"logo-circle\">AKARI</div></div><div class=\"actions\" style=\"justify-content:flex-start\"><button class=\"btn\">ロゴを変更</button></div></div></div>\n<div class=\"note\">ここで設定した画像は、このAcademy本部のホームや共通画面で使います。本部ホームページを作るときに、最初の画像として使うこともできます。</div><div class=\"actions\"><button class=\"btn orange\">表示設定を保存</button></div></div>\n</section>\n\n<section class=\"panel\" id=\"payment\"><div class=\"card\"><h2>本部の決済方法</h2><div class=\"help\">本部が受講料や登録料などを受け取るための支払い方法を設定します。講座ごとの金額や決済URLは、それぞれの販売プランで設定します。</div>\n<div class=\"method\"><div class=\"method-head\"><strong>銀行振込</strong><span class=\"status ok\">設定済み</span></div><div class=\"grid2\"><div class=\"field\"><label>銀行名</label><input value=\"〇〇銀行\"></div><div class=\"field\"><label>支店名</label><input value=\"荻窪支店\"></div><div class=\"field\"><label>口座種別・番号</label><input value=\"普通 1234567\"></div><div class=\"field\"><label>口座名義</label><input value=\"カ）アカリアトリエ\"></div></div></div>\n<div class=\"method\"><div class=\"method-head\"><strong>カード決済</strong><span class=\"status ok\">接続済み</span></div><div class=\"help\" style=\"margin-top:7px\">Academy上でカード決済を受け付ける場合は、Stripe Connectを使います。</div><div class=\"actions\" style=\"justify-content:flex-start\"><button class=\"btn\">接続状態を確認</button></div></div>\n<div class=\"method\"><div class=\"method-head\"><strong>外部の決済サービス</strong><span class=\"status ok\">利用する</span></div><div class=\"help\" style=\"margin-top:7px\">Squareなど、すでに使っている外部の決済サービスがある場合に設定します。実際の決済URLは販売プランごとに登録します。</div><div class=\"field\"><label>サービス名</label><input value=\"Square\"></div></div>\n<div class=\"actions\"><button class=\"btn orange\">決済設定を保存</button></div></div></section>\n\n<section class=\"panel\" id=\"terms\">\n<div class=\"card\"><h2>受講者向け規約・表示</h2><div class=\"help\">受講者がお申し込みするときに確認する規約や案内文を設定します。</div>\n<div class=\"template-list\">\n<div class=\"template-row\"><div><strong>共通申込規約</strong><p>すべての販売プランで共通して使う申込時のルール</p></div><button class=\"btn\">編集</button></div>\n<div class=\"template-row\"><div><strong>特定商取引法に基づく表記</strong><p>本部が販売者になるときに表示する販売者情報や支払い条件</p></div><button class=\"btn\">編集</button></div>\n<div class=\"template-row\"><div><strong>キャンセル・返金ポリシー</strong><p>キャンセル、日程変更、返金、無断キャンセルについてのルール</p></div><button class=\"btn\">編集</button></div>\n<div class=\"template-row\"><div><strong>プライバシーポリシー</strong><p>受講者の個人情報をどのように扱うか</p></div><button class=\"btn\">編集</button></div>\n</div></div>\n<div class=\"card\"><h2>講師向け契約・規約</h2><div class=\"help\">認定講師との契約書や講師向けの規約を作成します。ひな形から作って、本部に合わせて内容を変更できます。</div>\n<div class=\"actions\" style=\"justify-content:flex-start\"><button class=\"btn orange\">＋ 認定講師契約テンプレートから作る</button><button class=\"btn\">白紙から作る</button></div>\n<div class=\"template-list\"><div class=\"template-row\"><div><strong>認定講師契約書 v3</strong><p>現在使用中｜秘密保持、著作権、教材の使い方、ブランド利用、会費、更新、解約など</p></div><button class=\"btn\">編集</button></div><div class=\"template-row\"><div><strong>講師利用規約 v2</strong><p>現在使用中｜講師活動のルール、講座の品質、受講者対応など</p></div><button class=\"btn\">編集</button></div></div>\n<div class=\"note\">契約書や規約を更新しても、過去に同意した内容はそのまま記録として残します。</div></div>\n</section>\n\n<section class=\"panel\" id=\"mail\"><div class=\"mail-layout\"><div class=\"mail-list\">\n<div class=\"mail-item on\">申込受付</div><div class=\"mail-item\">支払い案内</div><div class=\"mail-item\">支払確認</div><div class=\"mail-item\">日程確定</div><div class=\"mail-item\">開催前案内</div><div class=\"mail-item\">認定完了</div><div class=\"mail-item\">証書発行</div><div class=\"mail-item\">講師登録案内</div><div class=\"mail-item\">開講ライセンス</div><div class=\"mail-item\">キット発送</div><div class=\"mail-item\">修了報告</div>\n</div><div class=\"mail-editor\"><h2>通知メールの本文</h2><div class=\"help\">自動で送るメールの件名と本文を本部で設定します。必要に応じて送信を止めることもできます。講師は送信内容を確認したり、必要なメールを再送できます。</div>\n<div class=\"field\"><label>件名</label><input value=\"{{title}} のお申込みを受け付けました\"></div>\n<div class=\"field\"><label>本文</label><textarea style=\"min-height:220px\">{{name}} 様\n\n{{title}} のお申込みを受け付けました。\n\nお申込み金額：{{price}}円\n\nお支払いについては本部の案内をご確認ください。</textarea></div>\n<div class=\"chips\"><span class=\"chip\">＋お名前</span><span class=\"chip\">＋講座名</span><span class=\"chip\">＋金額</span><span class=\"chip\">＋開催日時</span><span class=\"chip\">＋講師名</span></div>\n<div class=\"actions\"><button class=\"btn\">プレビュー</button><button class=\"btn\">既定に戻す</button><button class=\"btn orange\">保存</button></div><div class=\"link-row\"><span>通知メールのログを見る</span><span class=\"arrow\">›</span></div>\n</div></div></section>\n\n<section class=\"panel\" id=\"notice\"><div class=\"card\"><h2>受講者へのお知らせ</h2><div class=\"help\">受講者に見せる本部からのお知らせを作成します。受講者の「お知らせ」ページと、受講者ホームに表示されます。</div>\n<div class=\"actions\" style=\"justify-content:flex-start\"><button class=\"btn orange\">＋ お知らせを作成</button></div>\n<div class=\"notice-list\"><div class=\"notice-item\"><strong>10/10開催についてのご案内</strong><p>重要｜ベーシックキャンドルコース｜公開中｜未読 4名</p></div><div class=\"notice-item\"><strong>レッスン教材の公開について</strong><p>アロマ基礎講座｜公開中｜未読 2名</p></div><div class=\"notice-item\"><strong>秋のキャンドル作品展のお知らせ</strong><p>全受講者｜下書き</p></div></div>\n</div></section>\n\n<section class=\"panel\" id=\"community\"><div class=\"card\"><h2>Communityの利用と連携</h2><div class=\"help\">このAcademyと連携するCommunityやRoomを選びます。講師が参加必須か任意かは、販売プランごとに設定します。</div>\n<div class=\"field\"><label>接続するCommunity</label><select><option>AYUMI ATELIER</option><option>mikkeOS Official Academy</option></select></div>\n<div class=\"summary-row\"><div class=\"summary-box\"><b>利用者</b><span>2名</span></div><div class=\"summary-box\"><b>招待中</b><span>1名</span></div><div class=\"summary-box\"><b>未招待</b><span>1名</span></div></div>\n<div class=\"link-row\"><span>招待して参加する流れを見る</span><span class=\"arrow\">›</span></div><div class=\"link-row\"><span>接続先と利用範囲を設定する</span><span class=\"arrow\">›</span></div>\n</div></section>\n\n<section class=\"panel\" id=\"roles\"><div class=\"card\"><h2>スタッフ・権限</h2><div class=\"help\">本部スタッフごとに、どこまで操作できるかを設定します。</div>\n<div class=\"role-list\"><div class=\"role\"><strong>本部責任者</strong><p>本部情報、スタッフ、講座、公開設定など、すべてを管理できます。</p></div><div class=\"role\"><strong>本部運営担当</strong><p>本部情報の編集、スタッフ招待、講座運営などができます。</p></div><div class=\"role\"><strong>講座編集担当</strong><p>講座、販売ページ、教材を編集できます。</p></div></div></div>\n<div class=\"card\"><h2>本部メンバー</h2><div class=\"grid2\"><div class=\"field\"><label>mikke ID</label><input placeholder=\"@username\"></div><div class=\"field\"><label>役割</label><select><option>本部運営担当</option><option>講座編集担当</option></select></div></div><div class=\"actions\"><button class=\"btn orange\">招待</button></div><div class=\"link-row\"><span>本部責任者｜利用中</span><span>本部責任者</span></div></div>\n</section>\n\n<section class=\"panel\" id=\"billing\"><div class=\"card\"><h2>Academy利用料金</h2><div class=\"help\">Academyの利用料金と、登録講師数数を確認できます。料金の確認や支払い手続きもここから行います。</div>\n<div class=\"summary-row\"><div class=\"summary-box\"><b>今月の利用料金</b><span>5,000円</span></div><div class=\"summary-box\"><b>登録講師数</b><span>21名</span></div><div class=\"summary-box\"><b>次回の利用料金</b><span>確認中</span></div></div>\n<div class=\"link-row\"><span>料金プランを見る</span><span class=\"arrow\">›</span></div><div class=\"link-row\"><span>支払い・契約内容を確認する</span><span class=\"arrow\">›</span></div>\n</div></section>\n\n</main></div></div>\n<script>\nfunction showTab(id,el){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');el.classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}\n<\\/script>\n</body></html>"}, {"group": "講師", "title": "講師ホーム", "filename": "academy-ui-14-instructor-portal-v0.1.html", "status": "確認版", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-14 Instructor Portal v0.1</title>\n<style>\n:root{--pink:#f9d3d2;--yellow:#ffd370;--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;--ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3}\n*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}\n.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}.brand{font-size:18px;font-weight:800;padding:4px 10px 20px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}.nav div{padding:10px 12px;border-radius:9px;margin:2px 0;color:#565860}.nav .on{background:var(--blue);color:#fff;font-weight:700}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.wrap{max-width:1100px;margin:auto;padding:30px 30px 80px}\n.titlebar{background:var(--green);padding:12px 16px 10px;border-radius:13px 13px 0 0}.titlebar .en{color:#fff;font-size:15px;font-weight:900;letter-spacing:.08em}.titlebar .jp{color:#202126;font-size:10px;font-weight:750;margin-top:4px}\n.headbox{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:18px}.headbox p{margin:0;color:var(--muted);line-height:1.65}.create{background:var(--orange);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:850;white-space:nowrap;cursor:pointer}\n.guide{display:flex;gap:8px;align-items:center;margin:18px 0 0;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:11px;overflow:auto;white-space:nowrap}.guide b{color:#4f806c}\n.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card h2{font-size:14px;margin:0 0 5px}.card h3{font-size:12px;margin:0 0 8px}.help{font-size:11px;color:var(--muted);line-height:1.55}\n.profile{display:flex;gap:12px;align-items:center}.avatar{width:62px;height:62px;border-radius:11px;background:linear-gradient(135deg,#dbeee6,var(--green));display:grid;place-items:center;font-weight:900;color:#47725f}.profile strong{display:block;font-size:14px;margin-bottom:4px}.profile p{font-size:11px;color:var(--muted);margin:0}\n.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.status-card{border:1px solid var(--line);border-radius:11px;padding:12px}.status-card b{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.status-card strong{font-size:13px}\n.toggle-list{display:grid;gap:10px;margin-top:10px}.toggle-row{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px 12px}.toggle-row strong{display:block;font-size:12px}.toggle-row p{font-size:11px;color:var(--muted);margin:3px 0 0}.switch{width:44px;height:24px;border-radius:999px;background:#d7d8db;position:relative;flex:0 0 auto;cursor:pointer}.switch.on{background:var(--green)}.switch:after{content:\"\";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.switch.on:after{left:23px}\n.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 13px}.item strong{display:block;font-size:12px;margin-bottom:4px}.item p{font-size:11px;color:var(--muted);line-height:1.45;margin:0}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.green{background:#eaf7f0;color:#3d765e}.yellow{background:#fff3c9;color:#7b6100}.blue{background:#eef1ff;color:#4051a6}.gray{background:#eee;color:#666}.orange{background:#fff0e7;color:#a24c2d}\n.section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}\n.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:700;color:#555;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.orange{background:var(--orange);color:#fff;border-color:var(--orange)}\n.link-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.link-card{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}.link-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.05)}.link-card strong{display:block;font-size:12px;margin-bottom:4px}.link-card p{font-size:11px;color:var(--muted);line-height:1.45;margin:0}\n.todo{position:sticky;top:80px}.todo-item{border-top:1px solid var(--line);padding:11px 0}.todo-item:first-of-type{border-top:0}.todo-item b{display:block;font-size:11px;margin-bottom:4px}.todo-item p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 8px}\n.message-preview{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.message-preview strong{display:block;font-size:11px;margin-bottom:5px}.message-preview p{font-size:11px;color:var(--muted);line-height:1.5;margin:0}\n@media(max-width:820px){.app{display:block}.side{display:none}.top{height:54px;padding:0 14px}.wrap{padding:16px 12px 80px}.headbox{display:block}.headbox .create{width:100%;margin-top:13px}.grid{grid-template-columns:1fr}.todo{position:static}.status-grid,.link-grid{grid-template-columns:1fr}.profile{align-items:flex-start}}\n</style>\n</head>\n<body>\n<div class=\"app\">\n<aside class=\"side\">\n  <div class=\"brand\">mikkeOS<small>Academy｜講師</small></div>\n  <div class=\"nav\">\n    <div class=\"on\">ホーム</div>\n    <div>申込</div>\n    <div>開催</div>\n    <div>開講</div>\n    <div>修了報告</div>\n    <div>マニュアル</div>\n    <div>Community</div>\n    <div>本部メッセージ</div>\n    <div>設定</div>\n  </div>\n</aside>\n\n<div>\n<header class=\"top\"><strong>灯りのアトリエ｜講師ページ</strong><span>鈴木 里奈 ▾</span></header>\n<main class=\"wrap\">\n\n<div class=\"titlebar\"><div class=\"en\">INSTRUCTOR HOME</div><div class=\"jp\">講師ホーム</div></div>\n<div class=\"headbox\">\n  <p>申込・担当依頼・開催・開講・修了報告、本部からのお知らせを確認します。</p>\n  <button class=\"create\">講師営業ページを見る</button>\n</div>\n\n<div class=\"guide\"><b>申込</b><span>→</span><b>開催</b><span>→</span><b>開講ライセンス</b><span>→</span><b>修了報告</b><span>→</span><b>本部認定</b></div>\n\n<div class=\"grid\">\n  <div>\n    <div class=\"card\">\n      <div class=\"profile\">\n        <div class=\"avatar\">鈴</div>\n        <div><strong>鈴木 里奈</strong><p>講師番号 L-0012 / ベーシックキャンドルコース</p></div>\n      </div>\n\n      <div class=\"status-grid\">\n        <div class=\"status-card\"><b>講師ライセンス</b><strong>有効</strong></div>\n        <div class=\"status-card\"><b>講師契約</b><strong>契約中</strong></div>\n        <div class=\"status-card\"><b>Community</b><strong>利用中</strong></div>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"margin-top:12px\">\n      <h3>活動・掲載・受付</h3>\n      <div class=\"help\">この3つは講師本人が切り替えます。</div>\n\n      <div class=\"toggle-list\">\n        <div class=\"toggle-row\">\n          <div><strong>活動中</strong><p>一時的に活動を休止する場合はOFFにします。</p></div>\n          <div class=\"switch on\" onclick=\"this.classList.toggle('on')\"></div>\n        </div>\n        <div class=\"toggle-row\">\n          <div><strong>本部ホームページに掲載</strong><p>本部HPの講師一覧へ掲載するかを選びます。</p></div>\n          <div class=\"switch on\" onclick=\"this.classList.toggle('on')\"></div>\n        </div>\n        <div class=\"toggle-row\">\n          <div><strong>新規申込を受付</strong><p>新しい受講申込を受け付けるかを選びます。</p></div>\n          <div class=\"switch on\" onclick=\"this.classList.toggle('on')\"></div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"margin-top:12px\">\n      <h3>対応できる開催方法</h3>\n      <div class=\"list\">\n        <div class=\"item\"><div><strong>対面</strong><p>杉並区・中野区</p></div><span class=\"badge green\">対応中</span></div>\n        <div class=\"item\"><div><strong>オンライン</strong><p>Zoomで対応できます。</p></div><span class=\"badge green\">対応中</span></div>\n      </div>\n      <div class=\"actions\"><button class=\"btn\">対応方法・地域を変更</button></div>\n    </div>\n\n    <di \n      </div>\n\n      <div class=\"setting-row\">\n        <div>\n          <strong>オンライン対応</strong>\n          <p>販売プランでオンラインが許可されている場合のみ利用できます。</p>\n        </div>\n        <div class=\"switch on\" id=\"swOnline\" onclick=\"this.classList.toggle('on')\"></div>\n      </div>\n\n      <div class=\"setting-field\">\n        <label>対面で対応できる地域</label>\n        <input id=\"certModalArea\" value=\"杉並区・中野区\">\n      </div>\n\n      <div class=\"cert-modal-note\">\n        本部が許可している範囲を超えて設定することはできません。契約・講師ライセンスが無効な場合は、本人設定がONでも掲載・受付されません。\n      </div>\n\n      <div class=\"cert-modal-actions\">\n        <button onclick=\"closeCertSettings()\">キャンセル</button>\n        <button class=\"save\" onclick=\"closeCertSettings()\">保存</button>\n      </div>\n    </div>\n  </div>\n</div>\n\n<nav class=\"mobile-bottom\" id=\"mobileBottom\"></nav>\n\n\n\n\n<div class=\"mobile-create-menu\" id=\"mobileCreateMenu\">\n  <a href=\"#opening\">開講手続き</a>\n  <a href=\"#schedule-new\">開催を追加</a>\n  <a href=\"#completion-report\">修了報告</a>\n</div>\n\n<script>\nlet personalRole='instructor';\n\nconst icons = {\n  home:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 10.5V20h13v-9.5\"/></svg>`,\n  application:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4V2.8h6V4M9 9h6M9 13h6M9 17h4\"/></svg>`,\n  event:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14\" rx=\"2\"/><path d=\"M8 3v5M16 3v5M4 10h16\"/></svg>`,\n  learn:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M4 5.5h6.5c1.1 0 1.5.5 1.5 1.5v12c0-1-.5-1.5-1.5-1.5H4z\"/><path d=\"M20 5.5h-6.5C12.5 5.5 12 6 12 7v12c0-1 .5-1.5 1.5-1.5H20z\"/></svg>`,\n  notice:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7\"/><path d=\"M10 19h4\"/></svg>`,\n  more:`<svg class=\"nav-icon\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/></svg>`\n};\n\n\nfunction setSwitch(id,on){\n  document.getElementById(id)?.classList.toggle('on',!!on);\n}\n\nfunction openCertSettings(title,course,area,activity,hp,application,online){\n  document.getElementById('certModalTitle').textContent=title;\n  document.getElementById('certModalCourse').textContent=course;\n  document.getElementById('certModalArea').value=area || '';\n  setSwitch('swActivity',activity);\n  setSwitch('swHp',hp);\n  setSwitch('swApplication',application);\n  setSwitch('swOnline',online);\n  document.getElementById('certSettingsModal').classList.add('open');\n}\n\nfunction closeCertSettings(){\n  document.getElementById('certSettingsModal').classList.remove('open');\n}\n\nfunction updateDesktopSideNav(){\n  document.querySelectorAll('#desktopSideNav [data-role]').forEach(el=>{\n    const role=el.getAttribute('data-role');\n    el.classList.toggle('hidden', !(role==='both' || role===personalRole));\n  });\n  document.querySelectorAll('#desktopSideNav > div').forEach(el=>el.classList.remove('on'));\n  const home=[...document.querySelectorAll('#desktopSideNav > div')].find(el=>el.textContent.trim()==='ホーム');\n  if(home) home.classList.add('on');\n}\n\nfunction renderMobileNav(){\n  const bottom=document.getElementById('mobileBottom');\n\n  if(personalRole==='instructor'){\n    bottom.innerHTML=`\n      <a class=\"nav-cell active\" href=\"#home\" onclick=\"mobileAction('home');return false\">${icons.home}<small>ホーム</small></a>\n      <a class=\"nav-cell\" href=\"#applications\">${icons.application}<small>申込</small></a>\n      <div class=\"create-slot\">\n        <button class=\"create-btn\" onclick=\"document.getElementById('mobileCreateMenu').classList.toggle('open')\" aria-label=\"作成\"></button>\n        <small class=\"create-label\">作成</small>\n      </div>\n      <a class=\"nav-cell\" href=\"#schedule\" onclick=\"mobileAction('schedule');return false\">${icons.event}<small>開催</small></a>\n      <a class=\"nav-cell\" href=\"#more\">${icons.more}<small>その他</small></a>\n    `;\n  }else{\n    bottom.innerHTML=`\n      <a class=\"nav-cell active\" href=\"#home\" onclick=\"mobileAction('home');return false\">${icons.home}<small>ホーム</small></a>\n      <a class=\"nav-cell\" href=\"#learning\" onclick=\"mobileAction('learn');return false\">${icons.learn}<small>学ぶ</small></a>\n      <a class=\"nav-cell\" href=\"#learner-schedule\">${icons.event}<small>予定</small></a>\n      <a class=\"nav-cell\" href=\"#notices\">${icons.notice}<small>お知らせ</small></a>\n      <a class=\"nav-cell\" href=\"#more\">${icons.more}<small>その他</small></a>\n    `;\n  }\n}\n\nfunction switchRole(role){\n  personalRole=role;\n  document.getElementById('instructorMode').classList.toggle('active',role==='instructor');\n  document.getElementById('learnerMode').classList.toggle('active',role==='learner');\n  document.getElementById('instructorSwitch').classList.toggle('active',role==='instructor');\n  document.getElementById('learnerSwitch').classList.toggle('active',role==='learner');\n  document.getElementById('mobileCreateMenu').classList.remove('open');\n  updateDesktopSideNav();\n  renderMobileNav();\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n\nfunction mobileAction(type){\n  if(type==='home'){\n    window.scrollTo({top:0,behavior:'smooth'});\n    return;\n  }\n  if(type==='schedule'){\n    document.getElementById('schedule')?.scrollIntoView({behavior:'smooth'});\n    return;\n  }\n  if(type==='learn'){\n    document.querySelector('#learnerMode .left>.block:nth-of-type(1)')?.scrollIntoView({behavior:'smooth'});\n  }\n}\n\nfunction pick(el,d,t,m){\n  document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));\n  el.classList.add('active');\n  document.getElementById('sd').textContent=d;\n  document.getElementById('st').textContent=t;\n  document.getElementById('sm').textContent=m;\n}\n\nupdateDesktopSideNav();\nrenderMobileNav();\n<\\/script>\n</body></html>"}, {"group": "講師", "title": "講師プロフィール・営業ページ", "filename": "academy-ui-16-instructor-profile-sales-page-v0.1.html", "status": "確認版", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Academy UI-16 Instructor Profile & Sales Page v0.1</title>\n<style>\n:root{\n  --pink:#f9d3d2;--yellow:#ffd370;--blue:#3f4eb5;--green:#8bc7ad;--orange:#f75a3b;\n  --ink:#202126;--muted:#777982;--line:#e8e8eb;--bg:#f7f6f3;--white:#fff;\n}\n*{box-sizing:border-box}\nbody{margin:0;font:14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:var(--ink);background:var(--bg)}\nbutton,input,textarea,select{font:inherit}\nbutton{cursor:pointer}\na{text-decoration:none;color:inherit}\n\n.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}\n.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px}\n.brand{font-size:18px;font-weight:800;padding:4px 10px 20px}\n.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}\n.nav div{padding:10px 12px;border-radius:9px;margin:2px 0;color:#565860}\n.nav .on{background:var(--blue);color:#fff;font-weight:700}\n.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}\n.wrap{max-width:1100px;margin:auto;padding:30px 30px 90px}\n\n.titlebar{background:var(--green);padding:12px 16px 10px;border-radius:13px 13px 0 0}\n.titlebar .en{color:#fff;font-size:15px;font-weight:900;letter-spacing:.08em}\n.titlebar .jp{color:#202126;font-size:10px;font-weight:750;margin-top:4px}\n.headbox{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:18px}\n.headbox p{margin:0;color:var(--muted);line-height:1.65}\n.create{background:var(--orange);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:850;white-space:nowrap}\n\n.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}\n.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:800}\n.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}\n\n.panel{display:none}\n.panel.on{display:block}\n\n.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}\n.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}\n.card h2{font-size:14px;margin:0 0 5px}\n.card h3{font-size:12px;margin:0 0 8px}\n.help{font-size:11px;color:var(--muted);line-height:1.55}\n\n.profile-head{display:flex;gap:14px;align-items:center}\n.avatar{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#dbeee6,var(--green));display:grid;place-items:center;font-weight:900;color:#47725f;font-size:18px}\n.profile-head strong{display:block;font-size:16px}\n.profile-head p{font-size:11px;color:var(--muted);line-height:1.5;margin:4px 0 0}\n\n.field{margin-top:12px}\n.field:first-child{margin-top:0}\n.field label{display:block;font-size:10px;font-weight:850;margin-bottom:6px}\n.field input,.field textarea,.field select{width:100%;border:1px solid #dcdde2;border-radius:10px;padding:10px 11px;background:#fff}\n.field textarea{min-height:92px;resize:vertical}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.upload{border:1px dashed var(--green);border-radius:12px;padding:15px;text-align:center;font-size:11px;color:#4f806c;background:#fbfefd}\n.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}\n.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:800;color:#555}\n.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}\n.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}\n\n.course-list{display:grid;gap:10px;margin-top:10px}\n.course-card{border:1px solid var(--line);border-radius:12px;padding:12px}\n.course-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}\n.course-card strong{display:block;font-size:12px}\n.course-card p{margin:3px 0 0;font-size:10px;color:var(--muted);line-height:1.45}\n.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}\n.badge{font-size:9px;padding:5px 7px;border-radius:999px;background:#f4f5f6;color:#555}\n.badge.on{background:#eaf7f0;color:#3d765e}\n.badge.off{background:#efefef;color:#777}\n.badge.warn{background:#fff3c9;color:#7b6100}\n\n.preview-shell{background:#ebeae8;border-radius:14px;padding:14px}\n.preview-page{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}\n.preview-top{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}\n.preview-top strong{font-size:12px}\n.preview-hero{padding:28px 22px;background:linear-gradient(135deg,#f6fbf8,#fff5f1)}\n.preview-hero small{font-size:9px;color:#4f806c;font-weight:900;letter-spacing:.08em}\n.preview-hero h2{font-size:24px;line-height:1.35;margin:7px 0 8px}\n.preview-hero p{font-size:11px;color:var(--muted);line-height:1.55;max-width:560px}\n.preview-profile{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;margin-top:14px}\n.preview-avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#dbeee6,var(--green));display:grid;place-items:center;font-weight:900;color:#47725f}\n.preview-profile strong{font-size:13px}\n.preview-profile p{margin:4px 0 0;font-size:10px;color:var(--muted);line-height:1.5}\n.preview-section{padding:18px 22px;border-top:1px solid var(--line)}\n.preview-section h3{font-size:14px;margin:0 0 10px}\n.preview-course{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:8px}\n.preview-course strong{display:block;font-size:12px}\n.preview-course p{margin:4px 0 0;font-size:10px;color:var(--muted);line-height:1.45}\n.price{font-size:20px;font-weight:900;margin-top:8px}\n.cta{display:inline-block;margin-top:10px;background:var(--orange);color:#fff;border-radius:9px;padding:10px 14px;font-size:10px;font-weight:850}\n\n.side-info{position:sticky;top:78px}\n.info-row{padding:10px 0;border-top:1px solid var(--line)}\n.info-row:first-of-type{border-top:0}\n.info-row b{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}\n.info-row span{font-size:11px;font-weight:700}\n.notice{margin-top:12px;border-radius:10px;padding:10px 11px;background:#fff8dc;font-size:10px;line-height:1.5}\n\n.mobile-bottom{display:none}\n\n@media(max-width:820px){\n  body{padding-bottom:74px}\n  .app{display:block}\n  .side{display:none}\n  .top{height:54px;padding:0 14px}\n  .wrap{padding:16px 12px 100px}\n  .headbox{display:block}\n  .headbox .create{width:100%;margin-top:13px}\n  .layout{grid-template-columns:1fr}\n  .side-info{position:static}\n  .grid2{grid-template-columns:1fr}\n  .preview-hero h2{font-size:21px}\n  .mobile-bottom{\n    position:fixed;display:grid;grid-template-columns:repeat(5,1fr);\n    left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid var(--line);z-index:30;\n    padding:0 6px env(safe-area-inset-bottom)\n  }\n  .mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#45484b}\n  .mobile-bottom small{font-size:9px;font-weight:700}\n  .nav-icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n  .mobile-bottom a:first-child{color:#4f806c}\n}\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n<aside class=\"side\">\n  <div class=\"brand\">mikkeOS<small>Academy｜講師</small></div>\n  <div class=\"nav\">\n    <div>ホーム</div>\n    <div>申込</div>\n    <div>開催</div>\n    <div>開講</div>\n    <div>修了報告</div>\n    <div>講師マニュアル</div>\n    <div>Community</div>\n    <div>本部メッセージ</div>\n    <div class=\"on\">営業ページ</div>\n    <div>設定</div>\n  </div>\n</aside>\n\n<div>\n<header class=\"top\">\n  <strong>灯りのアトリエ｜講師ページ</strong>\n  <span>鈴木 里奈 ▾</span>\n</header>\n\n<main class=\"wrap\">\n\n<div class=\"titlebar\">\n  <div class=\"en\">PROFILE & SALES PAGE</div>\n  <div class=\"jp\">プロフィール・営業ページ</div>\n</div>\n<div class=\"headbox\">\n  <p>プロフィール情報を整え、本部公式の講座情報と組み合わせて、お客様に見せる講師営業ページを作ります。</p>\n  <button class=\"create\" onclick=\"switchTab('preview')\">公開ページを見る</button>\n</div>\n\n<div class=\"tabs\">\n  <button class=\"tab on\" data-tab=\"profile\" onclick=\"switchTab('profile')\">プロフィール</button>\n  <button class=\"tab\" data-tab=\"sales\" onclick=\"switchTab('sales')\">営業ページ設定</button>\n  <button class=\"tab\" data-tab=\"preview\" onclick=\"switchTab('preview')\">プレビュー</button>\n</div>\n\n<!-- PROFILE -->\n<section class=\"panel on\" id=\"profile\">\n  <div class=\"layout\">\n    <div>\n      <div class=\"card\">\n        <div class=\"profile-head\">\n          <div class=\"avatar\">RINA</div>\n          <div>\n            <strong>鈴木 里奈</strong>\n            <p>キャンドル認定講師<br>プロフィールは本部HP・営業ページで共通利用します。</p>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>プロフィール</h3>\n        <div class=\"upload\">プロフィール写真を変更</div>\n\n        <div class=\"grid2\">\n          <div class=\"field\">\n            <label>表示名</label>\n            <input value=\"鈴木 里奈\">\n          </div>\n          <div class=\"field\">\n            <label>肩書き</label>\n            <input value=\"キャンドル認定講師\">\n          </div>\n        </div>\n\n        <div class=\"field\">\n          <label>自己紹介</label>\n          <textarea>東京・杉並区を中心に、初心者の方にも楽しんでいただけるキャンドルレッスンを開催しています。</textarea>\n        </div>\n\n        <div class=\"grid2\">\n          <div class=\"field\">\n            <label>活動地域</label>\n            <input value=\"東京都杉並区・中野区\">\n          </div>\n          <div class=\"field\">\n            <label>教室名（任意）</label>\n            <input value=\"Rina Candle Room\">\n          </div>\n        </div>\n\n        <div class=\"field\">\n          <label>教室・会場について</label>\n          <textarea>杉並区周辺で開催しています。詳しい会場はお申込み後にご案内します。</textarea>\n        </div>\n\n        <div class=\"grid2\">\n          <div class=\"field\">\n            <label>Instagram</label>\n            <input value=\"@rina_candle\">\n          </div>\n          <div class=\"field\">\n            <label>Web / SNSリンク</label>\n            <input placeholder=\"https://...\">\n          </div>\n        </div>\n\n        <div class=\"actions\">\n          <button class=\"btn\">プレビュー</button>\n          <button class=\"btn primary\">保存</button>\n        </div>\n      </div>\n    </div>\n\n    <aside class=\"card side-info\">\n      <h3>このプロフィールを使う場所</h3>\n      <div class=\"info-row\"><b>本部ホームページ</b><span>講師一覧・講師詳細</span></div>\n      <div class=\"info-row\"><b>講師営業ページ</b><span>自己紹介・写真・活動地域</span></div>\n      <div class=\"info-row\"><b>申込時</b><span>お客様が講師を選ぶときの情報</span></div>\n      <div class=\"notice\">講座ごとのHP掲載・申込受付は「あなたの認定」から設定します。</div>\n    </aside>\n  </div>\n</section>\n\n<!-- SALES SETTINGS -->\n<section class=\"panel\" id=\"sales\">\n  <div class=\"layout\">\n    <div>\n      <div class=\"card\">\n        <h3>掲載する講座</h3>\n        <div class=\"help\">本部の許可・講師ライセンス・あなたの活動設定を満たす講座だけ表示できます。</div>\n\n        <div class=\"course-list\">\n          <div class=\"course-card\">\n            <div class=\"course-card-head\">\n              <div>\n                <strong>ベーシックキャンドルコース</strong>\n                <p>本部公式価格 ¥18,000 / 対面・オンライン</p>\n              </div>\n              <span class=\"badge on\">掲載中</span>\n            </div>\n            <div class=\"badges\">\n              <span class=\"on\">HP掲載 ON</span>\n              <span class=\"on\">申込受付 ON</span>\n              <span class=\"on\">対面</span>\n              <span class=\"on\">オンライン</span>\n            </div>\n          </div>\n\n          <div class=\"course-card\">\n            <div class=\"course-card-head\">\n              <div>\n                <strong>アロマ基礎講座</strong>\n                <p>講師ライセンス有効</p>\n              </div>\n              <span class=\"badge off\">HP非掲載</span>\n            </div>\n            <div class=\"badges\">\n              <span class=\"off\">HP掲載 OFF</span>\n              <span class=\"on\">申込受付 ON</span>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>ページで追加できる内容</h3>\n        <div class=\"help\">本部公式情報は変更できません。講師本人の案内だけを追加します。</div>\n\n        <div class=\"field\">\n          <label>ページ用の紹介文</label>\n          <textarea>はじめての方でも安心して受講いただけるよう、ゆっくり丁寧に進めています。</textarea>\n        </div>\n\n        <div class=\"field\">\n          <label>開催・会場についての補足</label>\n          <textarea>対面レッスンの詳しい場所は、お申込み後にご案内します。</textarea>\n        </div>\n\n        <div class=\"field\">\n          <label>お客様へのメッセージ</label>\n          <textarea>キャンドルづくりが初めての方もお気軽にご参加ください。</textarea>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"margin-top:12px\">\n        <h3>受講料の受け取り方法</h3>\n        <div class=\"help\">講師自身が受注する場合の決済方法を設定します。本部販売の担当講師として開催する場合には使用しません。</div>\n\n        <div class=\"field\">\n          <label>決済方法</label>\n          <select>\n            <option>銀行振込</option>\n            <option>外部決済サービス</option>\n          </select>\n        </div>\n\n        <div class=\"field\">\n          <label>振込案内 / 決済URL</label>\n          <textarea placeholder=\"お客様へ表示する案内、または決済URL\"></textarea>\n        </div>\n\n        <div class=\"actions\">\n          <button class=\"btn\">プレビュー</button>\n          <button class=\"btn primary\">保存</button>\n        </div>\n      </div>\n    </div>\n\n    <aside class=\"card side-info\">\n      <h3>本部が管理する情報</h3>\n      <div class=\"info-row\"><b>講座名</b><span>変更できません</span></div>\n      <div class=\"info-row\"><b>公式説明・カリキュラム</b><span>本部設定を使用</span></div>\n      <div class=\"info-row\"><b>公式価格</b><span>講師は変更不可</span></div>\n      <div class=\"info-row\"><b>認定条件</b><span>本部設定を使用</span></div>\n      <div class=\"notice\">申込済みのお客様には、申込時点の価格・条件・規約を保持します。</div>\n    </aside>\n  </div>\n</section>\n\n<!-- PREVIEW -->\n<section class=\"panel\" id=\"preview\">\n  <div class=\"preview-shell\">\n    <div class=\"preview-page\">\n      <div class=\"preview-top\">\n        <strong>灯りのアトリエ 認定講師</strong>\n        <span style=\"font-size:10px;color:#777\">お客様から見るページ</span>\n      </div>\n\n      <div class=\"preview-hero\">\n        <small>CERTIFIED INSTRUCTOR</small>\n        <h2>鈴木里奈の<br>キャンドルレッスン</h2>\n        <p>東京・杉並区を中心に、初心者の方にも楽しんでいただけるキャンドルレッスンを開催しています。</p>\n\n        <div class=\"preview-profile\">\n          <div class=\"preview-avatar\">RINA</div>\n          <div>\n            <strong>鈴木 里奈｜キャンドル認定講師</strong>\n            <p>杉並区・中野区 / 対面・オンライン<br>@rina_candle</p>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"preview-section\">\n        <h3>受講できる講座</h3>\n\n        <div class=\"preview-course\">\n          <strong>ベーシックキャンドルコース</strong>\n          <p>材料と道具の基本から、制作、応用デザインまで学ぶ3講座のコースです。</p>\n          <div class=\"price\">¥18,000</div>\n          <div class=\"badges\">\n            <span class=\"on\">対面</span>\n            <span class=\"on\">オンライン</span>\n            <span>杉並区・中野区</span>\n          </div>\n          <span class=\"cta\">この先生に申し込む</span>\n        </div>\n      </div>\n\n      <div class=\"preview-section\">\n        <h3>先生からのメッセージ</h3>\n        <p style=\"font-size:11px;color:#666;line-height:1.65;margin:0\">はじめての方でも安心して受講いただけるよう、ゆっくり丁寧に進めています。キャンドルづくりが初めての方もお気軽にご参加ください。</p>\n      </div>\n\n      <div class=\"preview-section\">\n        <h3>会場について</h3>\n        <p style=\"font-size:11px;color:#666;line-height:1.65;margin:0\">杉並区周辺で開催しています。詳しい場所はお申込み後にご案内します。</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n</main>\n</div>\n</div>\n\n<nav class=\"mobile-bottom\">\n  <a href=\"#home\">\n ">スマホで確認</button><button class=\"btn\">プレビュー</button><button class=\"btn blue\">保存</button></div></div>\n<div class=\"course-select\"><div><strong>対象講座</strong><p>講座ごとに営業ページ・公開URL・QRコードを持てます。</p></div><select><option>ベーシックキャンドルコース</option><option>アロマ基礎講座</option><option>季節のクラフト認定</option></select></div><div class=\"notice\"><b>本部公式情報は講師側で変更できません。</b><br>講座名・公式説明・カリキュラム・価格・認定条件は本部設定を利用し、プロフィール・写真・紹介文・会場案内・補足・決済方法などを講師が編集します。</div>\n<div class=\"tabs\"><button class=\"tab on\" data-tab=\"standard\">標準ページ</button><button class=\"tab\" data-tab=\"templates\">テンプレート</button><button class=\"tab\" data-tab=\"builder\">ビルダー</button><button class=\"tab\" data-tab=\"publish\">公開・共有</button></div>\n<section class=\"panel on\" id=\"standard\"><div class=\"two\"><div><div class=\"preview-shell\"><div class=\"browser\"><div class=\"browserbar\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span><div class=\"url\">https://academy.mikke.app/instructor/rina/basic-candle-course</div></div><div class=\"public\"><div class=\"pub-top\"><div class=\"pub-brand\">灯りのアトリエ <small>Certified Instructor</small></div><div class=\"pub-nav\">先生について　講座　受講方法　お申込み</div></div><section class=\"hero\"><div class=\"hero-copy\"><div class=\"eyebrow\">CERTIFIED INSTRUCTOR</div><h2>鈴木里奈の<br>キャンドルレッスン</h2><p>東京・杉並区を中心に、初心者の方にも楽しんでいただけるキャンドルレッスンを開催しています。</p><div class=\"hero-meta\"><span class=\"pill\">対面</span><span class=\"pill\">オンライン</span><span class=\"pill\">杉並区・中野区</span></div><button class=\"cta\">この先生に申し込む</button></div><div class=\"hero-img\"></div></section><section class=\"section\"><div class=\"section-head\"><b>INSTRUCTOR</b><h3>先生について</h3></div><div class=\"teacher-profile\"><div class=\"teacher-photo\">RINA</div><div><strong>鈴木 里奈｜キャンドル認定講師</strong><p>はじめての方でも安心して受講いただけるよう、ゆっくり丁寧に進めています。</p></div></div></section><section class=\"section alt\"><div class=\"section-head\"><b>COURSE</b><h3>この先生から受講できる講座</h3></div><div class=\"course-box\"><b>OFFICIAL COURSE</b><h4>ベーシックキャンドルコース</h4><p>材料と道具の基本から、制作、応用デザインまで。3つの講座を順番に学ぶコースです。</p><div class=\"official-label\">講座内容・価格・認定条件は本部公式情報です。</div><div class=\"price\">¥18,000</div></div></section><section class=\"section\"><div class=\"section-head\"><b>STYLE</b><h3>受講について</h3></div><div class=\"info-grid\"><div class=\"info\"><b>対面</b><strong>杉並区・中野区</strong><p>詳しい会場はお申込み後にご案内します。</p></div><div class=\"info\"><b>オンライン</b><strong>Zoom</strong><p>全国から受講できます。</p></div><div class=\"info\"><b>日程</b><strong>申込後に相談</strong><p>希望日を確認して日程を決定します。</p></div><div class=\"info\"><b>受講料</b><strong>¥18,000</strong><p>本部公式価格です。</p></div></div></section><section class=\"section alt\"><div class=\"section-head\"><b>MESSAGE</b><h3>先生からのメッセージ</h3><p>キャンドルづくりを楽しみながら、ひとつずつ身につけていきましょう。</p></div></section><section class=\"section\"><div class=\"course-box\"><h4>この先生に申し込む</h4><p>受講方法・希望日を選んでお申込みへ進みます。</p><button class=\"cta\">お申込みへ</button></div></section></div></div></div></div><aside><div class=\"card\"><h3>標準ページ</h3><div class=\"help\">本部公式情報＋講師プロフィール＋講座ごとの活動設定から自動で作ります。このまま公開できます。</div><div class=\"summary-list\"><div class=\"sum\"><span>講師</span><span>鈴木 里奈</span></div><div class=\"sum\"><span>講座</span><span>ベーシックキャンドルコース</span></div><div class=\"sum\"><span>HP掲載</span><span>ON</span></div><div class=\"sum\"><span>申込受付</span><span>ON</span></div><div class=\"sum\"><span>公開状態</span><span>下書き</span></div></div></div><div class=\"card\" style=\"margin-top:12px\"><h3>ページの作り方</h3><div class=\"mode-cards\"><div class=\"mode\"><strong>このまま使う</strong><p>標準ページをそのまま営業ページとして使います。</p><button class=\"plain\">このページを使う</button></div><div class=\"mode\"><strong>ビルダーでカスタム</strong><p>標準ページを土台に、配置・写真・文章・セクションを編集します。</p><button class=\"builder\" onclick=\"switchTab('builder')\">ビルダーを開く</button></div><div class=\"mode\"><strong>テンプレートから作る</strong><p>完成テンプレートに本部公式情報とプロフィールを流し込みます。</p><button class=\"template\" onclick=\"switchTab('templates')\">テンプレートを見る</button></div></div></div></aside></div></section>\n<section class=\"panel\" id=\"templates\"><div class=\"card\" style=\"margin-bottom:12px\"><h3>テンプレートから作る</h3><div class=\"help\">本部公式情報・価格・認定条件は変えず、ページの見せ方だけを選びます。選択後はビルダーで編集できます。</div></div><div class=\"template-grid\"><div class=\"template-card\"><div class=\"template-thumb\">Handmade<br>& Craft</div><div class=\"template-body\"><strong>ハンドメイド・クラフト</strong><p>作品写真と講師プロフィールを大きく見せる構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Beauty<br>& Wellness</div><div class=\"template-body\"><strong>美容・ウェルネス</strong><p>安心感と人柄が伝わる構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Lesson<br>& School</div><div class=\"template-body\"><strong>レッスン・スクール</strong><p>講座内容・受講方法を整理して見せる構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Private<br>Lesson</div><div class=\"template-body\"><strong>個人レッスン</strong><p>先生の紹介と日程相談を中心にした構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Simple<br>Profile</div><div class=\"template-body\"><strong>シンプルプロフィール</strong><p>名刺代わりに使いやすいコンパクト構成。</p><button>このテンプレートを使う</button></div></div><div class=\"template-card\"><div class=\"template-thumb\">Story<br>Style</div><div class=\"template-body\"><strong>ストーリー型</strong><p>講師の想い・活動・講座を順番に伝える構成。</p><button>このテンプレートを使う</button></div></div></div></section>\n<section class=\"panel\" id=\"builder\"><div class=\"builder-tools\"><div class=\"left\"><button class=\"btn\">標準ページに戻す</button><button class=\"btn\" onclick=\"switchTab('templates')\">テンプレート変更</button></div><div class=\"right\"><button class=\"btn\">スマホ</button><button class=\"btn\">プレビュー</button><button class=\"btn blue\">保存</button></div></div><div class=\"builder-layout\"><aside class=\"builder-side\"><h3>セクションを追加</h3><div class=\"block\">＋ HERO</div><div class=\"block\">＋ 講師プロフィール</div><div class=\"block\">＋ 文章</div><div class=\"block\">＋ 画像</div><div class=
